name: Proof Engine Pilot Tests

on:
  pull_request:
    paths:
      - "proof_engine_pilot/**"
      - "pilot_runs/reconnect_pilot_p3/**"
      - "tests/test_proof_engine_pilot.py"
      - "tests/test_proof_engine_review.py"
      - "tests/test_proof_engine_learning.py"
      - "tests/test_proof_engine_asset_draft.py"
      - "tests/test_proof_engine_asset_review.py"
      - "tests/test_proof_engine_public_wording.py"
      - ".github/workflows/proof-engine-pilot-tests.yml"
  push:
    branches: [main]
    paths:
      - "proof_engine_pilot/**"
      - "pilot_runs/reconnect_pilot_p3/**"
      - "tests/test_proof_engine_pilot.py"
      - "tests/test_proof_engine_review.py"
      - "tests/test_proof_engine_learning.py"
      - "tests/test_proof_engine_asset_draft.py"
      - "tests/test_proof_engine_asset_review.py"
      - "tests/test_proof_engine_public_wording.py"
      - ".github/workflows/proof-engine-pilot-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify committed candidate run
        run: python -B -m proof_engine_pilot.cli verify
      - name: Verify summary and review template
        run: |
          python -B -m proof_engine_pilot.cli summary
          python -B -m proof_engine_pilot.cli review-template
      - name: Verify deterministic generation
        run: |
          python -B -m proof_engine_pilot.cli generate --output /tmp/proof-engine-run.json
          diff -u proof_engine_pilot/runs/p3_run_0001.json /tmp/proof-engine-run.json
      - name: Verify append-only human review
        run: |
          python -B -m proof_engine_pilot.review_cli verify
          python -B -m proof_engine_pilot.review_cli summary
          python -B -m proof_engine_pilot.review_cli effective > /tmp/proof-engine-effective.json
      - name: Verify review-derived learning
        run: |
          python -B -m proof_engine_pilot.learning_cli verify
          python -B -m proof_engine_pilot.learning_cli summary
          python -B -m proof_engine_pilot.learning_cli replay > /tmp/proof-engine-learning-replay.json
      - name: Verify six-part internal asset draft
        run: |
          python -B -m proof_engine_pilot.asset_cli verify
          python -B -m proof_engine_pilot.asset_cli summary
          python -B -m proof_engine_pilot.asset_cli review-template > /tmp/proof-engine-asset-review-template.json
          python -B -m proof_engine_pilot.asset_cli generate --output /tmp/proof-engine-internal-assets.json
          python - <<'PY'
          import json
          from pathlib import Path
          draft = json.loads(Path('/tmp/proof-engine-internal-assets.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('proof_engine_pilot/assets/round_0001/internal_asset_manifest.json').read_text(encoding='utf-8'))
          assert draft['draft_fingerprint'] == manifest['expected_draft_fingerprint']
          PY
      - name: Verify append-only internal asset review
        run: |
          python -B -m proof_engine_pilot.asset_review_cli verify
          python -B -m proof_engine_pilot.asset_review_cli summary
          python -B -m proof_engine_pilot.asset_review_cli effective > /tmp/proof-engine-reviewed-assets.json
      - name: Verify audience-facing wording draft
        run: |
          python -B -m proof_engine_pilot.public_wording_cli verify
          python -B -m proof_engine_pilot.public_wording_cli summary
          python -B -m proof_engine_pilot.public_wording_cli review-template > /tmp/proof-engine-publication-review-template.json
          python -B -m proof_engine_pilot.public_wording_cli generate --output /tmp/proof-engine-public-wording.json
          python -B -m proof_engine_pilot.public_wording_cli render-markdown --output /tmp/proof-engine-public-wording.md
          python - <<'PY'
          import json
          from pathlib import Path
          from proof_engine_pilot.core import fingerprint
          draft = json.loads(Path('/tmp/proof-engine-public-wording.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('proof_engine_pilot/wording/round_0001/public_wording_manifest.json').read_text(encoding='utf-8'))
          markdown = Path('/tmp/proof-engine-public-wording.md').read_text(encoding='utf-8')
          assert draft['draft_fingerprint'] == manifest['expected_draft_fingerprint']
          assert fingerprint(markdown) == manifest['expected_markdown_fingerprint']
          PY
      - name: Run focused tests
        run: |
          python -B -m unittest discover -s tests -p 'test_proof_engine_pilot.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_review.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_learning.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_asset_draft.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_asset_review.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_public_wording.py' -v
      - name: Run full repository tests
        run: python -B -m unittest discover -s tests -v
