name: Event Assist Phoenix Meteor

on:
  pull_request:
    paths:
      - 'thin-rts/event-assist/**'
      - 'thin-rts/phoenix/**'
      - 'thin-rts/continuity/**'
      - 'thin-rts/cloud-custody/**'
      - '.github/workflows/event-assist-phoenix-meteor.yml'

permissions:
  contents: read

jobs:
  event-assist-meteor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Compile bounded binder and tests
        working-directory: thin-rts/event-assist
        run: python3 -m py_compile event_state.py test_event_state.py test_meteor_event_state.py

      - name: Run Event Assist base plus Meteor regressions
        working-directory: thin-rts/event-assist
        run: python3 -m unittest -v test_event_state.py test_meteor_event_state.py

      - name: Exercise frozen and real-pilot goal fixtures
        working-directory: thin-rts/event-assist
        run: |
          python3 event_state.py goal fixtures/case_m_rental_move_in.json --at 2026-08-13T01:00:00Z > "$RUNNER_TEMP/case-m.json"
          python3 event_state.py goal fixtures/case_b_childbirth_current_sources.json --at 2026-08-13T01:00:00Z > "$RUNNER_TEMP/case-b.json"
          python3 event_state.py goal fixtures/pilot_pr319_completion_audit.json --at 2026-08-13T01:30:00Z > "$RUNNER_TEMP/pilot.json"
          python3 - "$RUNNER_TEMP/case-m.json" "$RUNNER_TEMP/case-b.json" "$RUNNER_TEMP/pilot.json" <<'PY'
          import json, sys
          case_m, case_b, pilot = [json.load(open(path, encoding='utf-8')) for path in sys.argv[1:]]
          assert case_m['classification'] == 'UNKNOWN_OR_BLOCKED'
          assert 'EVIDENCE_GAPS_PRESENT' in case_m['blocking_states']
          assert case_b['classification'] == 'PASS'
          assert pilot['classification'] == 'PASS'
          assert pilot['authority']['promote'] == 'BLOCKED'
          PY

  creator-absent-phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run creator-absent replacement probe
        working-directory: thin-rts/phoenix
        run: python3 -m unittest -v test_event_assist_phoenix.py

  inherited-custody-continuity:
    runs-on: ubuntu-latest

    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Re-run inherited Cloud Custody Meteor deaths
        working-directory: thin-rts/cloud-custody
        run: python3 -m unittest -v test_custody.py test_meteor_custody.py test_meteor_custody_round2.py

      - name: Re-run provider-neutral Continuity deaths
        working-directory: thin-rts/continuity
        run: python3 -m unittest -v test_continuity.py

      - name: Re-run real GPG alternate-domain recovery
        working-directory: thin-rts/continuity
        run: python3 -m unittest -v test_continuity_custody_integration.py
