name: FRZ-000023 Validate Once

on:
  push:
    branches:
      - feature/frz-000023-false-green-test-adequacy-gate-v1
    paths:
      - .github/workflows/frz-000023-validate-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000023-false-green-test-adequacy-gate-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K2 baseline adequacy lanes
        run: python -m unittest tests.test_test_adequacy_gate -v
      - name: K2 destructive DA / Counter-DA target
        run: python -m unittest tests.test_test_adequacy_gate_da -v
      - name: K1 regression
        run: python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: FREEZER verify
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m freezer.preflight verify
