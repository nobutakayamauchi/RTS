name: FRZ-000021 DA Repair Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-da-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce intended DA deaths
        run: |
          python -m unittest tests.test_review_necessity_triage -v
          python -m unittest tests.test_review_necessity_triage_da -v && exit 1 || true
      - name: Apply minimal fail-closed repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('review_necessity_triage/core.py')
          s=p.read_text()
          old='''    if signals:\n        impact = max(signal.impact for signal in signals)\n        causal = max(signal.causal_reach for signal in signals)\n        factors = [signal.signal_id for signal in signals]\n        paths = sorted({path for signal in signals for path in signal.causal_paths})\n        explicit = any(signal.explicit_contract and signal.impact >= 3 for signal in signals)\n    elif marketing:\n        impact, causal, factors, paths, explicit = 1, 1, ["marketing_only"], [], False\n    elif pure_noise or docs_link:\n        impact, causal, factors, paths, explicit = 0, 0, ["non_actionable_surface"], [], False\n    else:\n'''
          new='''    if signals:\n        explicit = any(signal.explicit_contract and signal.impact >= 3 for signal in signals)\n        if (pure_noise or docs_link) and not explicit:\n            impact, causal, factors, paths = 0, 0, ["non_actionable_surface"], []\n        elif marketing and not explicit:\n            impact, causal, factors, paths = 1, 1, ["marketing_only"], []\n        else:\n            impact = max(signal.impact for signal in signals)\n            causal = max(signal.causal_reach for signal in signals)\n            factors = [signal.signal_id for signal in signals]\n            paths = sorted({path for signal in signals for path in signal.causal_paths})\n    elif marketing:\n        impact, causal, factors, paths, explicit = 1, 1, ["marketing_only"], [], False\n    elif pure_noise or docs_link:\n        impact, causal, factors, paths, explicit = 0, 0, ["non_actionable_surface"], [], False\n    else:\n'''
          if s.count(old)!=1:
              raise SystemExit(f'DA signal marker mismatch: {s.count(old)}')
          s=s.replace(old,new)
          old2='''        if int(da["causal_reach"]) >= 4 and classification != "HUMAN_NOW":\n            raise ReviewTriageError("high causal reach must be HUMAN_NOW")\n        if int(da["impact"]) >= 4 and classification != "HUMAN_NOW":\n            raise ReviewTriageError("high impact must be HUMAN_NOW")\n        if int(gap) >= 2 and max(int(da["human_review_importance"]), int(counter["human_review_importance"])) >= 3 and classification != "HUMAN_NOW":\n            raise ReviewTriageError("material high-value perspective gap must be HUMAN_NOW")\n'''
          new2='''        if classification != "REVIEW_BLOCKED":\n            if int(da["causal_reach"]) >= 4 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high causal reach must be HUMAN_NOW")\n            if int(da["impact"]) >= 4 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high impact must be HUMAN_NOW")\n            if int(gap) >= 2 and max(int(da["human_review_importance"]), int(counter["human_review_importance"])) >= 3 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("material high-value perspective gap must be HUMAN_NOW")\n'''
          if s.count(old2)!=1:
              raise SystemExit(f'blocked priority marker mismatch: {s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Counter-DA and focused regression
        run: |
          python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
          python -m unittest tests.test_semantic_claim_refinement tests.test_semantic_claim_refinement_da -v
          python -m unittest tests.test_official_docs_intake tests.test_official_docs_intake_da -v
          python -m unittest tests.test_model_transition_intelligence tests.test_model_transition_intelligence_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Commit repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add review_necessity_triage/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: preserve adversarial review priority boundaries'
          git push origin HEAD:feature/frz-000021-human-review-necessity-da-v1
