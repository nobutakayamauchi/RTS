name: Second Case Build Probe

on:
  pull_request:
    paths:
      - ".github/workflows/second-case-build-probe.yml"
      - "proof_engine_pilot/**"
      - "pilot_runs/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export generated second-case package
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          from proof_engine_pilot.report_operational_validation_build import verify_second_case_package

          out = Path('/tmp/second-case-package')
          out.mkdir(parents=True, exist_ok=True)
          bundle = verify_second_case_package()
          values = {
              'dynamic-fingerprints.json': bundle['dynamic_fingerprints'],
              'report.json': bundle['report_json'],
              'report.md': bundle['report_markdown'],
              'evidence-inventory.json': bundle['evidence_inventory'],
              'comparison-matrix.json': bundle['comparison_matrix'],
              'acceptance-packet.json': bundle['acceptance_packet'],
              'verification-summary.json': bundle['verification_summary'],
              'rollback-index.json': bundle['rollback_index'],
              'package-summary.json': bundle['summary'],
              'build-checkpoint.json': bundle['build_checkpoint'],
          }
          for name, value in values.items():
              path = out / name
              if isinstance(value, str):
                  path.write_text(value + ('\n' if not value.endswith('\n') else ''), encoding='utf-8')
              else:
                  path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: second-case-generated-package
          path: /tmp/second-case-package
          if-no-files-found: error
