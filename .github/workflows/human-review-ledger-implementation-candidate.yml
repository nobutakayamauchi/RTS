name: Human Review Ledger Implementation Candidate

on:
  pull_request:

permissions:
  contents: write

jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Integrate Human Review Ledger
        id: integrate
        continue-on-error: true
        run: python .github/scripts/finalize_human_review_ledger_implementation.py > integration-output.txt 2>&1
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-integration-output
          path: integration-output.txt
      - name: Require integration
        if: steps.integrate.outcome != 'success'
        run: |
          cat integration-output.txt
          exit 1
      - name: Verify governed records
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
      - name: Run full tests
        id: tests
        continue-on-error: true
        run: python -B -m unittest discover -s tests -v > test-output.txt 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-implementation-test-output
          path: test-output.txt
      - name: Require full tests
        if: steps.tests.outcome != 'success'
        run: |
          tail -n 250 test-output.txt
          exit 1
      - name: Finalize exact implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f integration-output.txt test-output.txt
          git rm .github/scripts/finalize_human_review_ledger_implementation.py
          git rm .github/workflows/human-review-ledger-implementation-candidate.yml
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/freezer-tests.yml \
            governed_loop/README.md \
            governed_loop/generation.py \
            governed_loop/models.py \
            governed_loop/schemas/loop_run.schema.json \
            governed_loop/runs/current.json \
            tests/test_governed_loop.py
          git commit -m "Integrate Human Review Ledger v1"
          git push origin "HEAD:${HEAD_BRANCH}"
