name: FRZ-000023 Start Once

on:
  push:
    branches:
      - feature/frz-000023-false-green-test-adequacy-gate-v1
    paths:
      - .github/workflows/frz-000023-start-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000023-false-green-test-adequacy-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify K1 completed, 000023 absent, WIP clear
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def current(item_id):
              p=json.loads((Path('freezer/items')/item_id/'current.json').read_text())
              return json.loads(Path(p['path']).read_text())
          assert current('RTS-FRZ-000022')['status']=='COMPLETED'
          assert not Path('freezer/items/RTS-FRZ-000023/current.json').exists()
          active=[]
          for p in Path('freezer/items').glob('RTS-FRZ-*/current.json'):
              row=current(p.parent.name)
              if row['status']=='IN_PROGRESS': active.append(row['item_id'])
          assert active==[], active
          print('K1 COMPLETED; 000023 absent; WIP clear')
          PY
      - name: Capture FRZ-000023
        run: python -m freezer.cli add --input docs/implementation/frz000023_inputs/item_input.json
      - name: Build assessment
        run: python -m freezer.build_assessment create RTS-FRZ-000023 --input docs/implementation/frz000023_inputs/build_assessment_input.json
      - name: Preflight
        run: python -m freezer.preflight create RTS-FRZ-000023 --input docs/implementation/frz000023_inputs/preflight_input.json
      - name: Apply explicit user approval from current conversation
        run: python -m freezer.cli revise RTS-FRZ-000023 --input docs/implementation/frz000023_inputs/approve_selected.json
      - name: Enter governed WIP
        run: python -m freezer.cli revise RTS-FRZ-000023 --input docs/implementation/frz000023_inputs/start_in_progress.json
      - name: Verify governed start
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m freezer.preflight verify
          python - <<'PY'
          import json
          from pathlib import Path
          def current(item_id):
              p=json.loads((Path('freezer/items')/item_id/'current.json').read_text())
              return json.loads(Path(p['path']).read_text())
          k=current('RTS-FRZ-000023')
          assert k['status']=='IN_PROGRESS', k
          assert k['build_authority']=='APPROVED', k
          active=[]
          for p in Path('freezer/items').glob('RTS-FRZ-*/current.json'):
              row=current(p.parent.name)
              if row['status']=='IN_PROGRESS': active.append(row['item_id'])
          assert active==['RTS-FRZ-000023'], active
          print('FRZ-000023 IN_PROGRESS; WIP=1')
          PY
      - name: Commit governed FREEZER start
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add freezer
          git diff --cached --quiet && exit 1 || true
          git commit -m 'freezer: start FRZ-000023 false-green test adequacy gate v1'
          git push origin HEAD:feature/frz-000023-false-green-test-adequacy-gate-v1
