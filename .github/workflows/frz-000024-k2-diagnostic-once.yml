name: FRZ-000024 K2 Diagnostic Once

on:
  push:
    branches:
      - feature/frz-000024-catalog-cost-false-green-repair-v1
    paths:
      - .github/workflows/frz-000024-k2-diagnostic-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000024-catalog-cost-false-green-repair-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate repair and capture K2 diagnostics
        run: |
          python docs/implementation/frz000024_repair.py
          python - <<'PY'
          import json
          from pathlib import Path
          from test_adequacy_gate import run_mutation_suite, evaluate_test_adequacy
          from tests.test_test_adequacy_gate import collect_nonmutation_lanes
          mutation=run_mutation_suite()
          kb,ho,mm=collect_nonmutation_lanes()
          report=evaluate_test_adequacy(mutation,known_bad=kb,held_out=ho,metamorphic=mm)
          out={
            'mutation_audit': mutation['audit'],
            'mutants': [
              {k:r.get(k) for k in ('id','kind','status','match_count','load_ok','tests_ran','test_returncode','output_tail')}
              for r in mutation['results']
            ],
            'known_bad': kb,
            'held_out': ho,
            'metamorphic': mm,
            'adequacy_status': report['status'],
            'lanes': report['lanes'],
          }
          Path('docs/implementation/frz000024_k2_diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit K2 diagnostic
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add docs/implementation/frz000024_k2_diagnostic.json
          git commit -m 'test: capture FRZ-000024 K2 diagnostic'
          git push origin HEAD:feature/frz-000024-catalog-cost-false-green-repair-v1
