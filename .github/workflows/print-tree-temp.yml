name: Print Tree Temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  print-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture checkout tree
        run: git rev-parse 'HEAD^{tree}' > tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-tree-sha
          path: tree-sha.txt
