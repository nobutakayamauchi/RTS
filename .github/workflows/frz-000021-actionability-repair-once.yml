name: FRZ-000021 Actionability Repair Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-actionability-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add problem-solving reach boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('review_necessity_triage/core.py')
          s = p.read_text()

          marker = '''DESCRIPTIVE_CAPABILITY_PATTERNS: tuple[str, ...] = (\n    r"\\bmodel for\\b",\n    r"\\bmodel that\\b",\n    r"\\bengine with\\b",\n    r"\\bfeaturing\\b",\n    r"\\bcapabilit(?:y|ies)\\b",\n    r"\\bvideo generation\\b",\n    r"\\bimage generation\\b",\n    r"\\brobotic agents?\\b",\n    r"\\bstudio[- ]quality\\b",\n)\n\n\ndef _canonical(value: Any) -> str:\n'''
          replacement = '''DESCRIPTIVE_CAPABILITY_PATTERNS: tuple[str, ...] = (\n    r"\\bmodel for\\b",\n    r"\\bmodel that\\b",\n    r"\\bengine with\\b",\n    r"\\bfeaturing\\b",\n    r"\\bcapabilit(?:y|ies)\\b",\n    r"\\bvideo generation\\b",\n    r"\\bimage generation\\b",\n    r"\\brobotic agents?\\b",\n    r"\\bstudio[- ]quality\\b",\n)\n\nEXPECTED_BEHAVIOR_PATTERNS: tuple[str, ...] = (\n    r"\\bas expected\\b",\n    r"\\bexpected behavior\\b",\n    r"\\bby default\\b",\n    r"\\bdefault behavior\\b",\n    r"\\bcontinues? to\\b",\n    r"\\bremains?\\b",\n    r"\\bstill supports?\\b",\n    r"\\bunchanged\\b",\n    r"\\bnormal(?:ly)?\\b",\n)\n\nCHANGE_TRIGGER_PATTERNS: tuple[str, ...] = (\n    r"\\bbreaking changes?\\b",\n    r"\\bmigrat(?:e|es|ed|ion|ing)\\b",\n    r"\\bdeprecat(?:e|es|ed|ion|ing)\\b",\n    r"\\bremoved\\b",\n    r"\\brenamed\\b",\n    r"\\bnow uses?\\b",\n    r"\\bchang(?:e|es|ed|ing)\\b",\n    r"\\bupdat(?:e|es|ed|ing)\\b",\n    r"\\breplac(?:e|es|ed|ing)\\b",\n    r"\\bnew default\\b",\n)\n\n\ndef _canonical(value: Any) -> str:\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'constants marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''def _signal_matches(anchor: str) -> list[AttentionSignal]:\n    matched: list[AttentionSignal] = []\n    for signal in SIGNALS:\n        if _matches_any(anchor, signal.patterns):\n            matched.append(signal)\n    return matched\n\n\ndef _da_case(anchor: str) -> dict[str, Any]:\n'''
          replacement = '''def _signal_matches(anchor: str) -> list[AttentionSignal]:\n    matched: list[AttentionSignal] = []\n    for signal in SIGNALS:\n        if _matches_any(anchor, signal.patterns):\n            matched.append(signal)\n    return matched\n\n\ndef _expected_behavior_context(anchor: str) -> bool:\n    return _matches_any(anchor, EXPECTED_BEHAVIOR_PATTERNS) and not _matches_any(anchor, CHANGE_TRIGGER_PATTERNS)\n\n\ndef _problem_solving_paths(anchor: str, signals: list[AttentionSignal], *, explicit: bool) -> list[str]:\n    if not explicit:\n        return []\n    normative = _matches_any(anchor, NORMATIVE_PATTERNS)\n    operational = _matches_any(anchor, OPERATIONAL_GUIDANCE_PATTERNS)\n    transition = _matches_any(anchor, CHANGE_TRIGGER_PATTERNS)\n    signal_ids = {signal.signal_id for signal in signals}\n    paths: set[str] = set()\n\n    if "future_breaking_version_transition" in signal_ids:\n        paths.add("SCHEDULE_ENGINE_IDENTITY_REVALIDATION")\n    if "migration_identity" in signal_ids and transition:\n        paths.add("MIGRATE_OR_REMAP_ENGINE_IDENTITY")\n\n    actionable_contract = normative or operational or transition\n    if not actionable_contract:\n        return sorted(paths)\n    if "execution_topology" in signal_ids:\n        paths.add("REVALIDATE_EXECUTION_STRATEGY")\n    if "reasoning_context_instructions" in signal_ids:\n        paths.add("ADJUST_OR_PROBE_REASONING_CONTEXT")\n    if "state_persistence" in signal_ids:\n        paths.add("ADJUST_OR_PROBE_STATE_STRATEGY")\n    if "tool_contract" in signal_ids:\n        paths.add("ADJUST_OR_PROBE_TOOL_STRATEGY")\n    if "request_response_schema" in signal_ids:\n        paths.add("ADAPT_OR_VERIFY_API_CONTRACT")\n    if "limits_usage" in signal_ids:\n        paths.add("RECALIBRATE_LIMIT_OR_BUDGET")\n    return sorted(paths)\n\n\ndef _da_case(anchor: str) -> dict[str, Any]:\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'helper marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''    importance = max(impact, causal)\n    return {\n        "lens": DA_LENS,\n        "impact": impact,\n        "causal_reach": causal,\n        "human_review_importance": importance,\n        "explicit_contract_signal": explicit,\n        "factors": factors,\n        "causal_paths": paths,\n        "causal_reach_is_probability": False,\n    }\n'''
          replacement = '''    importance = max(impact, causal)\n    expected_behavior = _expected_behavior_context(anchor)\n    solving_paths = _problem_solving_paths(anchor, signals, explicit=bool(explicit))\n    return {\n        "lens": DA_LENS,\n        "impact": impact,\n        "causal_reach": causal,\n        "human_review_importance": importance,\n        "explicit_contract_signal": explicit,\n        "factors": factors,\n        "causal_paths": paths,\n        "expected_behavior_context": expected_behavior,\n        "problem_solving_paths": solving_paths,\n        "problem_solving_reach": min(5, max(2, causal)) if solving_paths else 0,\n        "causal_reach_is_probability": False,\n    }\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'DA return marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''    return {\n        "lens": COUNTER_DA_LENS,\n        "human_review_importance": max(0, min(5, importance)),\n        "reasons": reasons,\n        "docs_claim_is_not_observed_behavior": True,\n    }\n'''
          replacement = '''    expected_behavior = _expected_behavior_context(anchor)\n    solving_paths = _problem_solving_paths(anchor, signals, explicit=bool(explicit))\n    return {\n        "lens": COUNTER_DA_LENS,\n        "human_review_importance": max(0, min(5, importance)),\n        "reasons": reasons,\n        "expected_behavior_context": expected_behavior,\n        "problem_solving_paths": solving_paths,\n        "problem_solving_reach": min(5, max(2, importance)) if solving_paths else 0,\n        "docs_claim_is_not_observed_behavior": True,\n    }\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'counter return marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''    gap = abs(int(da["human_review_importance"]) - int(counter["human_review_importance"]))\n    reasons: list[str] = []\n'''
          replacement = '''    gap = abs(int(da["human_review_importance"]) - int(counter["human_review_importance"]))\n    da_solving = list(da.get("problem_solving_paths", []))\n    counter_solving = list(counter.get("problem_solving_paths", []))\n    expected_without_solution = bool(da.get("expected_behavior_context")) and bool(counter.get("expected_behavior_context")) and not da_solving and not counter_solving\n    if expected_without_solution:\n        max_importance = max(int(da["human_review_importance"]), int(counter["human_review_importance"]))\n        if max_importance >= 2 or int(da["causal_reach"]) >= 2 or gap >= 2:\n            return "HUMAN_LATER", ["EXPECTED_BEHAVIOR_NO_PROBLEM_SOLVING_PATH"]\n        return "DEFER_LOW_VALUE", ["EXPECTED_BEHAVIOR_NO_PROBLEM_SOLVING_PATH"]\n\n    reasons: list[str] = []\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'classify marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''            "causal_reach_is_heuristic_not_probability": True,\n            "lower_priority_is_not_semantic_correctness": True,\n'''
          replacement = '''            "causal_reach_is_heuristic_not_probability": True,\n            "problem_solving_actionability_is_distinct_from_importance": True,\n            "lower_priority_is_not_semantic_correctness": True,\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'audit marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''        c_importance = counter.get("human_review_importance")\n        if not isinstance(c_importance, int) or not 0 <= c_importance <= 5:\n            raise ReviewTriageError("invalid Counter-DA importance")\n        if da.get("causal_reach_is_probability") is not False:\n'''
          replacement = '''        c_importance = counter.get("human_review_importance")\n        if not isinstance(c_importance, int) or not 0 <= c_importance <= 5:\n            raise ReviewTriageError("invalid Counter-DA importance")\n        for lens_name, lens in (("DA", da), ("Counter-DA", counter)):\n            if not isinstance(lens.get("expected_behavior_context"), bool):\n                raise ReviewTriageError(f"{lens_name} expected behavior marker missing")\n            solving_paths = lens.get("problem_solving_paths")\n            if not isinstance(solving_paths, list) or any(not isinstance(path, str) or not path for path in solving_paths):\n                raise ReviewTriageError(f"{lens_name} problem-solving paths invalid")\n            solving_reach = lens.get("problem_solving_reach")\n            if not isinstance(solving_reach, int) or not 0 <= solving_reach <= 5:\n                raise ReviewTriageError(f"{lens_name} problem-solving reach invalid")\n            if bool(solving_paths) != bool(solving_reach):\n                raise ReviewTriageError(f"{lens_name} problem-solving path/reach mismatch")\n        if da.get("causal_reach_is_probability") is not False:\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'verifier actionability marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          marker = '''        if classification != "REVIEW_BLOCKED":\n            if int(da["causal_reach"]) >= 4 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high causal reach must be HUMAN_NOW")\n            if int(da["impact"]) >= 4 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high impact must be HUMAN_NOW")\n            if int(gap) >= 2 and max(int(da["human_review_importance"]), int(counter["human_review_importance"])) >= 3 and classification != "HUMAN_NOW":\n                raise ReviewTriageError("material high-value perspective gap must be HUMAN_NOW")\n'''
          replacement = '''        if classification != "REVIEW_BLOCKED":\n            expected_without_solution = bool(da.get("expected_behavior_context")) and bool(counter.get("expected_behavior_context")) and not da.get("problem_solving_paths") and not counter.get("problem_solving_paths")\n            if expected_without_solution and classification == "HUMAN_NOW":\n                raise ReviewTriageError("expected behavior without a problem-solving path cannot be HUMAN_NOW")\n            if int(da["causal_reach"]) >= 4 and not expected_without_solution and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high causal reach must be HUMAN_NOW")\n            if int(da["impact"]) >= 4 and not expected_without_solution and classification != "HUMAN_NOW":\n                raise ReviewTriageError("high impact must be HUMAN_NOW")\n            if int(gap) >= 2 and max(int(da["human_review_importance"]), int(counter["human_review_importance"])) >= 3 and not expected_without_solution and classification != "HUMAN_NOW":\n                raise ReviewTriageError("material high-value perspective gap must be HUMAN_NOW")\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'verifier classify marker mismatch: {s.count(marker)}')
          s = s.replace(marker, replacement)

          p.write_text(s)

          t = Path('tests/test_review_necessity_triage_da.py')
          ts = t.read_text()
          marker = '''    def test_operational_reasoning_guidance_remains_human_now(self):\n        j = make_j("Use high or xhigh when more reasoning produces a measured quality gain.")\n        triage = triage_refinement_report(j)\n        record = triage["records"][0]\n        self.assertEqual(record["classification"], "HUMAN_NOW")\n        self.assertGreaterEqual(record["da"]["causal_reach"], 4)\n        self.assertTrue(record["da"]["explicit_contract_signal"])\n\n'''
          replacement = marker + '''    def test_expected_behavior_without_problem_solving_path_is_not_human_now(self):\n        j = make_j("The model still supports tool calling and parallel functions as expected.")\n        triage = triage_refinement_report(j)\n        record = triage["records"][0]\n        self.assertEqual(record["classification"], "HUMAN_LATER")\n        self.assertTrue(record["da"]["expected_behavior_context"])\n        self.assertEqual(record["da"]["problem_solving_reach"], 0)\n        self.assertEqual(record["counter_da"]["problem_solving_reach"], 0)\n        self.assertIn("EXPECTED_BEHAVIOR_NO_PROBLEM_SOLVING_PATH", record["human_review_reason_codes"])\n\n    def test_problem_solving_guidance_keeps_actionable_item_human_now(self):\n        j = make_j("If tool calling fails, disable parallel tool use and test the request again.")\n        triage = triage_refinement_report(j)\n        record = triage["records"][0]\n        self.assertEqual(record["classification"], "HUMAN_NOW")\n        self.assertGreater(record["da"]["problem_solving_reach"], 0)\n        self.assertIn("ADJUST_OR_PROBE_TOOL_STRATEGY", record["da"]["problem_solving_paths"])\n\n'''
          if ts.count(marker) != 1:
              raise SystemExit(f'test insertion marker mismatch: {ts.count(marker)}')
          t.write_text(ts.replace(marker, replacement))
          PY
      - name: Validate actionability DA and Counter-DA
        run: |
          python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
          python -m unittest tests.test_semantic_claim_refinement tests.test_semantic_claim_refinement_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Commit repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add review_necessity_triage/core.py tests/test_review_necessity_triage_da.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'feat: separate human importance from problem-solving reach'
          git push origin HEAD:feature/frz-000021-human-review-necessity-da-v1
