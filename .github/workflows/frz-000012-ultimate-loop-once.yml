            "rollback_boundary":"Revert restart_surface, restart sample, focused tests/docs, and RTS-FRZ-000012 lifecycle revisions only. Do not alter Child A or full-history sources.",
            "completion_conditions":["Required restart fields survive compaction exactly.","Over-budget surfaces fail closed instead of truncating.","Stale or escaped source pointers fail closed.","Restart-equivalence detects any missing or changed required state.","Explicit uncertainty and do-not-touch state remain representable.","Reopen-full-history and selective-recall routes are explicit and non-authorizing.","All focused and existing FREEZER tests pass.","Child B reaches COMPLETED while C-E remain FROZEN/NOT_APPROVED."],
            "decomposition":{"required":false,"child_candidates":[]},
            "risks":["A shorter surface can look successful while losing restart competence.","Self-referential current-head claims are not allowed; source commit is an explicit input identity.","Future callers could bypass equivalence validation."]
          }
          JSON
          printf '%s\n' '{"build_authority":"APPROVED","status":"SELECTED"}' > docs/implementation/frz000012_inputs/approve_selected.json
          printf '%s\n' '{"status":"IN_PROGRESS"}' > docs/implementation/frz000012_inputs/start_in_progress.json
          cat > docs/implementation/FRZ_000012_COMPACT_ACTIVE_RESTART_SURFACE_V1_TASK.md <<'EOF'
          # FRZ-000012 — Compact Active + Restart Surface v1

          Goal: keep the always-loaded restart state bounded without losing restart competence.

          Fixed restart denominator: goal, repo, branch, source commit, changed, verified, unresolved/UNKNOWN, rollback, do-not-touch, next authorized action. Deep history remains behind traceable source pointers. Over-budget state fails closed; it is never silently truncated. Restart state never grants execution or promotion authority.
          EOF

      - name: Govern B through BUILD_NOW PASS SELECTED IN_PROGRESS
        run: |
          set -euxo pipefail
          python -m freezer.build_assessment create RTS-FRZ-000012 --input docs/implementation/frz000012_inputs/build_assessment_input.json
          python -m freezer.build_assessment gate RTS-FRZ-000012 > /tmp/b-gate-ba.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/b-gate-ba.json'))
          assert g['recommendation']=='BUILD_NOW' and g['assessment_state']=='CURRENT' and not g['selection_ready'], g
          PY
          python -m freezer.preflight create RTS-FRZ-000012 --input docs/implementation/frz000012_inputs/preflight_input.json
          python -m freezer.cli revise RTS-FRZ-000012 --input docs/implementation/frz000012_inputs/approve_selected.json
          python -m freezer.build_assessment gate RTS-FRZ-000012 > /tmp/b-gate-selected.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/b-gate-selected.json'))
          assert g['preflight_state']=='PASS' and g['recommendation']=='BUILD_NOW' and g['selection_ready'] is True, g
          PY
          python -m freezer.cli revise RTS-FRZ-000012 --input docs/implementation/frz000012_inputs/start_in_progress.json
          python -m freezer.cli reindex
          python -m freezer.build_assessment reindex
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          active=[]
          for p in (root/'freezer/items').glob('RTS-FRZ-*/current.json'):
              q=json.loads(p.read_text()); x=json.loads((root/q['path']).read_text())
              if x['status']=='IN_PROGRESS': active.append(x['item_id'])
          assert active==['RTS-FRZ-000012'], active
          for i in ('RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              q=json.loads((root/'freezer/items'/i/'current.json').read_text()); x=json.loads((root/q['path']).read_text())
              assert x['status']=='FROZEN' and x['build_authority']=='NOT_APPROVED', x
          PY

      - name: Build initial B candidate and prove DA death
        run: |
          mkdir -p restart_surface restart tests
          cat > restart_surface/__init__.py <<'PY'
          from .core import RestartValidationError, build_surface, validate_surface, restart_equivalence, decide_restart, git_blob_sha_bytes
          __all__ = ['RestartValidationError','build_surface','validate_surface','restart_equivalence','decide_restart','git_blob_sha_bytes']
          PY
          cat > restart_surface/core.py <<'PY'
          from __future__ import annotations
          import json, hashlib
          from pathlib import Path

          class RestartValidationError(ValueError): pass
          FIELDS=('goal','repo','branch','commit','changed','verified','unresolved','rollback','do_not_touch','next_authorized_action')
          def git_blob_sha_bytes(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          def build_surface(repo_root, full_state, source_refs, max_active_chars=8000):
              # INITIAL CANDIDATE: deliberately flawed for DA. It drops do_not_touch
              # and silently truncates unresolved entries when over budget.
              s={k:full_state[k] for k in FIELDS if k!='do_not_touch'}
              s['source_refs']=source_refs; s['execution_authority']='NONE'; s['promotion_authority']='NONE'
              raw=json.dumps(s,sort_keys=True,ensure_ascii=False)
              if len(raw)>max_active_chars and isinstance(s.get('unresolved'),list):
                  s['unresolved']=s['unresolved'][:1]
              return s
          def validate_surface(repo_root, surface, max_active_chars=8000): return {'valid':True}
          def restart_equivalence(full_state, surface): return {'equivalent':all(surface.get(k)==full_state.get(k) for k in FIELDS)}
          def decide_restart(surface, request): return {'decision':'CONTINUE_FROM_SURFACE','execution_authority':'NONE','promotion_authority':'NONE'}
          PY
          cat > tests/test_restart_surface_da.py <<'PY'
          import tempfile, unittest
          from pathlib import Path
          from restart_surface import RestartValidationError, build_surface, restart_equivalence

          class RestartSurfaceDA(unittest.TestCase):
              def state(self):
                  return {'goal':'g','repo':'r','branch':'b','commit':'c'*40,'changed':['x'],'verified':['y'],'unresolved':['UNKNOWN: deployment identity'],'rollback':'revert B only','do_not_touch':['Child A'],'next_authorized_action':'verify'}
              def test_do_not_touch_cannot_be_lost(self):
                  s=build_surface(Path('.'),self.state(),[])
                  self.assertEqual(s['do_not_touch'],['Child A'])
              def test_overbudget_fails_instead_of_truncating(self):
                  x=self.state(); x['unresolved']=['UNKNOWN:'+('z'*5000), 'SECOND BLOCKER']
                  with self.assertRaises(RestartValidationError): build_surface(Path('.'),x,[],max_active_chars=500)
              def test_restart_equivalence_detects_required_loss(self):
                  s=build_surface(Path('.'),self.state(),[])
                  self.assertTrue(restart_equivalence(self.state(),s)['equivalent'])
          PY
          set +e
          python -m unittest tests.test_restart_surface_da -v
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'DA unexpectedly survived initial candidate' >&2
            exit 1
          fi
          echo "INITIAL_B_CANDIDATE_DIED_AS_REQUIRED rc=$rc" | tee /tmp/b-initial-death.txt

      - name: Minimal repair and permanent B implementation
        run: |
          cat > restart_surface/core.py <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          from typing import Any

          class RestartValidationError(ValueError):
              pass

          RESTART_FIELDS = (
              'goal','repo','branch','commit','changed','verified','unresolved',
              'rollback','do_not_touch','next_authorized_action'
          )
          LIST_FIELDS = {'changed','verified','unresolved','do_not_touch'}
          REOPEN_REASONS = {'OPERATOR_REQUEST','EQUIVALENCE_MISMATCH','UNRESOLVED_BLOCKER','STALE_SOURCE'}
          FORBIDDEN_INLINE_KEYS = {'full_history','raw_history','transcript','body','content','history_blob'}

          def git_blob_sha_bytes(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('utf-8') + data).hexdigest()

          def _contained(root: Path, rel: str) -> Path:
              p=(root/rel).resolve()
              rr=root.resolve()
              if p != rr and rr not in p.parents:
                  raise RestartValidationError(f'path escapes repository: {rel}')
              return p

          def _active_payload(surface: dict[str, Any]) -> dict[str, Any]:
              return {k:v for k,v in surface.items() if k != 'active_load_chars'}

          def active_load_chars(surface: dict[str, Any]) -> int:
              return len(json.dumps(_active_payload(surface),sort_keys=True,ensure_ascii=False,separators=(',',':')))

          def _validate_required_state(state: dict[str, Any]) -> None:
              for key in RESTART_FIELDS:
                  if key not in state:
                      raise RestartValidationError(f'missing restart field: {key}')
              for key in LIST_FIELDS:
                  if not isinstance(state[key], list) or not all(isinstance(x,str) for x in state[key]):
                      raise RestartValidationError(f'{key} must be list[str]')
              for key in set(RESTART_FIELDS)-LIST_FIELDS:
                  if not isinstance(state[key],str) or not state[key]:
                      raise RestartValidationError(f'{key} must be non-empty str')
              if len(state['commit']) < 7:
                  raise RestartValidationError('commit identity too short')

          def build_surface(repo_root: str|Path, full_state: dict[str,Any], source_refs: list[dict[str,str]], max_active_chars: int=8000) -> dict[str,Any]:
              _validate_required_state(full_state)
              surface={k:full_state[k] for k in RESTART_FIELDS}
              surface.update({
                  'schema_version':1,
                  'source_refs':source_refs,
                  'reopen_conditions':sorted(REOPEN_REASONS),
                  'selective_recall_interface':{'mode':'REQUEST_ONLY','authority':'NONE'},
                  'execution_authority':'NONE',
                  'promotion_authority':'NONE',
              })
              surface['active_load_chars']=active_load_chars(surface)
              if surface['active_load_chars'] > max_active_chars:
                  raise RestartValidationError(f'active surface over budget: {surface["active_load_chars"]}>{max_active_chars}')
              validate_surface(repo_root,surface,max_active_chars=max_active_chars)
              return surface

          def validate_surface(repo_root: str|Path, surface: dict[str,Any], max_active_chars: int=8000) -> dict[str,Any]:
              root=Path(repo_root)
              _validate_required_state(surface)
              if surface.get('schema_version') != 1:
                  raise RestartValidationError('schema_version must be 1')
              if surface.get('execution_authority') != 'NONE' or surface.get('promotion_authority') != 'NONE':
                  raise RestartValidationError('restart surface is non-authorizing')
              if set(surface.get('reopen_conditions',[])) != REOPEN_REASONS:
                  raise RestartValidationError('reopen conditions are incomplete')
              if any(k in surface for k in FORBIDDEN_INLINE_KEYS):
                  raise RestartValidationError('deep history cannot be inlined into active surface')
              refs=surface.get('source_refs')
              if not isinstance(refs,list):
                  raise RestartValidationError('source_refs must be list')
              current=0
              for ref in refs:
                  if set(ref) != {'path','git_blob_sha'}:
                      raise RestartValidationError('source ref must contain exact path/git_blob_sha')
                  p=_contained(root,ref['path'])
                  if not p.is_file():
                      raise RestartValidationError(f'missing source: {ref["path"]}')
                  if git_blob_sha_bytes(p.read_bytes()) != ref['git_blob_sha']:
                      raise RestartValidationError(f'stale source: {ref["path"]}')
                  current += 1
              measured=active_load_chars(surface)
              if surface.get('active_load_chars') != measured:
                  raise RestartValidationError('active_load_chars is stale')
              if measured > max_active_chars:
                  raise RestartValidationError(f'active surface over budget: {measured}>{max_active_chars}')
              return {'valid':True,'active_load_chars':measured,'source_count':len(refs),'current_source_count':current,'execution_authority':'NONE','promotion_authority':'NONE'}

          def restart_equivalence(full_state: dict[str,Any], surface: dict[str,Any]) -> dict[str,Any]:
              _validate_required_state(full_state)
              missing=[]; changed=[]
              for key in RESTART_FIELDS:
                  if key not in surface: missing.append(key)
                  elif surface[key] != full_state[key]: changed.append(key)
              return {'equivalent':not missing and not changed,'denominator':len(RESTART_FIELDS),'matched':len(RESTART_FIELDS)-len(missing)-len(changed),'missing':missing,'changed':changed}

          def decide_restart(surface: dict[str,Any], request: dict[str,Any]) -> dict[str,Any]:
              reason=None
              if request.get('operator_request_full_history'): reason='OPERATOR_REQUEST'
              elif request.get('equivalence_mismatch'): reason='EQUIVALENCE_MISMATCH'
              elif request.get('unresolved_blocker'): reason='UNRESOLVED_BLOCKER'
              elif request.get('stale_source'): reason='STALE_SOURCE'
              if reason:
                  return {'decision':'REOPEN_FULL_HISTORY','reason':reason,'execution_authority':'NONE','promotion_authority':'NONE'}
              if request.get('missing_detail'):
                  return {'decision':'SELECTIVE_RECALL','recall_request':{'event':request.get('event','restart_detail_needed'),'scope_tags':request.get('scope_tags',[]),'max_results':1},'execution_authority':'NONE','promotion_authority':'NONE'}
              return {'decision':'CONTINUE_FROM_SURFACE','execution_authority':'NONE','promotion_authority':'NONE'}
          PY
          cat > restart_surface/cli.py <<'PY'
          from __future__ import annotations
          import argparse, json
          from pathlib import Path
          from .core import validate_surface, decide_restart
          def main(argv=None):
              p=argparse.ArgumentParser(); sub=p.add_subparsers(dest='cmd',required=True)
              v=sub.add_parser('verify'); v.add_argument('--surface',default='restart/restart_surface.json')
              d=sub.add_parser('decide'); d.add_argument('--surface',default='restart/restart_surface.json'); d.add_argument('--request',required=True)
              a=p.parse_args(argv)
              s=json.loads(Path(a.surface).read_text())
              if a.cmd=='verify': out=validate_surface(Path('.'),s)
              else: out=decide_restart(s,json.loads(Path(a.request).read_text()))
              print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY
          cat > restart_surface/__main__.py <<'PY'
          from .cli import main
          main()
          PY
          cat > restart_surface/README.md <<'EOF'
          # Compact Active + Restart Surface v1

          A repository-local, non-authorizing restart representation. It keeps a fixed restart denominator in the active surface and leaves deep history behind current, traceable source pointers. It refuses silent truncation: if required restart state cannot fit the configured budget, construction fails closed.

          `RESTART SURFACE != FULL HISTORY`

          `COMPACT != DROP UNKNOWN`

          `RESTART STATE != EXECUTION AUTHORITY`
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          from restart_surface import build_surface, git_blob_sha_bytes
          root=Path('.')
          source=Path('thin-rts/ultimate-loop/METEOR_RESULT_FRZ_000011_2026-08-27.md')
          state={
              'goal':'Continue Adaptive Intelligence v2 from completed Child A into bounded Child B verification',
              'repo':'nobutakayamauchi/RTS',
              'branch':'feature/frz-000012-compact-active-restart-surface-v1',
              'commit':'93c50afb93f6a1045a8c2761ee719f437c78e61f',
              'changed':['Child A selective recall is completed; Child B restart-surface work is the only active child'],
              'verified':['Child A completed-head validation is green'],
              'unresolved':['UNKNOWN: cross-project restart equivalence beyond the bounded fixture is not yet claimed'],
              'rollback':'Revert Child B package/sample/tests/lifecycle only; preserve Child A and existing full history',
              'do_not_touch':['RTS-FRZ-000011 completed survivor','RTS-FRZ-000013..000015 until separately authorized','existing deep history sources'],
              'next_authorized_action':'Run Child B verification/DA; reopen deeper history only on an explicit reopen condition'
          }
          refs=[{'path':str(source),'git_blob_sha':git_blob_sha_bytes(source.read_bytes())}]
          surface=build_surface(root,state,refs)
          Path('restart/restart_surface.json').write_text(json.dumps(surface,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY

      - name: Final B baseline DA and Counter-DA
        run: |
          cat > tests/test_restart_surface.py <<'PY'
          import json, tempfile, unittest
          from pathlib import Path
          from restart_surface import RestartValidationError, build_surface, validate_surface, restart_equivalence, decide_restart, git_blob_sha_bytes

          class RestartSurfaceTests(unittest.TestCase):
              def state(self):
                  return {'goal':'g','repo':'r','branch':'b','commit':'abcdef123','changed':['c'],'verified':['v'],'unresolved':['UNKNOWN: x'],'rollback':'rollback B','do_not_touch':['A'],'next_authorized_action':'verify'}
              def refs(self,root):
                  p=root/'source.md'; p.write_text('source\n'); return [{'path':'source.md','git_blob_sha':git_blob_sha_bytes(p.read_bytes())}]
              def test_committed_surface_valid(self):
                  s=json.loads(Path('restart/restart_surface.json').read_text()); self.assertTrue(validate_surface(Path('.'),s)['valid'])
              def test_fixed_denominator_equivalent(self):
                  with tempfile.TemporaryDirectory() as td:
                      r=Path(td); st=self.state(); s=build_surface(r,st,self.refs(r)); self.assertTrue(restart_equivalence(st,s)['equivalent'])
              def test_missing_required_field_fails(self):
                  st=self.state(); del st['rollback']
                  with self.assertRaises(RestartValidationError): build_surface(Path('.'),st,[])
              def test_stale_source_fails(self):
                  with tempfile.TemporaryDirectory() as td:
                      r=Path(td); st=self.state(); refs=self.refs(r); s=build_surface(r,st,refs); (r/'source.md').write_text('changed\n')
                      with self.assertRaises(RestartValidationError): validate_surface(r,s)
              def test_path_escape_fails(self):
                  with tempfile.TemporaryDirectory() as td:
                      r=Path(td); outside=r.parent/'outside-restart.md'; outside.write_text('x')
                      refs=[{'path':'../outside-restart.md','git_blob_sha':git_blob_sha_bytes(outside.read_bytes())}]
                      try:
                          with self.assertRaises(RestartValidationError): build_surface(r,self.state(),refs)
                      finally: outside.unlink(missing_ok=True)
              def test_non_authority(self):
                  with tempfile.TemporaryDirectory() as td:
                      r=Path(td); s=build_surface(r,self.state(),self.refs(r)); self.assertEqual(s['execution_authority'],'NONE'); self.assertEqual(s['promotion_authority'],'NONE')
              def test_full_history_reopen_is_explicit(self):
                  d=decide_restart({}, {'unresolved_blocker':True}); self.assertEqual(d['decision'],'REOPEN_FULL_HISTORY'); self.assertEqual(d['reason'],'UNRESOLVED_BLOCKER')
              def test_selective_recall_handoff_is_bounded(self):
                  d=decide_restart({}, {'missing_detail':True,'scope_tags':['context']}); self.assertEqual(d['decision'],'SELECTIVE_RECALL'); self.assertEqual(d['recall_request']['max_results'],1)
              def test_continue_path_is_non_authorizing(self):
                  d=decide_restart({}, {}); self.assertEqual(d['decision'],'CONTINUE_FROM_SURFACE'); self.assertEqual(d['execution_authority'],'NONE')
          PY
          cat > tests/test_restart_surface_da.py <<'PY'
          import tempfile, unittest
          from pathlib import Path
          from restart_surface import RestartValidationError, build_surface, restart_equivalence, validate_surface, git_blob_sha_bytes

          class RestartSurfaceDA(unittest.TestCase):
