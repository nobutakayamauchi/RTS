            "expected_effect": {"impact":5,"strategic_fit":5,"revenue_leverage":4,"risk_reduction":4,"recurrence":5,"confidence":4},
            "implementation": {"from_scratch_hours":14,"integration_hours":2,"validation_hours":3,"unknown_buffer_hours":1},
            "github_scan": {
              "performed": true,
              "repositories": ["nobutakayamauchi/RTS"],
              "queries": ["restart reconstruction handoff compact active surface", "selective recall provenance freshness", "ultimate loop restart recovery"],
              "assets": [
                {"repository":"nobutakayamauchi/RTS","path":"selective_recall/","ref":"93c50afb93f6a1045a8c2761ee719f437c78e61f","kind":"code","reuse_mode":"ADAPT","license_status":"OWNED","estimated_hours_saved":4,"notes":"Reuse source containment, Git-blob freshness, and non-authority patterns from completed Child A."},
                {"repository":"nobutakayamauchi/RTS","path":"thin-rts/ultimate-loop/","ref":"93c50afb93f6a1045a8c2761ee719f437c78e61f","kind":"design","reuse_mode":"REFERENCE","license_status":"OWNED","estimated_hours_saved":3,"notes":"Reuse restart/reconstruction and historical-evidence/current-authority boundaries."},
                {"repository":"nobutakayamauchi/RTS","path":"freezer/","ref":"93c50afb93f6a1045a8c2761ee719f437c78e61f","kind":"code","reuse_mode":"REFERENCE","license_status":"OWNED","estimated_hours_saved":2,"notes":"Reuse append-only lifecycle, WIP=1, assessment, preflight, and verification governance."}
              ],
              "gaps": ["No current bounded restart-surface package proves fixed-denominator restart equivalence.","No current active-surface owner refuses over-budget compaction instead of silently dropping restart-critical state."]
