name: FRZ-000012 Ultimate Loop Once

on:
  push:
    branches:
      - feature/frz-000012-compact-active-restart-surface-v1
    paths:
      - .github/workflows/frz-000012-ultimate-loop-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  ultimate-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000012-compact-active-restart-surface-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact B start boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          def current(i):
              p=json.loads((root/'freezer/items'/i/'current.json').read_text())
              return json.loads((root/p['path']).read_text())
          a=current('RTS-FRZ-000011')
          b=current('RTS-FRZ-000012')
          assert a['status']=='COMPLETED', a
          assert b['version']==1 and b['status']=='FROZEN' and b['build_authority']=='NOT_APPROVED', b
          for i in ('RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              x=current(i); assert x['status']=='FROZEN' and x['build_authority']=='NOT_APPROVED', x
          active=[current(p.parent.name)['item_id'] for p in (root/'freezer/items').glob('RTS-FRZ-*/current.json') if current(p.parent.name)['status']=='IN_PROGRESS']
          assert active==[], active
          print('B start boundary OK')
          PY
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m unittest discover -s tests -p 'test_freezer*.py' -v

      - name: Materialize governed assessment and preflight inputs
        run: |
          mkdir -p docs/implementation/frz000012_inputs
          cat > docs/implementation/frz000012_inputs/build_assessment_input.json <<'JSON'
