            "affected_boundaries":["new restart_surface package","new repository-local restart surface sample","focused restart/restart-DA tests","RTS-FRZ-000012 lifecycle records"],
            "existing_assumptions":["Child A Selective Recall is COMPLETED and remains the owner of historical selective retrieval.","Full history remains stored in existing sources and is not deleted by compaction.","Git blob identity can bind local source freshness deterministically.","Restart representation is not execution authority."],
