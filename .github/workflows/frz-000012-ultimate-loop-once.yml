            "regression_tests":["fixed restart denominator","restart-equivalence","active-load budget","no silent truncation","UNKNOWN preservation","do-not-touch preservation","source freshness","path containment","explicit full-history reopen","selective-recall handoff","non-authority","FREEZER regression"],
