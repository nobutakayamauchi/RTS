name: FRZ-000022 Validate Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-validate-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K1 baseline and destructive DA
        run: python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: K0 regression
        run: python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
      - name: FREEZER verification
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m freezer.preflight verify
