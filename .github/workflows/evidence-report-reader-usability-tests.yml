name: Evidence Report Reader Usability Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-reader-usability-tests.yml"
      - "docs/status/RTS_FINAL_SHAPE_AND_CURRENT_POSITION.*"
      - "proof_engine_pilot/product_readiness/round_0003/**"
      - "proof_engine_pilot/report_reader_usability.py"
      - "proof_engine_pilot/report_reader_usability_cli.py"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_reader_usability_checkpoint_0024.json"
      - "tests/test_proof_engine_report_reader_usability.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify HARD-003 artifacts
        run: python -B -m proof_engine_pilot.report_reader_usability_cli verify
      - name: Verify final shape and current position
        run: |
          python -B -m proof_engine_pilot.report_reader_usability_cli summary > /tmp/reader-summary.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/reader-summary.json', encoding='utf-8'))
          assert value['state'] == 'INTERNAL_ROLE_SEPARATED_READER_USABILITY_VALIDATED'
          assert value['next_gate'] == 'HUMAN_THIRD_CASE_GENERALIZATION_PLAN_REQUIRED'
          assert value['rts_overall_planning_estimate_percent'] == 74
          assert value['short_term_internal_product_candidate_percent'] == 97
          assert value['product_readiness_baseline_score'] == 82
          assert value['current_step'] == 'HARD-004'
          assert value['reader_roles'] == 3
          assert value['questions_per_reader'] == 6
          assert value['version_1_material_confusions'] == 4
          assert value['version_2_material_confusions'] == 0
          assert value['external_human_review_performed'] is False
          assert value['remaining_work_items'] == ['HARD-004', 'HARD-005']
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_reader_usability.py' -v
