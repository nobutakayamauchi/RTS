name: Pilot Run Contract Tests

on:
  pull_request:
    paths:
      - "pilot_run_contract/**"
      - "pilot_runs/**"
      - "tests/test_pilot_run_contract.py"
      - "tests/test_reconnect_seed_pack.py"
      - ".github/workflows/pilot-run-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "pilot_run_contract/**"
      - "pilot_runs/**"
      - "tests/test_pilot_run_contract.py"
      - "tests/test_reconnect_seed_pack.py"
      - ".github/workflows/pilot-run-contract-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify default pilot seed
        run: python -B -m pilot_run_contract.cli verify
      - name: Verify reconnect active seed
        run: python -B -m pilot_run_contract.cli verify pilot_run_contract/packs/reconnect_seed_pack_v1/seed_active_scope_cut.json
      - name: Verify reconnect Pack
        run: python -B pilot_run_contract/packs/reconnect_seed_pack_v1/validate_pack.py
      - name: Run focused pilot tests
        run: |
          python -B -m unittest discover -s tests -p 'test_pilot_run_contract.py' -v
          python -B -m unittest discover -s tests -p 'test_reconnect_seed_pack.py' -v
      - name: Run full repository tests
        run: python -B -m unittest discover -s tests -v
