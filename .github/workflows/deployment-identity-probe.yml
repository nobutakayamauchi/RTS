name: Deployment Identity Probe

on:
  pull_request:
    paths:
      - "deployment_identity/**"
      - "runtime_debug_gate/**"
      - "runtime_evidence_correlation/**"
      - "runtime_code_mapping/**"
      - "root_cause_claim_gate/**"
      - "retest_reidentity_gate/**"
      - "tests/test_deployment_identity.py"
      - "tests/test_runtime_debug_gate.py"
      - "tests/test_runtime_evidence_correlation.py"
      - "tests/test_runtime_code_mapping.py"
      - "tests/test_root_cause_claim_gate.py"
      - "tests/test_retest_reidentity_gate.py"
      - "docs/implementation/DEPLOYMENT_IDENTITY_PROBE_V1.md"
      - ".github/workflows/deployment-identity-probe.yml"
  push:
    branches: [main]
    paths:
      - "deployment_identity/**"
      - "runtime_debug_gate/**"
      - "runtime_evidence_correlation/**"
      - "runtime_code_mapping/**"
      - "root_cause_claim_gate/**"
      - "retest_reidentity_gate/**"
      - "tests/test_deployment_identity.py"
      - "tests/test_runtime_debug_gate.py"
      - "tests/test_runtime_evidence_correlation.py"
      - "tests/test_runtime_code_mapping.py"
      - "tests/test_root_cause_claim_gate.py"
      - "tests/test_retest_reidentity_gate.py"
      - "docs/implementation/DEPLOYMENT_IDENTITY_PROBE_V1.md"
      - ".github/workflows/deployment-identity-probe.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime debugging gates
        run: >-
          python -m compileall -q
          deployment_identity
          runtime_debug_gate
          runtime_evidence_correlation
          runtime_code_mapping
          root_cause_claim_gate
          retest_reidentity_gate
          tests/test_deployment_identity.py
          tests/test_runtime_debug_gate.py
          tests/test_runtime_evidence_correlation.py
          tests/test_runtime_code_mapping.py
          tests/test_root_cause_claim_gate.py
          tests/test_retest_reidentity_gate.py
      - name: Run focused tests
        run: >-
          python -B -m unittest
          tests.test_deployment_identity
          tests.test_runtime_debug_gate
          tests.test_runtime_evidence_correlation
          tests.test_runtime_code_mapping
          tests.test_root_cause_claim_gate
          tests.test_retest_reidentity_gate
          -v
      - name: Probe fail-closed without deployment revision
        run: |
          mkdir -p /tmp/no-deployment-git
          set +e
          env \
            -u DEPLOYED_REVISION \
            -u GIT_COMMIT \
            -u SOURCE_VERSION \
            -u RENDER_GIT_COMMIT \
            -u VERCEL_GIT_COMMIT_SHA \
            -u GITHUB_SHA \
            python -m deployment_identity.cli probe \
              --root /tmp/no-deployment-git \
              --service-unit ci.service \
              --entrypoint app.py \
              --require-established > /tmp/identity.json
          code=$?
          test "$code" -eq 2
          python - <<'PY'
          import json
          data = json.load(open('/tmp/identity.json', encoding='utf-8'))
          assert data['status'] == 'PARTIAL'
          assert data['runtime_classification_allowed'] is False
          assert data['code_existence_is_runtime_evidence'] is False
          assert 'deployed_revision' in data['missing_required_fields']
          PY
      - name: Probe established with bounded explicit identity
        run: |
          python -m deployment_identity.cli probe \
            --service-unit ci.service \
            --deployed-revision 0123456789012345678901234567890123456789 \
            --entrypoint app.py \
            --require-established > /tmp/identity-established.json
          python -m deployment_identity.cli verify /tmp/identity-established.json --require-established
      - name: Verify runtime debug gate stays blocked without established identity
        run: |
          python - <<'PY'
          from runtime_debug_gate.core import evaluate_debug_gate
          result = evaluate_debug_gate(
              observation={'event': 'HTTP 500', 'surface': '/health'},
              deployment_identity=None,
          )
          assert result['state'] == 'BLOCKED_IDENTITY_MISSING'
          assert result['runtime_implementation'] == 'UNKNOWN'
          assert result['runtime_classification_allowed'] is False
          PY
      - name: Verify stale revision cannot enter code mapping
        run: |
          python - <<'PY'
          import json
          from runtime_evidence_correlation.core import correlate_candidates
          identity = json.load(open('/tmp/identity-established.json', encoding='utf-8'))
          result = correlate_candidates(
              deployment_identity=identity,
              candidates=[{
                  'candidate_id': 'stale',
                  'source_ref': 'app.py',
                  'revision': 'f' * 40,
                  'runtime_evidence_refs': ['trace:ci'],
              }],
          )
          assert result['state'] == 'BLOCKED_NO_CORRELATED_CANDIDATE'
          assert result['code_mapping_allowed'] is False
          assert result['root_cause_claim_allowed'] is False
          PY
      - name: Verify end-to-end root cause and reidentity retest gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from deployment_identity.core import build_snapshot
          from runtime_evidence_correlation.core import correlate_candidates
          from runtime_code_mapping.core import establish_code_mapping
          from root_cause_claim_gate.core import evaluate_root_cause_claims
          from retest_reidentity_gate.core import evaluate_retest

          with tempfile.TemporaryDirectory() as before_dir, tempfile.TemporaryDirectory() as after_dir:
              before = build_snapshot(
                  root=Path(before_dir),
                  service_unit='ci.service',
                  deployed_revision='a' * 40,
                  entrypoint='app.py',
                  observed_at='2026-08-08T00:00:00Z',
              )
              correlation = correlate_candidates(
                  deployment_identity=before,
                  candidates=[{
                      'candidate_id': 'c1',
                      'source_ref': 'app.py',
                      'revision': 'a' * 40,
                      'runtime_evidence_refs': ['trace:ci'],
                  }],
              )
              mapping = establish_code_mapping(
                  correlation_result=correlation,
                  mapping={
                      'candidate_id': 'c1',
                      'source_ref': 'app.py',
                      'symbols': ['handle_request'],
                      'mapping_evidence_refs': ['stack:ci'],
                  },
              )
              root = evaluate_root_cause_claims(
                  code_mapping_result=mapping,
                  claims=[{
                      'claim_id': 'rc1',
                      'candidate_id': 'c1',
                      'hypothesis': 'synthetic CI root-cause hypothesis',
                      'supporting_evidence_refs': ['trace:ci'],
                      'reproduction_refs': ['repro:ci'],
                      'falsification_refs': ['negative:ci'],
                      'unresolved_counterevidence_refs': [],
                  }],
              )
              assert root['root_cause_claim_allowed'] is True
              assert root['fix_validated'] is False

              after = build_snapshot(
                  root=Path(after_dir),
                  service_unit='ci.service',
                  deployed_revision='b' * 40,
                  entrypoint='app.py',
                  observed_at='2026-08-08T00:10:00Z',
              )
              retest = evaluate_retest(
                  pre_patch_identity=before,
                  post_patch_identity=after,
                  root_cause_result=root,
                  retest={
                      'claim_id': 'rc1',
                      'deployed_revision': 'b' * 40,
                      'verification_refs': ['retest:ci'],
                      'regression_refs': ['suite:ci'],
                      'outcome': 'PASS',
                  },
              )
              assert retest['state'] == 'FIX_VALIDATED'
              assert retest['deployment_identity_reestablished'] is True
              assert retest['fix_validated'] is True
          PY
