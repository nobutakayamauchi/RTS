name: Evidence Report Pilot Package Tests

on:
  pull_request:
    paths:
      - "proof_engine_pilot/report_pilot_package.py"
      - "proof_engine_pilot/report_pilot_package_v2.py"
      - "proof_engine_pilot/report_pilot_package_cli.py"
      - "proof_engine_pilot/report_productization_spec_v2.py"
      - "proof_engine_pilot/pilot_packages/round_0001/**"
      - "proof_engine_pilot/productization_specs/round_0001/**"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_internal_product_spec_checkpoint_0016_r1.json"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_pilot_package_checkpoint_0017.json"
      - "tests/test_proof_engine_report_productization_spec_v2.py"
      - "tests/test_proof_engine_report_pilot_package.py"
      - ".github/workflows/evidence-report-pilot-package-tests.yml"
  push:
    branches: [main]
    paths:
      - "proof_engine_pilot/report_pilot_package.py"
      - "proof_engine_pilot/report_pilot_package_v2.py"
      - "proof_engine_pilot/report_pilot_package_cli.py"
      - "proof_engine_pilot/report_productization_spec_v2.py"
      - "proof_engine_pilot/pilot_packages/round_0001/**"
      - "proof_engine_pilot/productization_specs/round_0001/**"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_internal_product_spec_checkpoint_0016_r1.json"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_pilot_package_checkpoint_0017.json"
      - "tests/test_proof_engine_report_productization_spec_v2.py"
      - "tests/test_proof_engine_report_pilot_package.py"
      - ".github/workflows/evidence-report-pilot-package-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify corrected product specification
        run: python -B -m proof_engine_pilot.report_productization_spec_cli verify
      - name: Verify and render internal pilot package
        run: |
          python -B -m proof_engine_pilot.report_pilot_package_cli verify
          python -B -m proof_engine_pilot.report_pilot_package_cli summary > /tmp/pilot-summary.json
          python -B -m proof_engine_pilot.report_pilot_package_cli generate --output /tmp/pilot-report.json
          python -B -m proof_engine_pilot.report_pilot_package_cli render-markdown --output /tmp/pilot-report.md
          python -B -m proof_engine_pilot.report_pilot_package_cli evidence-inventory > /tmp/pilot-evidence.json
          python -B -m proof_engine_pilot.report_pilot_package_cli acceptance-template > /tmp/pilot-acceptance.json
          python -B -m proof_engine_pilot.report_pilot_package_cli verification-summary > /tmp/pilot-verification.json
          python -B -m proof_engine_pilot.report_pilot_package_cli package-index > /tmp/pilot-index.json
      - name: Verify package state, artifacts, and human gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/pilot-summary.json').read_text(encoding='utf-8'))
          report = json.loads(Path('/tmp/pilot-report.json').read_text(encoding='utf-8'))
          markdown = Path('/tmp/pilot-report.md').read_text(encoding='utf-8')
          evidence = json.loads(Path('/tmp/pilot-evidence.json').read_text(encoding='utf-8'))
          acceptance = json.loads(Path('/tmp/pilot-acceptance.json').read_text(encoding='utf-8'))
          verification = json.loads(Path('/tmp/pilot-verification.json').read_text(encoding='utf-8'))
          index = json.loads(Path('/tmp/pilot-index.json').read_text(encoding='utf-8'))
          assert summary['state'] == 'INTERNAL_SINGLE_CASE_PILOT_PACKAGE_BUILT'
          assert summary['next_gate'] == 'HUMAN_PILOT_PACKAGE_ACCEPTANCE_REVIEW_REQUIRED'
          assert summary['repository'] == 'nobutakayamauchi/seminar-compass'
          assert summary['counts'] == {
              'artifacts': 7,
              'report_sections': 9,
              'achievement_records': 6,
              'withheld_claims': 0,
              'acceptance_criteria': 15,
              'automated_pass': 6,
              'pending_human': 9,
          }
          assert len(report['sections']) == 9
          assert evidence['effective_achievement_record_count'] == 6
          assert evidence['withheld_claim_count'] == 0
          assert len(acceptance['criteria_results']) == 15
          assert all(item['result'] is None for item in acceptance['criteria_results'])
          assert acceptance['decision'] is None
          assert acceptance['package_accepted'] is False
          assert verification['automated_pass_count'] == 6
          assert verification['pending_human_count'] == 9
          assert verification['package_accepted'] is False
          assert index['artifact_count'] == 7
          assert len(index['artifacts']) == 7
          for heading in (
              '### 1. Executive summary',
              '### 2. Repository scope',
              '### 3. Methodology',
              '### 4. Evidence inventory',
              '### 5. Effective achievement records',
              '### 6. Human and AI contribution map',
              '### 7. Withheld or unsupported claims',
              '### 8. Limitations',
              '### 9. Human review decision',
          ):
              assert markdown.count(heading) == 1
          assert 'Pricing authorized: false' in markdown
          assert 'Delivery authorized: false' in markdown
          assert 'Publication authorized: false' in markdown
          PY
      - name: Run focused tests
        run: |
          python -B -m unittest discover -s tests -p 'test_proof_engine_report_productization_spec_v2.py' -v
          python -B -m unittest discover -s tests -p 'test_proof_engine_report_pilot_package.py' -v
