name: FRZ-000021 Live Triage Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-live-triage-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  live-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run I to J to K0 against live official docs
        run: |
          python - <<'PY'
          from collections import Counter
          from official_docs_intake import build_intake_report
          from semantic_claim_refinement import refine_intake_report, verify_refinement_report
          from review_necessity_triage import triage_refinement_report, verify_triage_report

          cases = [
              ('openai', 'gpt-5.6', 'api', 'https://developers.openai.com/api/docs/guides/latest-model.md'),
              ('anthropic', 'claude-fable-5', 'claude-api', 'https://platform.claude.com/docs/en/about-claude/models/overview.md'),
              ('google', 'gemini-3.7', 'gemini-api', 'https://ai.google.dev/gemini-api/docs/models'),
          ]

          total = Counter()
          top_paths = Counter()
          reason_counts = Counter()
          perspective_gaps = 0

          for provider, generation, surface, url in cases:
              intake = build_intake_report({
                  'provider': provider,
                  'product_surface': surface,
                  'generation': generation,
                  'captured_at': '2026-08-27T12:45:00Z',
                  'query_terms': [generation],
                  'explicit_urls': [url],
                  'max_documents': 1,
              })
              refined = refine_intake_report(intake)
              verify_refinement_report(refined, intake_report=intake)
              triage = triage_refinement_report(refined)
              verify_triage_report(triage, refinement_report=refined)

              counts = Counter(r['classification'] for r in triage['records'])
              provider_gaps = sum(1 for r in triage['records'] if r['perspective_gap'] >= 2)
              print(
                  'PROVIDER', provider,
                  'I_AMBIG=', intake['audit']['ambiguous_block_count'],
                  'J_RESOLVED=', refined['audit']['resolved_count'],
                  'J_UNRESOLVED=', len(refined['audit']['unresolved']),
                  'HUMAN_NOW=', counts['HUMAN_NOW'],
                  'HUMAN_LATER=', counts['HUMAN_LATER'],
                  'DEFER_LOW_VALUE=', counts['DEFER_LOW_VALUE'],
                  'REVIEW_BLOCKED=', counts['REVIEW_BLOCKED'],
                  'PERSPECTIVE_GAP=', provider_gaps,
              )

              total['I_AMBIG'] += intake['audit']['ambiguous_block_count']
              total['J_RESOLVED'] += refined['audit']['resolved_count']
              total['J_UNRESOLVED'] += len(refined['audit']['unresolved'])
              for key in ('HUMAN_NOW', 'HUMAN_LATER', 'DEFER_LOW_VALUE', 'REVIEW_BLOCKED'):
                  total[key] += counts[key]
              perspective_gaps += provider_gaps
              for record in triage['records']:
                  for path in record['da'].get('causal_paths', []):
                      top_paths[path] += 1
                  for reason in record.get('human_review_reason_codes', []):
                      reason_counts[reason] += 1

              for record in sorted(
                  triage['records'],
                  key=lambda r: (
                      0 if r['classification'] == 'HUMAN_NOW' else 1,
                      -r['da']['impact'],
                      -r['da']['causal_reach'],
                      -r['perspective_gap'],
                      r['finding_index'],
                  ),
              )[:8]:
                  print(
                      'TOP', provider,
                      record['classification'],
                      'impact=', record['da']['impact'],
                      'causal=', record['da']['causal_reach'],
                      'gap=', record['perspective_gap'],
                      'reasons=', ','.join(record['human_review_reason_codes']),
                      'paths=', ','.join(record['da'].get('causal_paths', [])),
                      'anchor=', record['anchor'][:180].replace('\n', ' '),
                  )

          print('TOTAL', dict(total))
          print('TOTAL_PERSPECTIVE_GAP', perspective_gaps)
          print('TOP_CAUSAL_PATHS', top_paths.most_common(12))
          print('HUMAN_REASON_CODES', reason_counts.most_common())

          assert total['J_UNRESOLVED'] > 0
          assert total['HUMAN_NOW'] + total['HUMAN_LATER'] + total['DEFER_LOW_VALUE'] + total['REVIEW_BLOCKED'] == total['J_UNRESOLVED']
          assert total['DEFER_LOW_VALUE'] > 0, 'triage failed to identify any low-value attention surface'
          assert total['HUMAN_NOW'] < total['J_UNRESOLVED'], 'triage escalated the entire residual surface'
          PY
