name: Validate Codex Reasoning Density Benchmark v1

on:
  push:
    branches:
      - experiment/codex-reasoning-density-v1
    paths:
      - 'experiments/codex_reasoning_density_v1/**'
      - '.github/workflows/experiment-codex-reasoning-density-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell and Python syntax
        run: |
          bash -n experiments/codex_reasoning_density_v1/run.sh
          bash -n experiments/codex_reasoning_density_v1/run_reuse_sweep.sh
          bash -n experiments/codex_reasoning_density_v1/run_restart_surface.sh
          bash -n experiments/codex_reasoning_density_v1/collect_history.sh
          python -m py_compile experiments/codex_reasoning_density_v1/aggregate.py
          python -m py_compile experiments/codex_reasoning_density_v1/aggregate_sweep.py
          python -m py_compile experiments/codex_reasoning_density_v1/collect_history.py
          python -m py_compile experiments/codex_reasoning_density_v1/test_collect_history.py
      - name: Validate compact restart surface provenance
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('experiments/codex_reasoning_density_v1/restart_surface.json')
          data=json.loads(p.read_text())
          assert p.stat().st_size <= 1800, p.stat().st_size
          assert data['state']['lifecycle']=='COMPLETED', data
          assert data['state']['k2_adequacy']=='ADEQUATE', data
          assert data['state']['zero_defect_claim'] is False, data
          for src in data['sources']:
              actual=subprocess.check_output(['git','hash-object',src['path']], text=True).strip()
              assert actual==src['git_blob_sha1'], (src['path'], actual, src['git_blob_sha1'])
          print('compact restart surface provenance valid')
          PY
      - name: Validate historical collector semantics
        run: |
          python experiments/codex_reasoning_density_v1/test_collect_history.py
      - name: Validate usage aggregation semantics
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/cold.jsonl" <<'EOF'
          {"type":"turn.completed","usage":{"input_tokens":100000,"cached_input_tokens":20000,"cache_write_input_tokens":0,"output_tokens":10000,"reasoning_output_tokens":4000}}
          EOF
          cat > "$tmp/reuse.jsonl" <<'EOF'
          {"type":"turn.completed","usage":{"input_tokens":40000,"cached_input_tokens":15000,"cache_write_input_tokens":0,"output_tokens":7000,"reasoning_output_tokens":2000}}
          EOF
          cat > "$tmp/next.jsonl" <<'EOF'
          {"timestamp":"2026-08-28T00:00:00Z","type":"event_msg","payload":{"type":"token_count","info":{"total_token_usage":{"input_tokens":30000,"cached_input_tokens":10000,"cache_write_input_tokens":0,"output_tokens":6000,"reasoning_output_tokens":1500,"total_tokens":37500},"last_token_usage":{"input_tokens":30000,"cached_input_tokens":10000,"cache_write_input_tokens":0,"output_tokens":6000,"reasoning_output_tokens":1500,"total_tokens":37500}}}}
          EOF
          python experiments/codex_reasoning_density_v1/aggregate.py --results-dir "$tmp" --reference-tokens 5000000 > /tmp/report.json
          python - "$tmp/summary.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['runs']['cold']['uncached_input_tokens']==80000, r
          assert r['runs']['reuse']['uncached_input_tokens']==25000, r
          assert r['runs']['next']['uncached_input_tokens']==20000, r
          assert r['runs']['cold']['usage_source']=='turn.completed', r
          assert r['runs']['next']['usage_source']=='event_msg.token_count.total_token_usage', r
          assert abs(r['comparisons']['cold_to_reuse_input_reduction']-0.60)<1e-9, r
          assert abs(r['comparisons']['cold_to_reuse_uncached_input_reduction']-0.6875)<1e-9, r
          assert r['reference_ratios_only']['cold']==0.02, r
          print('benchmark aggregation semantics valid')
          PY
      - name: Validate reuse sweep semantics
        run: |
          tmp="$(mktemp -d)"
          for spec in 'cold 100000 20000' 'reuse 140000 120000' 'reuse_thin 60000 30000' 'reuse_minimal 45000 25000' 'reuse_restart 35000 20000'; do
            set -- $spec
            name="$1"; input="$2"; cached="$3"
            cat > "$tmp/$name.jsonl" <<EOF
          {"type":"turn.completed","usage":{"input_tokens":$input,"cached_input_tokens":$cached,"output_tokens":1000,"reasoning_output_tokens":500}}
          EOF
          done
          for name in reuse reuse_thin reuse_minimal reuse_restart; do
            cat > "$tmp/$name.final.txt" <<'EOF'
          STATE
          RTS-FRZ-000024 is COMPLETED.
          ADEQUACY
          K2 is ADEQUATE only for the bounded current inspection surface; zero observed defects is not zero residual defect risk.
          NEXT
          STOP unless a newly authorized bounded sample is requested.
          EVIDENCE
          freezer/items/RTS-FRZ-000024/current.json
          docs/implementation/frz000024_resolution.json
          test_adequacy_gate/README.md
          EOF
          done
          python experiments/codex_reasoning_density_v1/aggregate_sweep.py --results-dir "$tmp" > /tmp/sweep.json
          python - "$tmp/reuse_sweep.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['comparisons']['full']['candidate_total_below_cold'] is False, r
          assert r['comparisons']['thin']['candidate_total_below_cold'] is True, r
          assert r['comparisons']['minimal']['quality_gate_pass'] is True, r
          assert r['comparisons']['restart']['candidate_total_below_cold'] is True, r
          assert r['comparisons']['restart']['candidate_uncached_below_cold'] is True, r
          assert r['comparisons']['restart']['quality_gate_pass'] is True, r
          assert r['strict_winners']==['thin','minimal','restart'], r
          print('reuse sweep semantics valid')
          PY
