name: Promotion Application Preview Registration Candidate

on:
  pull_request:
    paths:
      - ".tmp/promotion_application_preview_item.json"
      - ".github/workflows/promotion-application-preview-registration-candidate.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Register governed child and rebuild deterministic records
        run: |
          python -m freezer.cli add --input .tmp/promotion_application_preview_item.json
          python - <<'PY'
          from pathlib import Path
          from governed_loop.common import pretty_json
          from governed_loop.generation import generate_run

          root = Path('.').resolve()
          test_path = root / 'tests/test_governed_loop.py'
          text = test_path.read_text(encoding='utf-8')
          before = 'self.assertEqual(loop["recommendation_action"], "REQUEST_HUMAN_APPROVAL")\n        self.assertEqual(loop["recommendation_item_id"], "RTS-FRZ-000003")'
          after = 'self.assertEqual(loop["recommendation_action"], "RUN_BUILD_ASSESSMENT")\n        self.assertEqual(loop["recommendation_item_id"], "RTS-FRZ-000010")'
          if before not in text:
              raise SystemExit('expected governed-loop assertion block not found')
          test_path.write_text(text.replace(before, after), encoding='utf-8')

          docs = root / 'docs/implementation/PROMOTION_APPLICATION_PREVIEW_V1_REGISTRATION.md'
          docs.write_text('''# Promotion Application Preview v1 Registration\n\n## Governed item\n\n- item: `RTS-FRZ-000010`\n- status: `FROZEN`\n- build authority: `NOT_APPROVED`\n- Assessment: `MISSING`\n- Preflight: `MISSING`\n- WIP: `0`\n\n## Purpose\n\nRegister the third staged integration child identified by the current parent Assessment: a deterministic repository-local application preview that emits a proposed change set and blockers without writing any target.\n\n## Permanent boundary\n\nRegistration grants no implementation, approval, application, merge, adjacent-repository write, Skill mutation, provider, scheduler, network, subprocess, publication, deployment, messaging, or external-action authority.\n\n## Next gates\n\n1. Build Assessment\n2. PASS Implementation Preflight\n3. explicit human approval\n4. `SELECTED -> IN_PROGRESS` under WIP=1\n5. implementation, CI, independent review, and completion records\n''', encoding='utf-8')

          run = generate_run(root)
          (root / 'governed_loop/runs/current.json').write_text(pretty_json(run), encoding='utf-8')
          PY
      - name: Persist candidate state for auditable debugging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Promotion Application Preview registration"
          git push
      - name: Verify generated registration
        run: |
          python -m freezer.cli verify
          python -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
      - name: Remove candidate machinery after verification
        run: |
          rm -f .tmp/promotion_application_preview_item.json
          rm -f .github/workflows/promotion-application-preview-registration-candidate.yml
          rmdir .tmp 2>/dev/null || true
          git add -A
          git commit -m "Finalize Promotion Application Preview registration"
          git push
