name: FRZ-000021 Actionability Live Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-actionability-live-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run live actionability triage
        run: |
          python - <<'PY'
          from collections import Counter
          from official_docs_intake import build_intake_report
          from semantic_claim_refinement import refine_intake_report
          from review_necessity_triage import triage_refinement_report, verify_triage_report

          cases = [
              ('openai','gpt-5.6','api','https://developers.openai.com/api/docs/guides/latest-model.md'),
              ('anthropic','claude-fable-5','claude-api','https://platform.claude.com/docs/en/about-claude/models/overview.md'),
              ('google','gemini-3.7','gemini-api','https://ai.google.dev/gemini-api/docs/models'),
          ]
          total=Counter(); action_paths=Counter(); expected_no_solution=0
          for provider,generation,surface,url in cases:
              i=build_intake_report({'provider':provider,'product_surface':surface,'generation':generation,'captured_at':'2026-08-27T13:16:00Z','query_terms':[generation],'explicit_urls':[url],'max_documents':1})
              j=refine_intake_report(i)
              k=triage_refinement_report(j)
              verify_triage_report(k, refinement_report=j)
              c=Counter(r['classification'] for r in k['records'])
              ens=sum(1 for r in k['records'] if r['da'].get('expected_behavior_context') and r['counter_da'].get('expected_behavior_context') and not r['da'].get('problem_solving_paths') and not r['counter_da'].get('problem_solving_paths'))
              print('PROVIDER',provider,'UNRESOLVED',len(j['audit']['unresolved']),'NOW',c['HUMAN_NOW'],'LATER',c['HUMAN_LATER'],'DEFER',c['DEFER_LOW_VALUE'],'EXPECTED_NO_SOLUTION',ens)
              total.update(c); total['UNRESOLVED'] += len(j['audit']['unresolved']); expected_no_solution += ens
              for r in k['records']:
                  for p in r['da'].get('problem_solving_paths',[]): action_paths[p]+=1
                  if 'breaking changes' in r['anchor'].lower():
                      print('BREAKING',provider,r['classification'],'impact',r['da']['impact'],'causal',r['da']['causal_reach'],'solve',r['da']['problem_solving_paths'])
          print('TOTAL',dict(total))
          print('EXPECTED_NO_SOLUTION',expected_no_solution)
          print('ACTION_PATHS',action_paths.most_common())
          assert total['UNRESOLVED'] == 76
          assert total['HUMAN_NOW'] > 0
          assert total['DEFER_LOW_VALUE'] > 0
          PY
