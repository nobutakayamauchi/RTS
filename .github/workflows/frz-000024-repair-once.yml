name: FRZ-000024 Repair Once

# rerun after M06 lower-priority promotion oracle restoration
on:
  push:
    branches:
      - feature/frz-000024-catalog-cost-false-green-repair-v1
    paths:
      - .github/workflows/frz-000024-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000024-catalog-cost-false-green-repair-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify governed WIP
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freezer/items/RTS-FRZ-000024/current.json').read_text())
          row=json.loads(Path(p['path']).read_text())
          assert row['status']=='IN_PROGRESS', row
          assert row['build_authority']=='APPROVED', row
          print('FRZ-000024 governed WIP confirmed')
          PY
      - name: Apply bounded repair
        run: python docs/implementation/frz000024_repair.py
      - name: K0 direct regression and counter-DA
        run: |
          python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
      - name: K1 direct regression and counter-DA
        run: |
          python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: K2 reinspection on repaired target
        run: |
          python -m unittest tests.test_test_adequacy_gate tests.test_test_adequacy_gate_da -v
      - name: Assert FG-001 resolved from underlying evidence
        run: |
          python - <<'PY'
          from tests.test_test_adequacy_gate import collect_nonmutation_lanes
          from test_adequacy_gate import evaluate_test_adequacy, run_mutation_suite, verify_test_adequacy_report
          from tests.test_human_escalation_gate import make_k0
          from human_escalation_gate import evaluate_escalation_report
          anchor='A cost-efficient creative model is described for routine media drafts.'
          k0=make_k0(anchor)
          k1=evaluate_escalation_report(k0)
          row0=k0['records'][0]
          row1=k1['records'][0]
          assert row0['classification'] in {'HUMAN_LATER','DEFER_LOW_VALUE'}, row0
          assert row1['disposition']=='WAIT_SAFE_DEFER', row1
          assert 'RECALIBRATE_LIMIT_OR_BUDGET' not in row1['recovered_escape_routes'], row1
          mutation=run_mutation_suite()
          kb,ho,mm=collect_nonmutation_lanes()
          assert all(r['passed'] for r in kb), kb
          assert all(r['passed'] for r in ho), ho
          assert all(r['passed'] for r in mm), mm
          report=evaluate_test_adequacy(mutation, known_bad=kb, held_out=ho, metamorphic=mm)
          verify_test_adequacy_report(report)
          assert report['status']=='ADEQUATE', report
          print('FG-001 resolved; K2 target status ADEQUATE')
          PY
      - name: Commit bounded repair
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add review_necessity_triage/core.py human_escalation_gate/core.py tests/test_review_necessity_triage_da.py tests/test_human_escalation_gate_da.py tests/test_test_adequacy_gate.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: repair catalog cost false-green boundary'
          git push origin HEAD:feature/frz-000024-catalog-cost-false-green-repair-v1
