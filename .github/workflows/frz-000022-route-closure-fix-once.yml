name: FRZ-000022 Knowledge Order Fix Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-route-closure-fix-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require escape search after known routes are closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('human_escalation_gate/core.py')
          s=p.read_text()
          old='''            if route_id == EXHAUSTION_SEARCH_ROUTE:\n                if row["opened_routes"]:\n                    active_routes.extend(row["opened_routes"])\n                elif row["outcome"] in {"OBSERVED", "REFUTED", "NON_DISCRIMINATING"}:\n                    exhaustion_search_observed = True\n'''
          new='''            if route_id == EXHAUSTION_SEARCH_ROUTE:\n                if row["opened_routes"]:\n                    active_routes.extend(row["opened_routes"])\n                elif not active_routes and row["outcome"] in {"OBSERVED", "REFUTED", "NON_DISCRIMINATING"}:\n                    # A no-new-route search only proves exhaustion after all\n                    # previously known routes have already been closed and their\n                    # evidence has been folded into the current knowledge state.\n                    exhaustion_search_observed = True\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
      - name: Validate K1 after repair
        run: python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: Commit repair
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add human_escalation_gate/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: require post-integration escape search for FRZ-000022 exhaustion'
          git push origin HEAD:feature/frz-000022-exhausted-ai-human-escalation-gate-v1
