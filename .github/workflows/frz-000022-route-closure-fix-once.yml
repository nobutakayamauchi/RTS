name: FRZ-000022 Monotonicity Fix Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-route-closure-fix-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep K1 escape recovery monotone with K0 attention class
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('human_escalation_gate/core.py')
          s=p.read_text()
          old='''        initial_routes = list(dict.fromkeys(_k0_routes(k0) + recover_escape_routes(k0["anchor"])))\n        active_routes = list(initial_routes)\n'''
          new='''        k0_routes = _k0_routes(k0)\n        recovered_routes = recover_escape_routes(k0["anchor"])\n        # K1 is an escalation gate, not a work scheduler. Second-pass heuristic\n        # recovery exists to rescue K0 HUMAN_NOW findings before human handoff;\n        # it must not promote K0 HUMAN_LATER/DEFER_LOW_VALUE into active work.\n        active_recovered_routes = recovered_routes if k0.get("classification") == "HUMAN_NOW" else []\n        initial_routes = list(dict.fromkeys(k0_routes + active_recovered_routes))\n        active_routes = list(initial_routes)\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
      - name: Validate K1 after repair
        run: python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: Commit repair
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add human_escalation_gate/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: keep FRZ-000022 escape recovery monotone with K0 priority'
          git push origin HEAD:feature/frz-000022-exhausted-ai-human-escalation-gate-v1
