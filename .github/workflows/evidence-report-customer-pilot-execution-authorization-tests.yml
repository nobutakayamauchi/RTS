name: Evidence Report Customer Pilot Execution Authorization Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-customer-pilot-execution-authorization-tests.yml"
      - "docs/status/RTS_CURRENT_POSITION.md"
      - "docs/status/RTS_CURRENT_POSITION_PILOT_EXECUTION_AUTH.json"
      - "proof_engine_pilot/product_readiness/round_0007/**"
      - "proof_engine_pilot/report_customer_pilot_execution_authorization.py"
      - "proof_engine_pilot/report_customer_pilot_execution_authorization_cli.py"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_customer_pilot_execution_auth_checkpoint_0028.json"
      - "tests/test_proof_engine_report_customer_pilot_execution_authorization.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify execution-authorization packet
        run: python -B -m proof_engine_pilot.report_customer_pilot_execution_authorization_cli verify
      - name: Verify position, score hold, and closed external authority
        run: |
          python -B -m proof_engine_pilot.report_customer_pilot_execution_authorization_cli summary > /tmp/pilot-execution-auth-summary.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/pilot-execution-auth-summary.json', encoding='utf-8'))
          assert value['state'] == 'INTERNAL_BOUNDED_CUSTOMER_PILOT_EXECUTION_AUTHORIZATION_PACKET_COMPLETE'
          assert value['next_gate'] == 'HUMAN_NAMED_PARTICIPANT_CONTACT_AUTHORIZATION_REQUIRED'
          assert value['rts_overall_planning_estimate_percent'] == 78
          assert value['short_term_internal_hardening_percent'] == 100
          assert value['product_readiness_score'] == 93
          assert value['product_readiness_score_change'] == 0
          assert value['logical_artifact_count'] == 8
          assert value['review_criterion_count'] == 16
          assert value['preflight_check_count'] == 16
          assert value['candidate_count'] == 0
          assert value['internal_candidate_selection_preparation_authorized'] is True
          assert value['participant_contact_authorized'] is False
          assert value['customer_intake_authorized'] is False
          assert value['pilot_execution_authorized'] is False
          assert value['external_actions_performed'] is False
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_customer_pilot_execution_authorization.py' -v
