name: Human Review Ledger Review Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply review fixes
        id: fix
        continue-on-error: true
        run: python .github/scripts/fix_human_review_ledger_findings.py > fix-output.txt 2>&1
      - name: Upload fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-review-fix-output
          path: fix-output.txt
      - name: Require fixes
        if: steps.fix.outcome != 'success'
        run: |
          cat fix-output.txt
          exit 1
      - name: Verify governed records
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
      - name: Run full tests
        id: tests
        continue-on-error: true
        run: python -B -m unittest discover -s tests -v > test-output.txt 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-review-fix-tests
          path: test-output.txt
      - name: Require tests
        if: steps.tests.outcome != 'success'
        run: |
          tail -n 250 test-output.txt
          exit 1
      - name: Commit verified fixes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f fix-output.txt test-output.txt
          git rm .github/scripts/fix_human_review_ledger_findings.py
          git rm .github/workflows/human-review-ledger-review-fixes.yml
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            human_review_ledger/models.py \
            human_review_ledger/corpus.py \
            human_review_ledger/policy/v1.json \
            human_review_ledger/schemas/policy.schema.json \
            human_review_ledger/ledger/current.json \
            human_review_ledger/README.md \
            tests/test_human_review_ledger.py \
            governed_loop/runs/current.json
          git commit -m "Fix Human Review Ledger authority and expiry checks"
          git push origin "HEAD:${HEAD_BRANCH}"
