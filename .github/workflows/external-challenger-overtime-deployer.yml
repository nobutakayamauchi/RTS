name: External Challenger Overtime Deployer

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  deploy-prove-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.32.0
      KIND_NODE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      POLICY_PREDICATE: https://example.org/external-challenger/policy-activation/v1
      PROPOSAL_PREDICATE: https://example.org/external-challenger/learning-proposal/v1
      REGRESSION_PREDICATE: https://example.org/external-challenger/regression/v1
      CAPABILITY_PREDICATE: https://example.org/external-challenger/capability/v1
      PROMOTION_PREDICATE: https://example.org/external-challenger/promotion/v1
      OUTCOME_PREDICATE: https://example.org/external-challenger/outcome/v1
      RECOVERY_PREDICATE: https://example.org/external-challenger/recovery/v1
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0

      - uses: actions/download-artifact@v4
        with:
          name: overtime-policy-authority
          path: policy-authority

      - uses: actions/download-artifact@v4
        with:
          name: overtime-proposer
          path: proposer

      - uses: actions/download-artifact@v4
        with:
          name: overtime-evaluator
          path: evaluator

      - uses: actions/download-artifact@v4
        with:
          name: overtime-promoter
          path: promoter

      - name: Verify and activate the exact approved policy artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          gh attestation verify policy-authority/overtime-policy.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$POLICY_SIGNER" >/dev/null
          gh attestation verify policy-authority/policy-activation.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$POLICY_SIGNER" --predicate-type "$POLICY_PREDICATE" >/dev/null
          mkdir -p policy-runtime
          tar -xzf policy-authority/overtime-policy.tgz -C policy-runtime
          POLICY_FILE="$PWD/policy-runtime/external_challenger/overtime/policy.rego"
          test -f "$POLICY_FILE"
          test "$(sha256sum "$POLICY_FILE" | awk '{print $1}')" = "$(jq -r '.policy_sha256' policy-authority/policy-activation.json)"
          echo "POLICY_FILE=$POLICY_FILE" >> "$GITHUB_ENV"

      - name: Verify all upstream authority and evidence identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          gh attestation verify proposer/learning-proposal.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" --predicate-type "$PROPOSAL_PREDICATE" >/dev/null
          gh attestation verify evaluator/regression.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$REGRESSION_PREDICATE" >/dev/null
          gh attestation verify evaluator/candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" >/dev/null
          gh attestation verify promoter/promotion-approval.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROMOTER" --predicate-type "$PROMOTION_PREDICATE" >/dev/null
          gh attestation verify proposer/capability-v1.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" >/dev/null

      - name: Enforce promotion-to-deploy binding
        shell: bash
        run: |
          set -euo pipefail
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          CANDIDATE_SHA="$(sha256sum evaluator/candidate-v2.json | awk '{print $1}')"
          ROLLBACK_SHA="$(sha256sum proposer/capability-v1.json | awk '{print $1}')"
          PROPOSAL_SHA="$(sha256sum proposer/learning-proposal.json | awk '{print $1}')"
          REGRESSION_SHA="$(sha256sum evaluator/regression.json | awk '{print $1}')"
          CANDIDATE_SOURCE="$(jq -r '.source_revision' evaluator/candidate-v2.json)"
          jq -n \
            --arg promoter "$PROMOTER" --arg run "$GITHUB_RUN_ID" --arg candidate "$CANDIDATE_SHA" --arg rollback "$ROLLBACK_SHA" --arg proposal "$PROPOSAL_SHA" --arg regression "$REGRESSION_SHA" --arg source "$CANDIDATE_SOURCE" \
            --slurpfile p promoter/promotion-approval.json \
            '{kind:"deploy",policy_verified:true,promotion_verified:true,promotion:{decision:$p[0].decision,authority_identity:$p[0].authority_identity,run_id:$p[0].run_id,authorized_capability_digest:$p[0].authorized_capability_digest,proposal_digest:$p[0].proposal_digest,regression_digest:$p[0].regression_digest},candidate_verified:true,candidate_digest:$candidate,candidate_source_revision:$source,expected:{promoter_identity:$promoter,run_id:$run,candidate_digest:$candidate,rollback_digest:$rollback,proposal_digest:$proposal,regression_digest:$regression,source_revision:$source}}' > deploy-input.json
          test "$(opa eval --format raw --input deploy-input.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_deploy')" = true
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "ROLLBACK_SHA=$ROLLBACK_SHA" >> "$GITHUB_ENV"
          echo "PROPOSAL_SHA=$PROPOSAL_SHA" >> "$GITHUB_ENV"
          echo "REGRESSION_SHA=$REGRESSION_SHA" >> "$GITHUB_ENV"

      - name: Capability promotion adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          jq '.candidate_digest="forged"' deploy-input.json > /tmp/wrong-authorized-digest.json
          test "$(opa eval --format raw --input /tmp/wrong-authorized-digest.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_deploy')" = false
          jq '.candidate_verified=false' deploy-input.json > /tmp/missing-provenance.json
          test "$(opa eval --format raw --input /tmp/missing-provenance.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_deploy')" = false
          jq '.candidate_source_revision="wrong-source"' deploy-input.json > /tmp/source-mismatch.json
          test "$(opa eval --format raw --input /tmp/source-mismatch.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_deploy')" = false
          jq '.promotion.authorized_capability_digest="stale-candidate"' deploy-input.json > /tmp/stale-promotion.json
          test "$(opa eval --format raw --input /tmp/stale-promotion.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_deploy')" = false

      - name: Install kind and create live runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind create cluster --name overtime-deployer --image "$KIND_NODE" --wait 120s

      - name: Deploy prior capability as rollback baseline
        shell: bash
        run: |
          set -euo pipefail
          kubectl create configmap capability-v1 --from-file=capability-v1.json=proposer/capability-v1.json --dry-run=client -o json \
            | jq --arg sha "$ROLLBACK_SHA" '.immutable=true | .metadata.annotations={"external-challenger/capability-sha256":$sha}' | kubectl apply -f -
          cat > /tmp/v1.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: challenger-old
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: challenger-old
            template:
              metadata:
                labels:
                  app: challenger-old
                annotations:
                  external-challenger/capability-sha256: "$ROLLBACK_SHA"
              spec:
                containers:
                  - name: web
                    image: nginx:1.27-alpine
                    volumeMounts:
                      - name: capability
                        mountPath: /usr/share/nginx/html/capability.json
                        subPath: capability-v1.json
                        readOnly: true
                volumes:
                  - name: capability
                    configMap:
                      name: capability-v1
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: challenger
          spec:
            selector:
              app: challenger-old
            ports:
              - port: 80
                targetPort: 80
          EOF
          kubectl apply -f /tmp/v1.yaml
          kubectl rollout status deployment/challenger-old --timeout=120s
          kubectl wait --for=jsonpath='{.endpoints[0].conditions.ready}'=true endpointslice -l kubernetes.io/service-name=challenger --timeout=120s
          kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json > stale-v1-endpoints.json

      - name: Deploy new artifact but prove inactive route is denied
        shell: bash
        run: |
          set -euo pipefail
          kubectl create configmap capability-v2 --from-file=candidate-v2.json=evaluator/candidate-v2.json --dry-run=client -o json \
            | jq --arg sha "$CANDIDATE_SHA" '.immutable=true | .metadata.annotations={"external-challenger/capability-sha256":$sha}' | kubectl apply -f -
          cat > /tmp/v2.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: challenger-next
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: challenger-next
            template:
              metadata:
                labels:
                  app: challenger-next
                annotations:
                  external-challenger/capability-sha256: "$CANDIDATE_SHA"
              spec:
                containers:
                  - name: web
                    image: nginx:1.27-alpine
                    volumeMounts:
                      - name: capability
                        mountPath: /usr/share/nginx/html/capability.json
                        subPath: candidate-v2.json
                        readOnly: true
                volumes:
                  - name: capability
                    configMap:
                      name: capability-v2
          EOF
          kubectl apply -f /tmp/v2.yaml
          kubectl rollout status deployment/challenger-next --timeout=120s
          ACTIVE_OLD="$(kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json | jq -r '.items[0].endpoints[0].targetRef.name')"
          OLD_DIGEST="$(kubectl get pod "$ACTIVE_OLD" -o json | jq -r '.metadata.annotations["external-challenger/capability-sha256"]')"
          jq -n --arg expected "$CANDIDATE_SHA" --arg active "$OLD_DIGEST" '{kind:"runtime",policy_verified:true,runtime:{evidence_available:true,endpoint_fresh:true,expected_digest:$expected,config_digest:$expected,routed_pod_count:1,expected_pod_count:1,all_routed_pods_ready:true,all_routed_pods_match_digest:false,old_digest_routed:true,active_route_digest:$active},expected:{candidate_digest:$expected}}' > /tmp/inactive-v2.json
          test "$(opa eval --format raw --input /tmp/inactive-v2.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = false

      - name: Activate new capability and prove active route reality
        shell: bash
        run: |
          set -euo pipefail
          kubectl patch service challenger --type merge -p '{"spec":{"selector":{"app":"challenger-next"}}}'
          for _ in $(seq 1 60); do
            POD="$(kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json | jq -r '[.items[].endpoints[]? | select(.conditions.ready==true) | .targetRef.name][0] // empty')"
            if [ -n "$POD" ]; then
              DIGEST="$(kubectl get pod "$POD" -o json | jq -r '.metadata.annotations["external-challenger/capability-sha256"]')"
              if [ "$DIGEST" = "$CANDIDATE_SHA" ]; then break; fi
            fi
            sleep 1
          done
          kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json > v2-endpoints.json
          ROUTED_PODS="$(jq -r '[.items[].endpoints[]? | select(.conditions.ready==true) | .targetRef.name] | unique | .[]' v2-endpoints.json)"
          test -n "$ROUTED_PODS"
          : > v2-routed-pods.jsonl
          COUNT=0
          ALL_MATCH=true
          ALL_READY=true
          while IFS= read -r pod; do
            [ -n "$pod" ] || continue
            kubectl get pod "$pod" -o json >> v2-routed-pods.jsonl
            COUNT=$((COUNT+1))
            DIGEST="$(kubectl get pod "$pod" -o json | jq -r '.metadata.annotations["external-challenger/capability-sha256"]')"
            READY="$(kubectl get pod "$pod" -o json | jq -r '[.status.containerStatuses[]?.ready] | all')"
            [ "$DIGEST" = "$CANDIDATE_SHA" ] || ALL_MATCH=false
            [ "$READY" = true ] || ALL_READY=false
          done <<< "$ROUTED_PODS"
          kubectl get configmap capability-v2 -o json | jq -j '.data["candidate-v2.json"]' > /tmp/served-v2.json
          CONFIG_SHA="$(sha256sum /tmp/served-v2.json | awk '{print $1}')"
          test "$CONFIG_SHA" = "$CANDIDATE_SHA"
          jq -n --arg expected "$CANDIDATE_SHA" --arg config "$CONFIG_SHA" --argjson count "$COUNT" --argjson allmatch "$ALL_MATCH" --argjson allready "$ALL_READY" '{kind:"runtime",policy_verified:true,runtime:{evidence_available:true,endpoint_fresh:true,expected_digest:$expected,config_digest:$config,routed_pod_count:$count,expected_pod_count:1,all_routed_pods_ready:$allready,all_routed_pods_match_digest:$allmatch,old_digest_routed:false,active_route_digest:$expected},expected:{candidate_digest:$expected}}' > runtime-v2-input.json
          test "$(opa eval --format raw --input runtime-v2-input.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = true
          ROUTE_SHA="$(jq -S . v2-endpoints.json | sha256sum | awk '{print $1}')"
          echo "ROUTE_V2_SHA=$ROUTE_SHA" >> "$GITHUB_ENV"

      - name: Runtime adversarial tests against live cluster
        shell: bash
        run: |
          set -euo pipefail
          jq '.runtime.endpoint_fresh=false' runtime-v2-input.json > /tmp/stale-endpoint.json
          test "$(opa eval --format raw --input /tmp/stale-endpoint.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = false
          OLD_POD="$(kubectl get pods -l app=challenger-old -o jsonpath='{.items[0].metadata.name}')"
          NEW_POD="$(kubectl get pods -l app=challenger-next -o jsonpath='{.items[0].metadata.name}')"
          kubectl label pod "$OLD_POD" serve=overtime-mixed --overwrite
          kubectl label pod "$NEW_POD" serve=overtime-mixed --overwrite
          kubectl patch service challenger --type merge -p '{"spec":{"selector":{"serve":"overtime-mixed"}}}'
          for _ in $(seq 1 30); do
            MIXED="$(kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json | jq '[.items[].endpoints[]? | select(.conditions.ready==true)] | length')"
            [ "$MIXED" -ge 2 ] && break
            sleep 1
          done
          test "$MIXED" -ge 2
          jq '.runtime.routed_pod_count=2 | .runtime.expected_pod_count=1 | .runtime.all_routed_pods_match_digest=false | .runtime.old_digest_routed=true' runtime-v2-input.json > /tmp/old-pod-serving.json
          test "$(opa eval --format raw --input /tmp/old-pod-serving.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = false
          kubectl patch service challenger --type merge -p '{"spec":{"selector":{"app":"challenger-next"}}}'
          jq '.runtime.active_route_digest="old-digest" | .runtime.all_routed_pods_match_digest=false | .runtime.old_digest_routed=true' runtime-v2-input.json > /tmp/stale-route.json
          test "$(opa eval --format raw --input /tmp/stale-route.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = false
          jq '.value="post-promotion-swap"' evaluator/candidate-v2.json > /tmp/swapped-v2.json
          SWAP_SHA="$(sha256sum /tmp/swapped-v2.json | awk '{print $1}')"
          test "$SWAP_SHA" != "$CANDIDATE_SHA"
          jq --arg swap "$SWAP_SHA" '.runtime.config_digest=$swap' runtime-v2-input.json > /tmp/runtime-swap.json
          test "$(opa eval --format raw --input /tmp/runtime-swap.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_runtime')" = false

      - name: Execute promoted capability and capture new outcome
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward service/challenger 18081:80 >/tmp/overtime-v2-pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/capability.json > execution-v2-response.json; then break; fi
            sleep 1
          done
          jq -e '.result == "SUCCESS" and .capability_version == "v2"' execution-v2-response.json >/dev/null
          EXECUTION_ID="execution-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESPONSE_SHA="$(sha256sum execution-v2-response.json | awk '{print $1}')"
          PROMOTION_SHA="$(sha256sum promoter/promotion-approval.json | awk '{print $1}')"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg execution "$EXECUTION_ID" --arg run "$GITHUB_RUN_ID" --arg cap "$CANDIDATE_SHA" --arg response "$RESPONSE_SHA" --arg route "$ROUTE_V2_SHA" --arg promotion "$PROMOTION_SHA" --arg now "$NOW" '{schema:"external-outcome-v1",execution_id:$execution,run_id:$run,capability_digest:$cap,response_sha256:$response,runtime_route_fingerprint:$route,promotion_digest:$promotion,classification:"SUCCESS",observed_at:$now}' > outcome-v2.json
          echo "EXECUTION_V2_ID=$EXECUTION_ID" >> "$GITHUB_ENV"
          echo "PROMOTION_SHA=$PROMOTION_SHA" >> "$GITHUB_ENV"
          echo "OUTCOME_V2_SHA=$(sha256sum outcome-v2.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Attest new outcome to deployer workflow identity
        uses: actions/attest@v4
        with:
          subject-path: outcome-v2.json
          predicate-type: https://example.org/external-challenger/outcome/v1
          predicate-path: outcome-v2.json

      - name: Verify new outcome is bound to promoted capability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-deployer.yml"
          gh attestation verify outcome-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$DEPLOYER" --predicate-type "$OUTCOME_PREDICATE" >/dev/null
          jq -n --arg run "$GITHUB_RUN_ID" --arg execution "$EXECUTION_V2_ID" --arg candidate "$CANDIDATE_SHA" --arg route "$ROUTE_V2_SHA" --arg promotion "$PROMOTION_SHA" '{kind:"new_outcome",policy_verified:true,outcome:{verified:true,classification:"SUCCESS",run_id:$run,execution_id:$execution,capability_digest:$candidate,runtime_route_fingerprint:$route,promotion_digest:$promotion},expected:{run_id:$run,execution_id:$execution,candidate_digest:$candidate,runtime_route_fingerprint:$route,promotion_digest:$promotion}}' > new-outcome-input.json
          test "$(opa eval --format raw --input new-outcome-input.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_new_outcome')" = true
          jq '.outcome.capability_digest="old-digest"' new-outcome-input.json > /tmp/new-outcome-lineage-mismatch.json
          test "$(opa eval --format raw --input /tmp/new-outcome-lineage-mismatch.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_new_outcome')" = false
          jq '.classification="FAILURE"' outcome-v2.json > /tmp/forged-new-outcome.json
          if gh attestation verify /tmp/forged-new-outcome.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$DEPLOYER" --predicate-type "$OUTCOME_PREDICATE" >/dev/null 2>&1; then exit 1; fi

      - name: Execute authorized rollback and preserve recovery lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.rollback_capability_digest' promoter/promotion-approval.json)" = "$ROLLBACK_SHA"
          kubectl patch service challenger --type merge -p '{"spec":{"selector":{"app":"challenger-old"}}}'
          for _ in $(seq 1 60); do
            POD="$(kubectl get endpointslices -l kubernetes.io/service-name=challenger -o json | jq -r '[.items[].endpoints[]? | select(.conditions.ready==true) | .targetRef.name][0] // empty')"
            if [ -n "$POD" ]; then
              DIGEST="$(kubectl get pod "$POD" -o json | jq -r '.metadata.annotations["external-challenger/capability-sha256"]')"
              if [ "$DIGEST" = "$ROLLBACK_SHA" ]; then break; fi
            fi
            sleep 1
          done
          test "$DIGEST" = "$ROLLBACK_SHA"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg run "$GITHUB_RUN_ID" --arg promotion "$PROMOTION_SHA" --arg from "$CANDIDATE_SHA" --arg rollback "$ROLLBACK_SHA" --arg outcome "$OUTCOME_V2_SHA" --arg now "$NOW" '{schema:"external-recovery-v1",run_id:$run,promotion_digest:$promotion,from_capability_digest:$from,rollback_digest:$rollback,source_outcome_digest:$outcome,active_route_digest:$rollback,authority_bound:true,recovered_at:$now}' > recovery.json

      - name: Attest recovery evidence
        uses: actions/attest@v4
        with:
          subject-path: recovery.json
          predicate-type: https://example.org/external-challenger/recovery/v1
          predicate-path: recovery.json

      - name: Verify recovery closure and negative cases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-deployer.yml"
          gh attestation verify recovery.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$DEPLOYER" --predicate-type "$RECOVERY_PREDICATE" >/dev/null
          jq -n --arg run "$GITHUB_RUN_ID" --arg promotion "$PROMOTION_SHA" --arg candidate "$CANDIDATE_SHA" --arg rollback "$ROLLBACK_SHA" '{kind:"recovery",policy_verified:true,promotion_verified:true,recovery:{evidence_available:true,authority_bound:true,promotion_digest:$promotion,from_capability_digest:$candidate,rollback_digest:$rollback,active_route_digest:$rollback,run_id:$run},expected:{promotion_digest:$promotion,candidate_digest:$candidate,rollback_digest:$rollback,run_id:$run}}' > recovery-input.json
          test "$(opa eval --format raw --input recovery-input.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_recovery')" = true
          jq '.recovery.rollback_digest="unauthorized"' recovery-input.json > /tmp/wrong-rollback.json
          test "$(opa eval --format raw --input /tmp/wrong-rollback.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_recovery')" = false
          jq '.recovery.evidence_available=false' recovery-input.json > /tmp/missing-recovery.json
          test "$(opa eval --format raw --input /tmp/missing-recovery.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_recovery')" = false
          jq '.recovery.authority_bound=false' recovery-input.json > /tmp/recovery-authority-mismatch.json
          test "$(opa eval --format raw --input /tmp/recovery-authority-mismatch.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_recovery')" = false

      - name: Provider failure and fail-closed tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{kind:"provider_transition",providers:{evidence_api_available:true,retention_available:true,approval_available:true,policy_available:true,runtime_credentials_available:true}}' > provider-input.json
          test "$(opa eval --format raw --input provider-input.json --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_provider_transition')" = true
          for field in evidence_api_available retention_available approval_available policy_available runtime_credentials_available; do
            jq --arg f "$field" '.providers[$f]=false' provider-input.json > "/tmp/provider-$field.json"
            test "$(opa eval --format raw --input "/tmp/provider-$field.json" --data "$POLICY_FILE" 'data.external_challenger.overtime.allow_provider_transition')" = false
          done
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          if HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= GH_TOKEN="$GH_TOKEN" gh attestation verify evaluator/candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" >/dev/null 2>&1; then
            echo 'online attestation verification unexpectedly survived injected API/network outage'
            exit 1
          fi
          CANDIDATE_BUNDLE="evaluator/offline/sha256-${CANDIDATE_SHA}.jsonl"
          test -f "$CANDIDATE_BUNDLE"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= GH_TOKEN= \
            gh attestation verify evaluator/candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" --bundle "$CANDIDATE_BUNDLE" --custom-trusted-root evaluator/offline/trusted-root.jsonl >/dev/null
          opa run --server --addr=127.0.0.1:8181 "$POLICY_FILE" >/tmp/opa-server.log 2>&1 &
          OPA_PID=$!
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8181/health >/dev/null 2>&1 && break; sleep 1; done
          kill "$OPA_PID"
          wait "$OPA_PID" 2>/dev/null || true
          if curl -fsS --max-time 2 http://127.0.0.1:8181/v1/data/external_challenger/overtime/allow_provider_transition >/dev/null 2>&1; then
            echo 'dead policy service unexpectedly answered'
            exit 1
          fi
          SAVED_KUBECONFIG="${KUBECONFIG:-}"
          export KUBECONFIG=/tmp/missing-kubeconfig
          if kubectl get namespace >/dev/null 2>&1; then
            echo 'runtime access unexpectedly worked after credential loss injection'
            exit 1
          fi
          if [ -n "$SAVED_KUBECONFIG" ]; then export KUBECONFIG="$SAVED_KUBECONFIG"; else unset KUBECONFIG; fi

      - name: Preserve offline-verifiable final evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-final
          (cd offline-final && gh attestation download ../outcome-v2.json -R "$GITHUB_REPOSITORY")
          (cd offline-final && gh attestation download ../recovery.json -R "$GITHUB_REPOSITORY")
          for bundle in offline-final/sha256:*.jsonl; do
            [ -e "$bundle" ] || continue
            mv "$bundle" "${bundle/sha256:/sha256-}"
          done
          gh attestation trusted-root > offline-final/trusted-root.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: overtime-final-evidence
          path: |
            deploy-input.json
            runtime-v2-input.json
            v2-endpoints.json
            v2-routed-pods.jsonl
            execution-v2-response.json
            outcome-v2.json
            new-outcome-input.json
            recovery.json
            recovery-input.json
            provider-input.json
            stale-v1-endpoints.json
            offline-final/**
          if-no-files-found: error
          retention-days: 30
