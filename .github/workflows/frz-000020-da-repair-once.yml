name: FRZ-000020 DA Repair Once

on:
  push:
    branches:
      - feature/frz-000020-semantic-claim-refinement-v1
    paths:
      - .github/workflows/frz-000020-da-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000020-semantic-claim-refinement-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce both semantic DA deaths
        run: |
          python -m unittest tests.test_semantic_claim_refinement_da -v && exit 1 || true
      - name: Apply minimal fail-closed semantic guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('semantic_claim_refinement/core.py')
          s=p.read_text()
          marker='''MAX_ADDED_CLAIMS = 128\nMAX_RULES = 32\n'''
          replacement='''MAX_ADDED_CLAIMS = 128\nMAX_RULES = 32\nNEGATION_OR_EXCEPTION_RE = re.compile(\n    r"\\b(?:no|not|never|without|cannot|can't|does not|doesn't|do not|don't|except|unless|unsupported|unavailable)\\b|\\bonly when\\b|\\bnot available\\b",\n    re.IGNORECASE,\n)\n'''
          if s.count(marker)!=1:
              raise SystemExit(f'constant marker mismatch: {s.count(marker)}')
          s=s.replace(marker,replacement)
          old='''            matches = _semantic_matches(anchor, rules)\n            if not matches:\n                unresolved.append({"source_id": source["source_id"], "anchor_sha256": anchor_hash, "preview": anchor[:240], "reason": "NO_ONTOLOGY_MATCH"})\n                continue\n\n            # Naive candidate: first semantic match wins. Destructive DA must kill\n            # negation reversal and multi-match ambiguity before this can survive.\n            rule = matches[0]\n'''
          new='''            matches = _semantic_matches(anchor, rules)\n            if matches and NEGATION_OR_EXCEPTION_RE.search(anchor):\n                unresolved.append({\n                    "source_id": source["source_id"],\n                    "anchor_sha256": anchor_hash,\n                    "preview": anchor[:240],\n                    "reason": "NEGATION_OR_EXCEPTION",\n                    "candidate_count": len(matches),\n                    "candidate_rule_ids": [rule.rule_id for rule in matches],\n                })\n                continue\n            if not matches:\n                unresolved.append({"source_id": source["source_id"], "anchor_sha256": anchor_hash, "preview": anchor[:240], "reason": "NO_ONTOLOGY_MATCH"})\n                continue\n            if len(matches) != 1:\n                unresolved.append({\n                    "source_id": source["source_id"],\n                    "anchor_sha256": anchor_hash,\n                    "preview": anchor[:240],\n                    "reason": "MULTIPLE_ONTOLOGY_MATCHES",\n                    "candidate_count": len(matches),\n                    "candidate_rule_ids": [rule.rule_id for rule in matches],\n                })\n                continue\n\n            rule = matches[0]\n'''
          if s.count(old)!=1:
              raise SystemExit(f'refinement marker mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Counter-DA and focused regression
        run: |
          python -m unittest tests.test_semantic_claim_refinement tests.test_semantic_claim_refinement_da -v
          python -m unittest tests.test_official_docs_intake tests.test_official_docs_intake_da -v
          python -m unittest tests.test_model_transition_intelligence tests.test_model_transition_intelligence_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Commit repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add semantic_claim_refinement/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: fail closed on negation and semantic multi-match'
          git push origin HEAD:feature/frz-000020-semantic-claim-refinement-v1
