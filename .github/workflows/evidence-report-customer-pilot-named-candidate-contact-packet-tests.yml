name: Evidence Report Customer Pilot Named Candidate Contact Packet Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-customer-pilot-named-candidate-contact-packet-tests.yml"
      - "docs/status/RTS_CURRENT_POSITION.md"
      - "docs/status/RTS_CURRENT_POSITION_NAMED_CANDIDATE_CONTACT_PACKET.json"
      - "proof_engine_pilot/product_readiness/round_0009/**"
      - "proof_engine_pilot/report_customer_pilot_named_candidate_contact_packet.py"
      - "proof_engine_pilot/report_customer_pilot_named_candidate_contact_packet_cli.py"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_customer_pilot_named_candidate_contact_packet_checkpoint_0030.json"
      - "tests/test_proof_engine_report_customer_pilot_named_candidate_contact_packet.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify prior signed candidate-shortlist history
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_prior_shortlist_history; print(verify_prior_shortlist_history())"
      - name: Verify contact packet contract
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_contract; verify_contract(); print('contract-ok')"
      - name: Verify named candidate selection
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_selection; verify_selection(); print('selection-ok')"
      - name: Verify public contact route and personalized message
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_route,verify_message; verify_route(); verify_message(); print('route-message-ok')"
      - name: Verify send preflight and response handling
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_preflight,verify_response; verify_preflight(); verify_response(); print('preflight-response-ok')"
      - name: Verify readiness hold and completion
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_score_hold,verify_completion; verify_score_hold(); verify_completion(); print('score-completion-ok')"
      - name: Verify progress and checkpoint
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet import verify_progress,verify_checkpoint; verify_progress(); verify_checkpoint(); print('position-checkpoint-ok')"
      - name: Verify complete named-candidate contact packet
        run: python -B -m proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet_cli verify
      - name: Verify score hold and closed external authority
        run: |
          python -B -m proof_engine_pilot.report_customer_pilot_named_candidate_contact_packet_cli summary > /tmp/named-candidate-contact-packet-summary.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/named-candidate-contact-packet-summary.json', encoding='utf-8'))
          assert value['state'] == 'INTERNAL_NAMED_CANDIDATE_SELECTION_AND_CONTACT_PACKET_COMPLETE'
          assert value['next_gate'] == 'HUMAN_ONE_TIME_OUTREACH_SEND_AUTHORIZATION_REQUIRED'
          assert value['rts_overall_planning_estimate_percent'] == 80
          assert value['short_term_internal_hardening_percent'] == 100
          assert value['product_readiness_score'] == 93
          assert value['product_readiness_score_change'] == 0
          assert value['named_contact_candidate_count'] == 1
          assert value['selected_repository'] == 'jbexta/AgentPilot'
          assert value['public_score'] == 86
          assert value['pilot_participant_count'] == 0
          assert value['preferred_route_status'] == 'PREFERRED_PENDING_HUMAN_VERIFICATION'
          assert value['named_recipient'] is None
          assert value['message_send_event_count'] == 0
          assert value['response_event_count'] == 0
          assert value['participant_contact_authorized'] is False
          assert value['customer_intake_authorized'] is False
          assert value['pilot_execution_authorized'] is False
          assert value['external_actions_performed'] is False
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_customer_pilot_named_candidate_contact_packet.py' -v
