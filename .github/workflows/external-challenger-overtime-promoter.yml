name: External Challenger Overtime Promoter

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  authorize-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLICY_PREDICATE: https://example.org/external-challenger/policy-activation/v1
      PROPOSAL_PREDICATE: https://example.org/external-challenger/learning-proposal/v1
      REGRESSION_PREDICATE: https://example.org/external-challenger/regression/v1
      CAPABILITY_PREDICATE: https://example.org/external-challenger/capability/v1
      PROMOTION_PREDICATE: https://example.org/external-challenger/promotion/v1
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0

      - uses: actions/download-artifact@v4
        with:
          name: overtime-policy-authority
          path: policy-authority

      - uses: actions/download-artifact@v4
        with:
          name: overtime-proposer
          path: proposer

      - uses: actions/download-artifact@v4
        with:
          name: overtime-evaluator
          path: evaluator

      - name: Cryptographically verify proposer and evaluator identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          gh attestation verify policy-authority/policy-activation.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$POLICY_SIGNER" --predicate-type "$POLICY_PREDICATE" >/dev/null
          gh attestation verify proposer/learning-proposal.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" --predicate-type "$PROPOSAL_PREDICATE" >/dev/null
          gh attestation verify evaluator/regression.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$REGRESSION_PREDICATE" >/dev/null
          gh attestation verify evaluator/candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" >/dev/null
          if gh attestation verify evaluator/regression.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml" --predicate-type "$REGRESSION_PREDICATE" >/dev/null 2>&1; then
            echo 'evaluator evidence incorrectly verified as promoter identity'
            exit 1
          fi

      - name: Evaluate independent promotion gate
        shell: bash
        run: |
          set -euo pipefail
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          PROPOSAL_SHA="$(sha256sum proposer/learning-proposal.json | awk '{print $1}')"
          REGRESSION_SHA="$(sha256sum evaluator/regression.json | awk '{print $1}')"
          CANDIDATE_SHA="$(sha256sum evaluator/candidate-v2.json | awk '{print $1}')"
          REGRESSION_RUN="$(jq -r '.run_id' evaluator/regression.json)"
          jq -n \
            --arg proposer "$PROPOSER" --arg evaluator "$EVALUATOR" --arg promoter "$PROMOTER" \
            --arg run "$GITHUB_RUN_ID" --arg proposal "$PROPOSAL_SHA" --arg regression "$REGRESSION_SHA" --arg candidate "$CANDIDATE_SHA" --arg regression_run "$REGRESSION_RUN" \
            '{kind:"promotion",policy_verified:true,roles:{proposer:$proposer,evaluator:$evaluator,promoter:$promoter},proposal_verified:true,regression_verified:true,regression_status:"PASS",regression_run_id:$regression_run,candidate_verified:true,candidate_digest:$candidate,proposal_digest:$proposal,regression_digest:$regression,approval_run_id:$run,expected:{proposer_identity:$proposer,evaluator_identity:$evaluator,promoter_identity:$promoter,run_id:$run,candidate_digest:$candidate,proposal_digest:$proposal,regression_digest:$regression}}' > promotion-input.json
          test "$(opa eval --format raw --input promotion-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_promotion')" = true
          echo "PROPOSAL_SHA=$PROPOSAL_SHA" >> "$GITHUB_ENV"
          echo "REGRESSION_SHA=$REGRESSION_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Create promotion decision
        shell: bash
        run: |
          set -euo pipefail
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          ROLLBACK_SHA="$(sha256sum proposer/capability-v1.json | awk '{print $1}')"
          POLICY_SHA="$(jq -r '.policy_sha256' policy-authority/policy-activation.json)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg id "promotion-${GITHUB_RUN_ID}" --arg run "$GITHUB_RUN_ID" --arg authority "$PROMOTER" \
            --arg candidate "$CANDIDATE_SHA" --arg rollback "$ROLLBACK_SHA" --arg proposal "$PROPOSAL_SHA" --arg regression "$REGRESSION_SHA" --arg policy "$POLICY_SHA" --arg source "$GITHUB_SHA" --arg now "$NOW" \
            '{schema:"external-promotion-decision-v1",promotion_id:$id,run_id:$run,authority_identity:$authority,decision:"APPROVED",authorized_capability_digest:$candidate,rollback_capability_digest:$rollback,proposal_digest:$proposal,regression_digest:$regression,policy_digest:$policy,source_revision:$source,approved_at:$now}' \
            > promotion-approval.json
          echo "PROMOTION_SHA=$(sha256sum promotion-approval.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Attest promotion authority decision
        uses: actions/attest@v4
        with:
          subject-path: promotion-approval.json
          predicate-type: https://example.org/external-challenger/promotion/v1
          predicate-path: promotion-approval.json

      - name: Verify promoter signer identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          gh attestation verify promotion-approval.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROMOTER" --predicate-type "$PROMOTION_PREDICATE" >/dev/null

      - name: Promotion adversarial tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          jq --arg p "$PROMOTER" '.roles.proposer=$p' promotion-input.json > /tmp/self-approval.json
          test "$(opa eval --format raw --input /tmp/self-approval.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_promotion')" = false
          jq '.proposal_verified=false' promotion-input.json > /tmp/missing-approval-input.json
          test "$(opa eval --format raw --input /tmp/missing-approval-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_promotion')" = false
          jq '.candidate_digest="forged"' promotion-input.json > /tmp/stale-approval-input.json
          test "$(opa eval --format raw --input /tmp/stale-approval-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_promotion')" = false
          jq '.authority_identity="unauthorized"' promotion-approval.json > /tmp/tampered-approval.json
          if gh attestation verify /tmp/tampered-approval.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROMOTER" --predicate-type "$PROMOTION_PREDICATE" >/dev/null 2>&1; then exit 1; fi
          jq '.roles.evaluator=.roles.proposer' promotion-input.json > /tmp/role-collapse.json
          test "$(opa eval --format raw --input /tmp/role-collapse.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_promotion')" = false

      - name: Preserve offline-verifiable promotion bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline
          (cd offline && gh attestation download ../promotion-approval.json -R "$GITHUB_REPOSITORY")
          for bundle in offline/sha256:*.jsonl; do
            [ -e "$bundle" ] || continue
            mv "$bundle" "${bundle/sha256:/sha256-}"
          done
          gh attestation trusted-root > offline/trusted-root.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: overtime-promoter
          path: |
            promotion-approval.json
            promotion-input.json
            offline/**
          if-no-files-found: error
          retention-days: 30
