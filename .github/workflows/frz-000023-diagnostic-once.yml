name: FRZ-000023 Diagnostic Once

on:
  push:
    branches:
      - feature/frz-000023-false-green-test-adequacy-gate-v1
    paths:
      - .github/workflows/frz-000023-diagnostic-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000023-false-green-test-adequacy-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture mutation and lane diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from test_adequacy_gate import run_mutation_suite
          from tests.test_test_adequacy_gate import collect_nonmutation_lanes
          mutation=run_mutation_suite()
          kb,ho,mm=collect_nonmutation_lanes()
          out={
            'mutation_audit':mutation['audit'],
            'mutants':[{k:r.get(k) for k in ('id','kind','status','load_ok','tests_ran','test_returncode','output_tail')} for r in mutation['results']],
            'known_bad':kb,
            'held_out':ho,
            'metamorphic':mm,
          }
          Path('docs/implementation/frz000023_diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add docs/implementation/frz000023_diagnostic.json
          git commit -m 'test: capture FRZ-000023 diagnostic evidence'
          git push origin HEAD:feature/frz-000023-false-green-test-adequacy-gate-v1
