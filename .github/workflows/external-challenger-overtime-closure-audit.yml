name: External Challenger Overtime Closure Audit

on:
  workflow_call:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  audit-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OUTCOME_PREDICATE: https://example.org/external-challenger/outcome/v1
      CAPABILITY_PREDICATE: https://example.org/external-challenger/capability/v1
      PROMOTION_PREDICATE: https://example.org/external-challenger/promotion/v1
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0

      - uses: actions/download-artifact@v4
        with:
          name: overtime-policy-authority
          path: policy-authority

      - uses: actions/download-artifact@v4
        with:
          name: overtime-proposer
          path: proposer

      - uses: actions/download-artifact@v4
        with:
          name: overtime-evaluator
          path: evaluator

      - uses: actions/download-artifact@v4
        with:
          name: overtime-promoter
          path: promoter

      - uses: actions/download-artifact@v4
        with:
          name: overtime-final-evidence
          path: final

      - name: Verify actual old and new evidence identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          FINALIZER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-finalizer.yml"
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          gh attestation verify proposer/outcome-v1.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" --predicate-type "$OUTCOME_PREDICATE" >/dev/null
          gh attestation verify final/outcome-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$FINALIZER" --predicate-type "$OUTCOME_PREDICATE" >/dev/null
          gh attestation verify promoter/promotion-approval.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROMOTER" --predicate-type "$PROMOTION_PREDICATE" >/dev/null

      - name: Replay the actual signed old outcome into the new transition and deny
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(sha256sum evaluator/candidate-v2.json | awk '{print $1}')"
          OLD_EXEC="$(jq -r '.execution_id' proposer/outcome-v1.json)"
          OLD_CAP="$(jq -r '.capability_digest' proposer/outcome-v1.json)"
          NEW_RUN="$(jq -r '.expected.run_id' final/new-outcome-input.json)"
          NEW_EXEC="$(jq -r '.expected.execution_id' final/new-outcome-input.json)"
          NEW_ROUTE="$(jq -r '.expected.runtime_route_fingerprint' final/new-outcome-input.json)"
          NEW_PROMOTION="$(jq -r '.expected.promotion_digest' final/new-outcome-input.json)"
          jq -n \
            --arg oldrun "$(jq -r '.run_id' proposer/outcome-v1.json)" \
            --arg oldexec "$OLD_EXEC" \
            --arg oldcap "$OLD_CAP" \
            --arg run "$NEW_RUN" \
            --arg exec "$NEW_EXEC" \
            --arg candidate "$CANDIDATE_SHA" \
            --arg route "$NEW_ROUTE" \
            --arg promotion "$NEW_PROMOTION" \
            '{kind:"new_outcome",policy_verified:true,outcome:{verified:true,classification:"FAILURE",run_id:$oldrun,execution_id:$oldexec,capability_digest:$oldcap,runtime_route_fingerprint:"old-route",promotion_digest:"none"},expected:{run_id:$run,execution_id:$exec,candidate_digest:$candidate,runtime_route_fingerprint:$route,promotion_digest:$promotion}}' \
            > actual-stale-outcome-replay.json
          test "$(opa eval --format raw --input actual-stale-outcome-replay.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_new_outcome')" = false

      - name: Missing promotion approval cannot reach deploy transition
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(sha256sum evaluator/candidate-v2.json | awk '{print $1}')"
          SOURCE="$(jq -r '.source_revision' evaluator/candidate-v2.json)"
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          jq -n --arg promoter "$PROMOTER" --arg run "$GITHUB_RUN_ID" --arg candidate "$CANDIDATE_SHA" --arg source "$SOURCE" '{kind:"deploy",policy_verified:true,promotion_verified:false,promotion:{decision:"APPROVED",authority_identity:$promoter,run_id:$run,authorized_capability_digest:$candidate,proposal_digest:"p",regression_digest:"r"},candidate_verified:true,candidate_digest:$candidate,candidate_source_revision:$source,expected:{promoter_identity:$promoter,run_id:$run,candidate_digest:$candidate,proposal_digest:"p",regression_digest:"r",source_revision:$source}}' > missing-approval-input.json
          test "$(opa eval --format raw --input missing-approval-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_deploy')" = false
          mv promoter/promotion-approval.json /tmp/promotion-approval.saved
          test ! -f promoter/promotion-approval.json
          mv /tmp/promotion-approval.saved promoter/promotion-approval.json

      - name: Unattested capability cannot impersonate promoted capability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          cp evaluator/candidate-v2.json /tmp/unattested-capability.json
          printf '\n' >> /tmp/unattested-capability.json
          if gh attestation verify /tmp/unattested-capability.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" >/dev/null 2>&1; then
            echo 'unattested capability unexpectedly verified'
            exit 1
          fi

      - name: Provider and account loss cannot turn unavailable evidence into allow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROMOTER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-promoter.yml"
          if HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= gh attestation verify promoter/promotion-approval.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROMOTER" --predicate-type "$PROMOTION_PREDICATE" >/dev/null 2>&1; then
            echo 'approval verification unexpectedly succeeded during provider outage'
            exit 1
          fi
          jq -n '{kind:"provider_transition",providers:{evidence_api_available:false,retention_available:false,approval_available:false,policy_available:false,runtime_credentials_available:false}}' > all-providers-unavailable.json
          test "$(opa eval --format raw --input all-providers-unavailable.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_provider_transition')" = false

      - name: Historical proof survives provider and credential loss through offline bundles
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(sha256sum evaluator/candidate-v2.json | awk '{print $1}')"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          CANDIDATE_BUNDLE="evaluator/offline/sha256-${CANDIDATE_SHA}.jsonl"
          test -f "$CANDIDATE_BUNDLE"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= GH_TOKEN= gh attestation verify evaluator/candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" --bundle "$CANDIDATE_BUNDLE" --custom-trusted-root evaluator/offline/trusted-root.jsonl >/dev/null
          POLICY_SHA="$(sha256sum policy-authority/overtime-policy.tgz | awk '{print $1}')"
          POLICY_BUNDLE="policy-authority/offline-policy/sha256-${POLICY_SHA}.jsonl"
          test -f "$POLICY_BUNDLE"
          POLICY_SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= GH_TOKEN= gh attestation verify policy-authority/overtime-policy.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$POLICY_SIGNER" --bundle "$POLICY_BUNDLE" --custom-trusted-root policy-authority/offline-policy/trusted-root.jsonl >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: overtime-closure-audit
          path: |
            actual-stale-outcome-replay.json
            missing-approval-input.json
            all-providers-unavailable.json
          if-no-files-found: error
          retention-days: 30
