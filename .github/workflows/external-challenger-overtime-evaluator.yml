name: External Challenger Overtime Evaluator

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  evaluate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLICY_PREDICATE: https://example.org/external-challenger/policy-activation/v1
      OUTCOME_PREDICATE: https://example.org/external-challenger/outcome/v1
      PROPOSAL_PREDICATE: https://example.org/external-challenger/learning-proposal/v1
      DATASET_PREDICATE: https://example.org/external-challenger/dataset/v1
      REGRESSION_PREDICATE: https://example.org/external-challenger/regression/v1
      CAPABILITY_PREDICATE: https://example.org/external-challenger/capability/v1
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0

      - uses: actions/download-artifact@v4
        with:
          name: overtime-policy-authority
          path: policy-authority

      - uses: actions/download-artifact@v4
        with:
          name: overtime-proposer
          path: proposer

      - name: Verify upstream signer identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          gh attestation verify policy-authority/policy-activation.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$POLICY_SIGNER" --predicate-type "$POLICY_PREDICATE" >/dev/null
          gh attestation verify proposer/outcome-v1.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" --predicate-type "$OUTCOME_PREDICATE" >/dev/null
          gh attestation verify proposer/learning-proposal.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" --predicate-type "$PROPOSAL_PREDICATE" >/dev/null
          gh attestation verify proposer/capability-v1.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$PROPOSER" >/dev/null

      - name: Build evidence-bound dataset and candidate
        shell: bash
        run: |
          set -euo pipefail
          OUTCOME_SHA="$(sha256sum proposer/outcome-v1.json | awk '{print $1}')"
          PROPOSAL_SHA="$(sha256sum proposer/learning-proposal.json | awk '{print $1}')"
          jq -n \
            --arg version "dataset-v1" \
            --arg outcome "$OUTCOME_SHA" \
            --arg proposal "$PROPOSAL_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{schema:"external-regression-dataset-v1",version:$version,source_outcome_digest:$outcome,proposal_digest:$proposal,run_id:$run,cases:[{id:"must-return-success",field:"result",expected:"SUCCESS"},{id:"must-be-v2",field:"capability_version",expected:"v2"}]}' \
            > dataset.json
          jq '.proposed_capability' proposer/learning-proposal.json > candidate-v2.json
          echo "OUTCOME_SHA=$OUTCOME_SHA" >> "$GITHUB_ENV"
          echo "PROPOSAL_SHA=$PROPOSAL_SHA" >> "$GITHUB_ENV"
          echo "DATASET_SHA=$(sha256sum dataset.json | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$(sha256sum candidate-v2.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Attest dataset
        uses: actions/attest@v4
        with:
          subject-path: dataset.json
          predicate-type: https://example.org/external-challenger/dataset/v1
          predicate-path: dataset.json

      - name: Attest candidate capability provenance
        uses: actions/attest@v4
        with:
          subject-path: candidate-v2.json

      - name: Attest candidate capability content
        uses: actions/attest@v4
        with:
          subject-path: candidate-v2.json
          predicate-type: https://example.org/external-challenger/capability/v1
          predicate-path: candidate-v2.json

      - name: Execute regression against candidate
        shell: bash
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0
          if test "$(jq -r '.result' candidate-v2.json)" = "SUCCESS"; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi
          if test "$(jq -r '.capability_version' candidate-v2.json)" = "v2"; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi
          test "$FAIL" -eq 0
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          jq -n \
            --arg run "$GITHUB_RUN_ID" \
            --arg evaluator "$EVALUATOR" \
            --arg candidate "$CANDIDATE_SHA" \
            --arg dataset "$DATASET_SHA" \
            --arg proposal "$PROPOSAL_SHA" \
            --arg now "$NOW" \
            --argjson pass "$PASS" \
            --argjson fail "$FAIL" \
            '{schema:"external-regression-result-v1",run_id:$run,evaluator_identity:$evaluator,candidate_digest:$candidate,dataset_digest:$dataset,proposal_digest:$proposal,pass_count:$pass,fail_count:$fail,status:"PASS",evaluated_at:$now}' \
            > regression.json
          echo "REGRESSION_SHA=$(sha256sum regression.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Attest regression result
        uses: actions/attest@v4
        with:
          subject-path: regression.json
          predicate-type: https://example.org/external-challenger/regression/v1
          predicate-path: regression.json

      - name: Verify regression transition from actual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROPOSER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-proposer.yml"
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          gh attestation verify dataset.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$DATASET_PREDICATE" >/dev/null
          gh attestation verify candidate-v2.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$CAPABILITY_PREDICATE" >/dev/null
          gh attestation verify regression.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$REGRESSION_PREDICATE" >/dev/null
          jq -n \
            --arg proposer "$PROPOSER" --arg run "$GITHUB_RUN_ID" --arg outcome "$OUTCOME_SHA" --arg proposal "$PROPOSAL_SHA" --arg dataset "$DATASET_SHA" --arg candidate "$CANDIDATE_SHA" \
            '{kind:"regression",policy_verified:true,proposal:{verified:true,proposer_identity:$proposer,run_id:$run},dataset:{verified:true,version:"dataset-v1",source_outcome_digest:$outcome,proposal_digest:$proposal},regression:{verified:true,status:"PASS",fail_count:0,candidate_digest:$candidate,dataset_digest:$dataset,proposal_digest:$proposal,run_id:$run},expected:{proposer_identity:$proposer,run_id:$run,dataset_version:"dataset-v1",outcome_digest:$outcome,proposal_digest:$proposal,dataset_digest:$dataset,candidate_digest:$candidate}}' > regression-input.json
          test "$(opa eval --format raw --input regression-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = true

      - name: Learning and regression adversarial tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVALUATOR="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-evaluator.yml"
          jq '.source_outcome_digest="contaminated"' dataset.json > /tmp/contaminated-dataset.json
          if gh attestation verify /tmp/contaminated-dataset.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$DATASET_PREDICATE" >/dev/null 2>&1; then exit 1; fi
          jq '.dataset.source_outcome_digest="contaminated"' regression-input.json > /tmp/contaminated-input.json
          test "$(opa eval --format raw --input /tmp/contaminated-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.dataset.version="dataset-v0"' regression-input.json > /tmp/wrong-version.json
          test "$(opa eval --format raw --input /tmp/wrong-version.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.proposal.run_id="stale-run"' regression-input.json > /tmp/stale-learning.json
          test "$(opa eval --format raw --input /tmp/stale-learning.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.proposal.proposer_identity="unauthorized"' regression-input.json > /tmp/unauthorized-learning.json
          test "$(opa eval --format raw --input /tmp/unauthorized-learning.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.result="FAILURE"' candidate-v2.json > /tmp/regression-failing-candidate.json
          if test "$(jq -r '.result' /tmp/regression-failing-candidate.json)" = "SUCCESS"; then exit 1; fi
          jq '.regression.status="FAIL" | .regression.fail_count=1' regression-input.json > /tmp/regression-failure.json
          test "$(opa eval --format raw --input /tmp/regression-failure.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.status="FAIL"' regression.json > /tmp/tampered-regression.json
          if gh attestation verify /tmp/tampered-regression.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$EVALUATOR" --predicate-type "$REGRESSION_PREDICATE" >/dev/null 2>&1; then exit 1; fi
          jq '.regression.verified=false' regression-input.json > /tmp/regression-bypass.json
          test "$(opa eval --format raw --input /tmp/regression-bypass.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false
          jq '.regression.run_id="stale-run"' regression-input.json > /tmp/stale-regression.json
          test "$(opa eval --format raw --input /tmp/stale-regression.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_regression')" = false

      - name: Preserve offline-verifiable candidate and regression bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline
          (cd offline && gh attestation download ../candidate-v2.json -R "$GITHUB_REPOSITORY")
          (cd offline && gh attestation download ../regression.json -R "$GITHUB_REPOSITORY")
          gh attestation trusted-root > offline/trusted-root.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: overtime-evaluator
          path: |
            candidate-v2.json
            dataset.json
            regression.json
            regression-input.json
            offline/**
          if-no-files-found: error
          retention-days: 30
