name: FRZ-000024 Diagnostic Once

on:
  push:
    branches:
      - feature/frz-000024-catalog-cost-false-green-repair-v1
    paths:
      - .github/workflows/frz-000024-diagnostic-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000024-catalog-cost-false-green-repair-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate repair and capture K1 diagnostics
        run: |
          python docs/implementation/frz000024_repair.py
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from human_escalation_gate import recover_escape_routes, evaluate_escalation_report
          from tests.test_human_escalation_gate import make_k0
          catalog=[
            'A cost-efficient creative model is described for routine media drafts.',
            'The catalog presents a cost-effective model for routine image drafts.',
            'A cost-optimized model is marketed for everyday creative drafts.',
          ]
          operational=[
            'Pricing for input tokens is $5 per million tokens.',
            'API cost increases from $5 to $7 per million tokens.',
            'Billing changed and the budget cap must be recalibrated before rollout.',
            'The token price is 7 USD per million input tokens.',
          ]
          fg=make_k0(catalog[0])
          fg1=evaluate_escalation_report(fg)
          proc=subprocess.run([sys.executable,'-m','unittest','tests.test_human_escalation_gate','tests.test_human_escalation_gate_da','-v'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          out={
            'catalog_routes': {x: recover_escape_routes(x) for x in catalog},
            'operational_routes': {x: recover_escape_routes(x) for x in operational},
            'fg_k0_classification': fg['records'][0]['classification'],
            'fg_k1_disposition': fg1['records'][0]['disposition'],
            'fg_k1_recovered': fg1['records'][0]['recovered_escape_routes'],
            'unittest_returncode': proc.returncode,
            'unittest_tail': proc.stdout[-12000:],
          }
          Path('docs/implementation/frz000024_k1_diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add docs/implementation/frz000024_k1_diagnostic.json
          git commit -m 'test: capture FRZ-000024 K1 diagnostic'
          git push origin HEAD:feature/frz-000024-catalog-cost-false-green-repair-v1
