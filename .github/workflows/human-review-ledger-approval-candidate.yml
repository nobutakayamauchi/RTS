name: Human Review Ledger Approval Candidate

on:
  pull_request:

permissions:
  contents: write

jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate approval candidate
        run: python .github/scripts/generate_human_review_ledger_approval.py
      - uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-approval-candidate
          path: human-review-ledger-approval-candidate
      - name: Verify governed records
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m governed_loop.cli verify
      - name: Run full tests
        id: tests
        continue-on-error: true
        run: python -B -m unittest discover -s tests -v > test-output.txt 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-ledger-approval-test-output
          path: test-output.txt
      - name: Require full tests
        if: steps.tests.outcome != 'success'
        run: |
          tail -n 200 test-output.txt
          exit 1
      - name: Finalize exact governed lifecycle artifacts
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf human-review-ledger-approval-candidate
          rm -f test-output.txt
          git rm .github/scripts/generate_human_review_ledger_approval.py
          git rm .github/workflows/human-review-ledger-approval-candidate.yml
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation/HUMAN_REVIEW_LEDGER_V1_APPROVAL_TASK.md \
            freezer/items/RTS-FRZ-000009/v002.json \
            freezer/items/RTS-FRZ-000009/v003.json \
            freezer/items/RTS-FRZ-000009/current.json \
            freezer/index/items.json \
            freezer/index/priority.json \
            freezer/index/build_priority.json \
            freezer/manifests/manifest.sha256 \
            governed_loop/runs/current.json
          git commit -m "Approve and start Human Review Ledger v1"
          git push origin "HEAD:${HEAD_BRANCH}"
