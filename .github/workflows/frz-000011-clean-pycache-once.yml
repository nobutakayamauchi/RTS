name: Clean FRZ-000011 Runtime Bytecode Once

on:
  push:
    branches:
      - feature/frz-000011-selective-recall-memory-lifecycle-v1
    paths:
      - .github/workflows/frz-000011-clean-pycache-once.yml

permissions:
  contents: write

concurrency:
  group: frz-000011-clean-pycache-once
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000011-selective-recall-memory-lifecycle-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Establish bytecode hygiene
        run: |
          set -euxo pipefail
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          EOF
          git rm -r --ignore-unmatch selective_recall/__pycache__ tests/__pycache__

      - name: Revalidate completed Child A before cleanup commit
        run: |
          set -euxo pipefail
          python -m selective_recall verify
          python -m unittest tests.test_selective_recall -v
          python -m unittest tests.test_selective_recall_da -v
          python -m unittest discover -s tests -p 'test_freezer*.py' -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify

      - name: Restore inherited tracked bytecode and assert cleanup-only diff
        run: |
          set -euxo pipefail
          git restore --source=origin/feature/frz-000001-adaptive-intelligence-v2 -- freezer/__pycache__
          rm .github/workflows/frz-000011-clean-pycache-once.yml
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          paths = [line[3:] for line in changed]
          forbidden = []
          for path in paths:
              normalized = path.split(' -> ')[-1]
              if normalized == '.gitignore':
                  continue
              if normalized == '.github/workflows/frz-000011-clean-pycache-once.yml':
                  continue
              if '__pycache__/' in normalized and normalized.endswith('.pyc'):
                  continue
              forbidden.append(path)
          if forbidden:
              raise SystemExit(f'non-bytecode cleanup diff detected: {forbidden}')
          print('cleanup diff bounded to .gitignore + bytecode artifacts')
          print('\n'.join(changed))
          PY
          git add -A

      - name: Commit cleaned review surface
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove FRZ-000011 runtime bytecode artifacts'
          git push origin HEAD:feature/frz-000011-selective-recall-memory-lifecycle-v1
