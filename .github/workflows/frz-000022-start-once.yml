name: FRZ-000022 Start Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-start-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify K0 completed and WIP clear
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def current(item_id):
              pointer = json.loads((Path('freezer/items') / item_id / 'current.json').read_text())
              return json.loads(Path(pointer['path']).read_text())

          k0 = current('RTS-FRZ-000021')
          assert k0['status'] == 'COMPLETED', k0
          assert not (Path('freezer/items/RTS-FRZ-000022/current.json')).exists()
          active=[]
          for p in Path('freezer/items').glob('RTS-FRZ-*/current.json'):
              row=current(p.parent.name)
              if row['status']=='IN_PROGRESS':
                  active.append(row['item_id'])
          assert active == [], active
          print('K0 COMPLETED; 000022 absent; WIP clear')
          PY
      - name: Capture FRZ-000022
        run: python -m freezer.cli add --input docs/implementation/frz000022_inputs/item_input.json
      - name: Create build assessment
        run: python -m freezer.build_assessment create RTS-FRZ-000022 --input docs/implementation/frz000022_inputs/build_assessment_input.json
      - name: Create implementation preflight
        run: python -m freezer.preflight create RTS-FRZ-000022 --input docs/implementation/frz000022_inputs/preflight_input.json
      - name: Apply explicit human approval
        run: python -m freezer.cli revise RTS-FRZ-000022 --input docs/implementation/frz000022_inputs/approve_selected.json
      - name: Enter governed WIP
        run: python -m freezer.cli revise RTS-FRZ-000022 --input docs/implementation/frz000022_inputs/start_in_progress.json
      - name: Verify governed start
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m freezer.preflight verify
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path('freezer/items/RTS-FRZ-000022/current.json').read_text())
          item=json.loads(Path(pointer['path']).read_text())
          assert item['status']=='IN_PROGRESS', item
          assert item['build_authority']=='APPROVED', item
          active=[]
          for p in Path('freezer/items').glob('RTS-FRZ-*/current.json'):
              q=json.loads(p.read_text())
              row=json.loads(Path(q['path']).read_text())
              if row['status']=='IN_PROGRESS': active.append(row['item_id'])
          assert active==['RTS-FRZ-000022'], active
          print('FRZ-000022 IN_PROGRESS; WIP=1')
          PY
      - name: Commit governed FREEZER start
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add freezer
          git diff --cached --quiet && exit 1 || true
          git commit -m 'freezer: start FRZ-000022 exhausted-AI human escalation gate v1'
          git push origin HEAD:feature/frz-000022-exhausted-ai-human-escalation-gate-v1
