name: FRZ-000016 Probe Cap Repair Once

on:
  push:
    branches:
      - feature/frz-000016-adaptive-engine-profiler-v1
    paths:
      - .github/workflows/frz-000016-probe-cap-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000016-adaptive-engine-profiler-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce cap defect
        run: |
          python - <<'PY'
          from model_behavior_adaptation.core import plan_probe_matrix
          engine={'provider':'fixture','model':'engine-a','model_revision':'r1','adapter_version':'1'}
          plan=plan_probe_matrix(engine,'coding',max_probes=1)
          assert plan['probe_count']==2, plan
          print('reproduced: max_probes=1 produced 2 probes')
          PY
      - name: Apply minimal repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('model_behavior_adaptation/core.py')
          s=p.read_text()
          old='''    seen = {_canonical(baseline)}\n    for field, value in variations:\n        candidate = dict(baseline)\n        candidate[field] = value\n        fingerprint = _canonical(candidate)\n        if fingerprint in seen:\n            continue\n        seen.add(fingerprint)\n        probes.append({\n            "probe_id": f"probe-{len(probes):02d}",\n            "changed_dimension": field,\n            "config": candidate,\n        })\n        if len(probes) >= max_probes:\n            break\n'''
          new='''    seen = {_canonical(baseline)}\n    for field, value in variations:\n        if len(probes) >= max_probes:\n            break\n        candidate = dict(baseline)\n        candidate[field] = value\n        fingerprint = _canonical(candidate)\n        if fingerprint in seen:\n            continue\n        seen.add(fingerprint)\n        probes.append({\n            "probe_id": f"probe-{len(probes):02d}",\n            "changed_dimension": field,\n            "config": candidate,\n        })\n'''
          if s.count(old)!=1:
              raise SystemExit(f'marker mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Verify F and stack regressions
        run: |
          python -m unittest tests.test_model_behavior_adaptation tests.test_model_behavior_adaptation_da -v
          python -m unittest tests.test_external_seed_corpus tests.test_external_seed_corpus_da -v
          python -m unittest tests.test_reuse_metrics tests.test_reuse_metrics_da -v
          python -m unittest tests.test_intelligence_compiler tests.test_intelligence_compiler_da -v
          python -m unittest tests.test_restart_surface tests.test_restart_surface_da -v
          python -m unittest tests.test_selective_recall tests.test_selective_recall_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Commit repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add model_behavior_adaptation/core.py
          git commit -m 'fix: honor FRZ-000016 single-probe cap'
          git push origin HEAD:feature/frz-000016-adaptive-engine-profiler-v1
