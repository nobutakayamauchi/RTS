name: Temporary Emergency METEOR
on:
  pull_request:
    paths:
      - 'thin-rts/ultimate-loop/**'
      - 'experiments/EMERGENCY_RECOVERY_GATE_20260814/**'
      - '.github/workflows/temporary-emergency-raisedetre.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing lifecycle baseline
        run: python thin-rts/ultimate-loop/test_lifecycle.py -v
      - name: Existing lifecycle destructive regression
        run: python thin-rts/ultimate-loop/test_meteor_lifecycle.py -v
      - name: Emergency prototype regression
        run: python experiments/EMERGENCY_RECOVERY_GATE_20260814/test_emergency_prototypes.py -v
      - name: Emergency destructive METEOR
        run: python experiments/EMERGENCY_RECOVERY_GATE_20260814/test_emergency_meteor.py -v
      - name: Emergency review death regressions
        run: python experiments/EMERGENCY_RECOVERY_GATE_20260814/test_emergency_review_deaths.py -v
