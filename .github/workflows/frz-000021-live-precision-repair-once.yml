name: FRZ-000021 Live Precision Repair Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-live-precision-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm new live-precision DA deaths
        run: |
          python -m unittest tests.test_review_necessity_triage -v
          python -m unittest tests.test_review_necessity_triage_da.ReviewNecessityTriageDATests.test_descriptive_reasoning_capability_is_not_operational_contract tests.test_review_necessity_triage_da.ReviewNecessityTriageDATests.test_short_catalog_heading_does_not_become_tool_contract -v && exit 1 || true
      - name: Separate operational contract from capability description
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('review_necessity_triage/core.py')
          s=p.read_text()

          marker='''    r"\\bsupports? up to\\b",\n)\n\n\ndef _canonical(value: Any) -> str:\n'''
          replacement='''    r"\\bsupports? up to\\b",\n)\n\nOPERATIONAL_GUIDANCE_PATTERNS: tuple[str, ...] = (\n    r"\\b(?:use|set|configure|provide|keep|select|choose|test|start with|switch|enable|disable|preserve|migrate)\\b",\n    r"\\bdo not\\b",\n    r"\\bshould\\b",\n    r"\\brecommend(?:ed|s)?\\b",\n)\n\nDESCRIPTIVE_CAPABILITY_PATTERNS: tuple[str, ...] = (\n    r"\\bmodel for\\b",\n    r"\\bmodel that\\b",\n    r"\\bengine with\\b",\n    r"\\bfeaturing\\b",\n    r"\\bcapabilit(?:y|ies)\\b",\n    r"\\bvideo generation\\b",\n    r"\\bimage generation\\b",\n    r"\\brobotic agents?\\b",\n    r"\\bstudio[- ]quality\\b",\n)\n\n\ndef _canonical(value: Any) -> str:\n'''
          if s.count(marker)!=1:
              raise SystemExit(f'pattern insertion marker mismatch: {s.count(marker)}')
          s=s.replace(marker,replacement)

          old='''def _matches_any(text: str, patterns: tuple[str, ...]) -> bool:\n    return any(re.search(pattern, text, re.IGNORECASE | re.MULTILINE) for pattern in patterns)\n\n\ndef _signal_matches(anchor: str) -> list[AttentionSignal]:\n'''
          new='''def _matches_any(text: str, patterns: tuple[str, ...]) -> bool:\n    return any(re.search(pattern, text, re.IGNORECASE | re.MULTILINE) for pattern in patterns)\n\n\ndef _looks_like_short_heading(text: str) -> bool:\n    words = re.findall(r"[A-Za-z0-9][A-Za-z0-9_-]*", text)\n    return 0 < len(words) <= 6 and not re.search(r"[.!?:;]", text)\n\n\ndef _is_concrete_operational_signal(anchor: str, signals: list[AttentionSignal]) -> bool:\n    base = any(signal.explicit_contract and signal.impact >= 3 for signal in signals)\n    if not base:\n        return False\n    normative = _matches_any(anchor, NORMATIVE_PATTERNS)\n    operational = _matches_any(anchor, OPERATIONAL_GUIDANCE_PATTERNS)\n    descriptive = _matches_any(anchor, DESCRIPTIVE_CAPABILITY_PATTERNS) or _matches_any(anchor, MARKETING_PATTERNS)\n    docs_link = _matches_any(anchor, DOCS_LINK_PATTERNS) or bool(re.match(r"^\\s*see\\b", anchor, re.IGNORECASE))\n    if _looks_like_short_heading(anchor) and not normative:\n        return False\n    if docs_link and not (normative or operational):\n        return False\n    if descriptive and not (normative or operational):\n        return False\n    return True\n\n\ndef _signal_matches(anchor: str) -> list[AttentionSignal]:\n'''
          if s.count(old)!=1:
              raise SystemExit(f'helper marker mismatch: {s.count(old)}')
          s=s.replace(old,new)

          old_da='''    pure_noise = _matches_any(anchor, PURE_NOISE_PATTERNS)\n    marketing = _matches_any(anchor, MARKETING_PATTERNS)\n    docs_link = _matches_any(anchor, DOCS_LINK_PATTERNS)\n\n    if signals:\n        explicit = any(signal.explicit_contract and signal.impact >= 3 for signal in signals)\n        if (pure_noise or docs_link) and not explicit:\n            impact, causal, factors, paths = 0, 0, ["non_actionable_surface"], []\n        elif marketing and not explicit:\n            impact = min(2, max(signal.impact for signal in signals))\n            causal = min(2, max(signal.causal_reach for signal in signals))\n            factors = ["marketing_positioning_with_bounded_signal"] + [signal.signal_id for signal in signals]\n            paths = sorted({path for signal in signals for path in signal.causal_paths})\n        else:\n'''
          new_da='''    pure_noise = _matches_any(anchor, PURE_NOISE_PATTERNS) or _looks_like_short_heading(anchor)\n    marketing = _matches_any(anchor, MARKETING_PATTERNS)\n    descriptive = _matches_any(anchor, DESCRIPTIVE_CAPABILITY_PATTERNS)\n    docs_link = _matches_any(anchor, DOCS_LINK_PATTERNS) or bool(re.match(r"^\\s*see\\b", anchor, re.IGNORECASE))\n\n    if signals:\n        explicit = _is_concrete_operational_signal(anchor, signals)\n        if (pure_noise or docs_link) and not explicit:\n            impact, causal, factors, paths = 0, 0, ["non_actionable_surface"], []\n        elif (marketing or descriptive) and not explicit:\n            impact = min(2, max(signal.impact for signal in signals))\n            causal = min(2, max(signal.causal_reach for signal in signals))\n            factors = ["descriptive_positioning_with_bounded_signal"] + [signal.signal_id for signal in signals]\n            paths = sorted({path for signal in signals for path in signal.causal_paths})\n        else:\n'''
          if s.count(old_da)!=1:
              raise SystemExit(f'DA block marker mismatch: {s.count(old_da)}')
          s=s.replace(old_da,new_da)

          old_counter='''    pure_noise = _matches_any(anchor, PURE_NOISE_PATTERNS)\n    marketing = _matches_any(anchor, MARKETING_PATTERNS)\n    docs_link = _matches_any(anchor, DOCS_LINK_PATTERNS)\n    normative = _matches_any(anchor, NORMATIVE_PATTERNS)\n    explicit = any(signal.explicit_contract and signal.impact >= 3 for signal in signals)\n\n    if explicit:\n'''
          new_counter='''    pure_noise = _matches_any(anchor, PURE_NOISE_PATTERNS) or _looks_like_short_heading(anchor)\n    marketing = _matches_any(anchor, MARKETING_PATTERNS)\n    descriptive = _matches_any(anchor, DESCRIPTIVE_CAPABILITY_PATTERNS)\n    docs_link = _matches_any(anchor, DOCS_LINK_PATTERNS) or bool(re.match(r"^\\s*see\\b", anchor, re.IGNORECASE))\n    normative = _matches_any(anchor, NORMATIVE_PATTERNS)\n    explicit = _is_concrete_operational_signal(anchor, signals)\n\n    if explicit:\n'''
          if s.count(old_counter)!=1:
              raise SystemExit(f'Counter-DA block marker mismatch: {s.count(old_counter)}')
          s=s.replace(old_counter,new_counter)

          s=s.replace('''    elif marketing:\n        importance = 1\n        reasons = ["marketing_or_positioning_without_concrete_contract"]\n''','''    elif marketing or descriptive:\n        importance = 1\n        reasons = ["marketing_or_positioning_without_concrete_contract"]\n''',1)
          p.write_text(s)
          PY
      - name: Counter-DA preserves both directions
        run: |
          python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
          python -m unittest tests.test_semantic_claim_refinement tests.test_semantic_claim_refinement_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Live precision check
        run: |
          python - <<'PY'
          from collections import Counter
          from official_docs_intake import build_intake_report
          from semantic_claim_refinement import refine_intake_report
          from review_necessity_triage import triage_refinement_report

          cases = [
              ('openai', 'gpt-5.6', 'api', 'https://developers.openai.com/api/docs/guides/latest-model.md'),
              ('anthropic', 'claude-fable-5', 'claude-api', 'https://platform.claude.com/docs/en/about-claude/models/overview.md'),
              ('google', 'gemini-3.7', 'gemini-api', 'https://ai.google.dev/gemini-api/docs/models'),
          ]
          total=Counter()
          for provider,generation,surface,url in cases:
              intake=build_intake_report({'provider':provider,'product_surface':surface,'generation':generation,'captured_at':'2026-08-27T12:49:00Z','query_terms':[generation],'explicit_urls':[url],'max_documents':1})
              j=refine_intake_report(intake)
              k=triage_refinement_report(j)
              c=Counter(r['classification'] for r in k['records'])
              print(provider, len(j['audit']['unresolved']), dict(c))
              total.update(c)
              total['J_UNRESOLVED'] += len(j['audit']['unresolved'])
          print('TOTAL', dict(total))
          assert total['HUMAN_NOW'] < 44, total
          assert total['DEFER_LOW_VALUE'] >= 25, total
          assert total['HUMAN_NOW'] > 0, total
          PY
      - name: Commit precision repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add review_necessity_triage/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: distinguish operational guidance from catalog capability'
          git push origin HEAD:feature/frz-000021-human-review-necessity-da-v1
