name: FRZ-000023 Repair Once

on:
  push:
    branches:
      - feature/frz-000023-false-green-test-adequacy-gate-v1
    paths:
      - .github/workflows/frz-000023-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000023-false-green-test-adequacy-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make mutation summaries self-verifying
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_adequacy_gate/core.py')
          s=p.read_text()
          marker='\ndef evaluate_test_adequacy(\n'
          assert s.count(marker)==1
          validator=r'''
def _validate_mutation_report(report: dict[str, Any]) -> dict[str, Any]:
    if not isinstance(report, dict) or report.get("schema_version") != "false-green-mutation-report/v1":
        raise TestAdequacyError("unexpected mutation report schema")
    before = report.get("source_sha256_before")
    after = report.get("source_sha256_after")
    if not isinstance(before, str) or len(before) != 64 or not isinstance(after, str) or len(after) != 64:
        raise TestAdequacyError("mutation report requires source hashes")
    baseline = report.get("baseline")
    if not isinstance(baseline, dict) or baseline.get("load_ok") is not True or baseline.get("tests_ran") is not True or baseline.get("test_returncode") != 0:
        raise TestAdequacyError("mutation baseline must be a passing targeted-test run")
    results = report.get("results")
    if not isinstance(results, list) or not results:
        raise TestAdequacyError("mutation results are required")
    ids=[]
    for row in results:
        if not isinstance(row, dict):
            raise TestAdequacyError("mutation result row must be an object")
        if row.get("kind") not in {"CRITICAL", "EQUIVALENT_CONTROL", "INVALID_CONTROL"}:
            raise TestAdequacyError("unknown mutation kind")
        if row.get("status") not in {"KILLED", "SURVIVED", "INVALID_MUTANT", "STALE_OPERATOR"}:
            raise TestAdequacyError("unknown mutation status")
        if not isinstance(row.get("id"), str) or not row["id"]:
            raise TestAdequacyError("mutation id is required")
        ids.append(row["id"])
    if len(ids) != len(set(ids)):
        raise TestAdequacyError("duplicate mutation id")
    critical=[r for r in results if r["kind"]=="CRITICAL"]
    equivalent=[r for r in results if r["kind"]=="EQUIVALENT_CONTROL"]
    invalid=[r for r in results if r["kind"]=="INVALID_CONTROL"]
    if not critical or not equivalent or not invalid:
        raise TestAdequacyError("critical and control mutants are all mandatory")
    computed={
        "critical_total": len(critical),
        "critical_killed": sum(r["status"]=="KILLED" for r in critical),
        "invalid_not_counted_as_kill": True,
        "mutation_lane_pass": all(r["status"]=="KILLED" and r.get("load_ok") is True and r.get("tests_ran") is True for r in critical),
        "controls_pass": all(r["status"]=="SURVIVED" and r.get("load_ok") is True for r in equivalent) and all(r["status"]=="INVALID_MUTANT" and r.get("load_ok") is False for r in invalid),
        "production_source_unchanged": before == after,
    }
    if report.get("audit") != computed:
        raise TestAdequacyError("mutation audit does not match recomputed mutant results")
    return computed

'''
          s=s.replace(marker,'\n'+validator+'def evaluate_test_adequacy(\n')
          old='''    for name, rows in (("known_bad", known_bad), ("held_out", held_out), ("metamorphic", metamorphic)):\n'''
          new='''    mutation_audit = _validate_mutation_report(mutation_report)\n    for name, rows in (("known_bad", known_bad), ("held_out", held_out), ("metamorphic", metamorphic)):\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''    mutation_pass = bool(mutation_report.get("audit", {}).get("mutation_lane_pass"))\n    controls_pass = bool(mutation_report.get("audit", {}).get("controls_pass"))\n    source_unchanged = bool(mutation_report.get("audit", {}).get("production_source_unchanged"))\n'''
          new='''    mutation_pass = mutation_audit["mutation_lane_pass"]\n    controls_pass = mutation_audit["controls_pass"]\n    source_unchanged = mutation_audit["production_source_unchanged"]\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''    expected = "ADEQUATE" if all(lanes.values()) else "HOLD_FALSE_GREEN_RISK"\n    if report.get("status") != expected:\n        raise TestAdequacyError("adequacy status does not match lane results")\n'''
          new='''    mutation_audit = _validate_mutation_report(report.get("mutation_report"))\n    for name in ("known_bad", "held_out", "metamorphic"):\n        rows = report.get(name)\n        if not isinstance(rows, list) or not rows or any(not isinstance(row, dict) or set(row) != {"case_id", "passed", "detail"} or not isinstance(row.get("passed"), bool) for row in rows):\n            raise TestAdequacyError(f"invalid {name} lane")\n    expected_lanes = {\n        "mutation": mutation_audit["mutation_lane_pass"],\n        "harness_controls": mutation_audit["controls_pass"],\n        "known_bad": all(row["passed"] for row in report["known_bad"]),\n        "held_out": all(row["passed"] for row in report["held_out"]),\n        "metamorphic": all(row["passed"] for row in report["metamorphic"]),\n        "production_source_unchanged": mutation_audit["production_source_unchanged"],\n    }\n    if lanes != expected_lanes:\n        raise TestAdequacyError("adequacy lane summary does not match underlying evidence")\n    expected = "ADEQUATE" if all(expected_lanes.values()) else "HOLD_FALSE_GREEN_RISK"\n    if report.get("status") != expected:\n        raise TestAdequacyError("adequacy status does not match lane results")\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Correct one held-out expectation and preserve the real false green
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_test_adequacy_gate.py')
          s=p.read_text()
          old='''        "passed": legacy_report["records"][0]["disposition"] == "AI_CONTINUE",\n'''
          new='''        "passed": legacy_report["records"][0]["disposition"] == "WAIT_SAFE_DEFER",\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''    def test_known_bad_held_out_and_metamorphic_lanes_pass(self):\n        for lane in (self.known_bad, self.held_out, self.metamorphic):\n            self.assertTrue(all(row["passed"] for row in lane), lane)\n\n    def test_full_adequacy_requires_all_lanes(self):\n'''
          new='''    def test_known_bad_and_metamorphic_pass_while_held_out_exposes_false_green(self):\n        self.assertTrue(all(row["passed"] for row in self.known_bad), self.known_bad)\n        self.assertTrue(all(row["passed"] for row in self.metamorphic), self.metamorphic)\n        failed=[row for row in self.held_out if not row["passed"]]\n        self.assertEqual([row["case_id"] for row in failed], ["HO_LOW_PRIORITY_CATALOG_TEXT"], self.held_out)\n\n    def test_full_adequacy_requires_all_lanes(self):\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''        self.assertEqual(report["status"], "ADEQUATE")\n'''
          new='''        self.assertEqual(report["status"], "HOLD_FALSE_GREEN_RISK")\n        self.assertFalse(report["lanes"]["held_out"])\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Counter-DA
        run: |
          python -m unittest tests.test_test_adequacy_gate -v
          python -m unittest tests.test_test_adequacy_gate_da -v
          python -m unittest tests.test_human_escalation_gate tests.test_human_escalation_gate_da -v
      - name: Commit repair
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add test_adequacy_gate/core.py tests/test_test_adequacy_gate.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: make FRZ-000023 false-green evidence self-verifying'
          git push origin HEAD:feature/frz-000023-false-green-test-adequacy-gate-v1
