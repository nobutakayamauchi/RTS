name: Evidence Report Product Readiness Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-product-readiness-tests.yml"
      - "proof_engine_pilot/product_readiness/**"
      - "proof_engine_pilot/report_product_readiness.py"
      - "proof_engine_pilot/report_product_readiness_cli.py"
      - "proof_engine_pilot/operational_validation_builds/round_0001/README.md"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_product_readiness_checkpoint_0022.json"
      - "tests/test_proof_engine_report_product_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify product readiness assessment
        run: python -B -m proof_engine_pilot.report_product_readiness_cli verify
      - name: Verify completion and boundary
        run: |
          python -B -m proof_engine_pilot.report_product_readiness_cli summary > /tmp/readiness.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/readiness.json', encoding='utf-8'))
          assert value['completion'] == {
              'overall_rts_percent': 72,
              'short_term_internal_product_candidate_percent': 92,
              'product_readiness_score': 82,
          }
          assert value['decision'] == 'READY_FOR_BOUNDED_INTERNAL_HARDENING'
          assert value['state'] == 'INTERNAL_PRODUCT_READINESS_ASSESSED'
          assert value['next_gate'] == 'HUMAN_BOUNDED_HARDENING_EXECUTION_REVIEW_REQUIRED'
          assert value['customer_pilot_ready'] is False
          assert value['production_service_ready'] is False
          assert value['pricing_status'] == 'NOT_PRICED'
          assert value['external_actions_performed'] is False
          PY
      - name: Verify normalized instruction record
        run: |
          python - <<'PY'
          from proof_engine_pilot.report_product_readiness import verify_instruction_record
          value = verify_instruction_record()
          assert value['raw_input_retained_in_operator_surfaces'] is False
          assert 'raw_input' not in value
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_product_readiness.py' -v
