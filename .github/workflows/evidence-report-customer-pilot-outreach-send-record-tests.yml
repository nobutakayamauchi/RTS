name: Evidence Report Customer Pilot Outreach Send Record Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-customer-pilot-outreach-send-record-tests.yml"
      - "docs/status/RTS_CURRENT_POSITION.md"
      - "docs/status/RTS_CURRENT_POSITION_OUTREACH_WAITING.json"
      - "proof_engine_pilot/product_readiness/round_0010/**"
      - "proof_engine_pilot/report_customer_pilot_outreach_send_record.py"
      - "proof_engine_pilot/report_customer_pilot_outreach_send_record_cli.py"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_customer_pilot_outreach_waiting_checkpoint_0031.json"
      - "tests/test_proof_engine_report_customer_pilot_outreach_send_record.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify prior signed contact-packet history
        run: python -B -c "from proof_engine_pilot.report_customer_pilot_outreach_send_record import verify_prior_history; print(verify_prior_history())"
      - name: Verify human-attested outreach record
        run: python -B -m proof_engine_pilot.report_customer_pilot_outreach_send_record_cli verify
      - name: Verify waiting state and closed authority
        run: |
          python -B -m proof_engine_pilot.report_customer_pilot_outreach_send_record_cli summary > /tmp/outreach-summary.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/outreach-summary.json',encoding='utf-8'))
          assert value['state']=='HUMAN_ATTESTED_ONE_TIME_OUTREACH_RECORDED'
          assert value['next_gate']=='HUMAN_RESPONSE_EVENT_OR_NO_RESPONSE_WINDOW_EXPIRY_REQUIRED'
          assert value['rts_overall_planning_estimate_percent']==81
          assert value['product_readiness_score']==93
          assert value['message_send_event_count']==1
          assert value['follow_up_event_count']==0
          assert value['response_event_count']==0
          assert value['response_status']=='NOT_REPORTED_AT_RECORD_TIME'
          assert value['discord_content_monitoring_available'] is False
          assert value['pilot_participant_count']==0
          assert value['customer_intake_event_count']==0
          assert value['pilot_execution_event_count']==0
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_customer_pilot_outreach_send_record.py' -v
