name: Recover FRZ-000012 Survivor Once

on:
  push:
    branches:
      - feature/frz-000012-compact-active-restart-surface-v1
    paths:
      - .github/workflows/frz-000012-recover-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000012-compact-active-restart-surface-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recovery runner syntax
        run: python -m py_compile scripts/recover_frz000012.py
      - name: Replay proven B loop and push survivor
        run: python scripts/recover_frz000012.py
