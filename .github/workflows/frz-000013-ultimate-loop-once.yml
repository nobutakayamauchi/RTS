name: FRZ-000013 Ultimate Loop Once

on:
  push:
    branches:
      - feature/frz-000013-incremental-resumable-intelligence-compiler-v1
    paths:
      - .github/workflows/frz-000013-ultimate-loop-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  ultimate-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000013-incremental-resumable-intelligence-compiler-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate C runner syntax
        run: python -m py_compile scripts/run_frz000013_ultimate_loop.py
      - name: Apply realized A/B reuse to assessment input generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_frz000013_ultimate_loop.py')
          s=p.read_text()
          old="'implementation': {'from_scratch_hours': 18, 'integration_hours': 3, 'validation_hours': 4, 'unknown_buffer_hours': 2},"
          new="'implementation': {'from_scratch_hours': 14, 'integration_hours': 2, 'validation_hours': 3, 'unknown_buffer_hours': 1},"
          if s.count(old)!=1: raise SystemExit('implementation estimate marker mismatch')
          s=s.replace(old,new)
          old2="'estimated_hours_saved': 3, 'notes': 'Reuse provenance, fail-closed validation, lifecycle non-authority.'"
          new2="'estimated_hours_saved': 4, 'notes': 'Reuse provenance, fail-closed validation, lifecycle non-authority.'"
          if s.count(old2)!=1: raise SystemExit('reuse estimate marker mismatch')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Run Child C Ultimate Loop
        run: python scripts/run_frz000013_ultimate_loop.py
