name: Promotion Preview Regeneration Candidate

on:
  pull_request:
    paths:
      - "promotion_application_preview/schemas/preview.schema.json"
      - "tests/test_promotion_application_preview.py"
      - ".github/workflows/promotion-preview-regeneration-candidate.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate exact committed fixtures
        run: |
          python -B -m promotion_application_preview.cli generate > promotion_application_preview/previews/current.json
          python - <<'PY'
          from pathlib import Path
          from governed_loop.common import pretty_json
          from governed_loop.generation import generate_run
          root = Path('.').resolve()
          (root / 'governed_loop/runs/current.json').write_text(
              pretty_json(generate_run(root)), encoding='utf-8'
          )
          PY
      - name: Verify regenerated state
        run: |
          python -B -m promotion_application_preview.cli verify
          python -B -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
      - name: Commit verified fixtures and remove temporary workflow
        run: |
          rm -f .github/workflows/promotion-preview-regeneration-candidate.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Promotion Preview governed fixtures"
          git push
