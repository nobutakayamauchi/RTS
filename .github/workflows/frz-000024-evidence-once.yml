name: FRZ-000024 Evidence Once

on:
  push:
    branches:
      - feature/frz-000024-catalog-cost-false-green-repair-v1
    paths:
      - .github/workflows/frz-000024-evidence-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000024-catalog-cost-false-green-repair-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture resolved false-green and adequacy evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tests.test_human_escalation_gate import make_k0
          from human_escalation_gate import evaluate_escalation_report, recover_escape_routes
          from test_adequacy_gate import run_mutation_suite, evaluate_test_adequacy, verify_test_adequacy_report
          from tests.test_test_adequacy_gate import collect_nonmutation_lanes

          anchor='A cost-efficient creative model is described for routine media drafts.'
          k0=make_k0(anchor)
          k1=evaluate_escalation_report(k0)
          mutation=run_mutation_suite()
          known_bad, held_out, metamorphic=collect_nonmutation_lanes()
          adequacy=evaluate_test_adequacy(
              mutation,
              known_bad=known_bad,
              held_out=held_out,
              metamorphic=metamorphic,
          )
          verify_test_adequacy_report(adequacy)
          operational=[
              'Pricing for input tokens is $5 per million tokens.',
              'API cost increases from $5 to $7 per million tokens.',
              'Billing changed and the budget cap must be recalibrated before rollout.',
              'The token price is 7 USD per million input tokens.',
          ]
          out={
              'schema_version':'frz-000024-resolution-evidence/v1',
              'finding_id':'FRZ-000023-FG-001',
              'historical_finding_preserved':True,
              'anchor':anchor,
              'expected_disposition':'WAIT_SAFE_DEFER',
              'post_repair':{
                  'k0_classification':k0['records'][0]['classification'],
                  'k0_explicit_contract_signal':k0['records'][0]['da']['explicit_contract_signal'],
                  'k0_da_problem_solving_paths':k0['records'][0]['da']['problem_solving_paths'],
                  'k0_counter_da_problem_solving_paths':k0['records'][0]['counter_da']['problem_solving_paths'],
                  'k1_recovered_escape_routes':k1['records'][0]['recovered_escape_routes'],
                  'k1_residual_routes':k1['records'][0]['residual_routes'],
                  'k1_disposition':k1['records'][0]['disposition'],
              },
              'operational_cost_controls':[
                  {'anchor':text,'routes':recover_escape_routes(text)} for text in operational
              ],
              'mutation_audit':mutation['audit'],
              'mutation_statuses':[
                  {'id':r['id'],'kind':r['kind'],'status':r['status'],'load_ok':r.get('load_ok'),'tests_ran':r.get('tests_ran')}
                  for r in mutation['results']
              ],
              'lane_status':adequacy['lanes'],
              'known_bad':known_bad,
              'held_out':held_out,
              'metamorphic':metamorphic,
              'adequacy_status':adequacy['status'],
              'adequacy_scope':'CURRENT_DEFINED_K2_LANES_ONLY',
              'zero_defect_claim':False,
              'authority':{
                  'execution':'NONE',
                  'profile_application':'NONE',
                  'promotion':'NONE',
                  'canon':'NONE',
                  'semantic_truth':'NONE',
              },
          }
          assert out['post_repair']['k0_classification'] in {'HUMAN_LATER','DEFER_LOW_VALUE'}, out
          assert out['post_repair']['k0_explicit_contract_signal'] is False, out
          assert out['post_repair']['k1_disposition']=='WAIT_SAFE_DEFER', out
          assert 'RECALIBRATE_LIMIT_OR_BUDGET' not in out['post_repair']['k1_recovered_escape_routes'], out
          assert all('RECALIBRATE_LIMIT_OR_BUDGET' in row['routes'] for row in out['operational_cost_controls']), out
          assert out['mutation_audit']['critical_total']==7, out
          assert out['mutation_audit']['critical_killed']==7, out
          assert out['mutation_audit']['mutation_lane_pass'] is True, out
          assert out['mutation_audit']['controls_pass'] is True, out
          assert all(out['lane_status'].values()), out
          assert out['adequacy_status']=='ADEQUATE', out
          Path('docs/implementation/frz000024_resolution.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit resolution evidence
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add docs/implementation/frz000024_resolution.json
          git diff --cached --quiet && exit 1 || true
          git commit -m 'test: record FRZ-000024 post-repair adequacy evidence'
          git push origin HEAD:feature/frz-000024-catalog-cost-false-green-repair-v1
