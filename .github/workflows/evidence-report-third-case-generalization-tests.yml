name: Evidence Report Third-Case Generalization Tests

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-report-third-case-generalization-tests.yml"
      - "docs/status/RTS_CURRENT_POSITION.*"
      - "docs/status/RTS_DEVELOPMENT_SPEED*"
      - "proof_engine_pilot/product_readiness/round_0004/**"
      - "proof_engine_pilot/report_third_case_generalization.py"
      - "proof_engine_pilot/report_third_case_generalization_cli.py"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_third_case_checkpoint_0025.json"
      - "tests/test_proof_engine_report_third_case_generalization.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify HARD-004 artifacts and prior builder stability
        run: python -B -m proof_engine_pilot.report_third_case_generalization_cli verify
      - name: Verify final shape, current position, and speed boundary
        run: |
          python -B -m proof_engine_pilot.report_third_case_generalization_cli summary > /tmp/third-case-summary.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/third-case-summary.json', encoding='utf-8'))
          assert value['state'] == 'INTERNAL_THREE_CASE_GENERALIZATION_VALIDATED'
          assert value['next_gate'] == 'HUMAN_PRIVACY_AND_OPERATING_METRICS_EXECUTION_REVIEW_REQUIRED'
          assert value['rts_overall_planning_estimate_percent'] == 75
          assert value['short_term_internal_product_candidate_percent'] == 99
          assert value['product_readiness_baseline_score'] == 82
          assert value['current_step'] == 'HARD-005'
          assert value['third_case_repository'] == 'nobutakayamauchi/RTS-AGE'
          assert value['selected_pr_count'] == 8
          assert value['effective_record_count'] == 6
          assert value['withheld_claim_count'] == 5
          assert value['package_artifact_count'] == 8
          assert value['comparison_dimension_count'] == 12
          assert value['development_speed_level'] == 'HIGH_VELOCITY_GOVERNED_SOLO_AI_DEVELOPMENT'
          assert value['median_pr_gate_seconds'] == 415.5
          assert value['median_sequential_stage_seconds'] == 1469.0
          assert value['speed_is_sla'] is False
          assert value['remaining_work_items'] == ['HARD-005']
          PY
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p 'test_proof_engine_report_third_case_generalization.py' -v
