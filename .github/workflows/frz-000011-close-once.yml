name: Close FRZ-000011 Through Ultimate Loop

on:
  push:
    branches:
      - feature/frz-000011-selective-recall-memory-lifecycle-v1
    paths:
      - .github/workflows/frz-000011-close-once.yml

permissions:
  contents: write

concurrency:
  group: frz-000011-close-once
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000011-selective-recall-memory-lifecycle-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact pre-close boundary
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          p = json.loads((root/'freezer/items/RTS-FRZ-000011/current.json').read_text())
          item = json.loads((root/p['path']).read_text())
          assert item['status'] == 'IN_PROGRESS', item
          assert item['build_authority'] == 'APPROVED', item
          for item_id in ('RTS-FRZ-000012','RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              q = json.loads((root/'freezer/items'/item_id/'current.json').read_text())
              sibling = json.loads((root/q['path']).read_text())
              assert sibling['status'] == 'FROZEN', sibling
              assert sibling['build_authority'] == 'NOT_APPROVED', sibling
          print('pre-close WIP boundary OK')
          PY

      - name: Make Child A regression boundary lifecycle-stable
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_selective_recall.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''    def test_only_child_a_is_in_progress_and_siblings_remain_frozen(self) -> None:
              active = []
              for current in (self.repo_root / "freezer" / "items").glob("RTS-FRZ-*/current.json"):
                  pointer = json.loads(current.read_text(encoding="utf-8"))
                  item = json.loads((self.repo_root / pointer["path"]).read_text(encoding="utf-8"))
                  if item["status"] == "IN_PROGRESS":
                      active.append(item["item_id"])
              self.assertEqual(active, ["RTS-FRZ-000011"])

              for item_id in ("RTS-FRZ-000012", "RTS-FRZ-000013", "RTS-FRZ-000014", "RTS-FRZ-000015"):
                  pointer = json.loads(
                      (self.repo_root / "freezer" / "items" / item_id / "current.json").read_text(
                          encoding="utf-8"
                      )
                  )
                  item = json.loads((self.repo_root / pointer["path"]).read_text(encoding="utf-8"))
                  self.assertEqual(item["status"], "FROZEN")
                  self.assertEqual(item["build_authority"], "NOT_APPROVED")
          '''.replace('          ', '')
          new = '''    def test_child_a_lifecycle_boundary_is_governed(self) -> None:
              items = {}
              active = []
              for current in (self.repo_root / "freezer" / "items").glob("RTS-FRZ-*/current.json"):
                  pointer = json.loads(current.read_text(encoding="utf-8"))
                  item = json.loads((self.repo_root / pointer["path"]).read_text(encoding="utf-8"))
                  items[item["item_id"]] = item
                  if item["status"] == "IN_PROGRESS":
                      active.append(item["item_id"])

              child = items["RTS-FRZ-000011"]
              self.assertIn(child["status"], {"IN_PROGRESS", "VERIFIED", "COMPLETED"})
              if child["status"] == "IN_PROGRESS":
                  self.assertEqual(active, ["RTS-FRZ-000011"])
                  for item_id in ("RTS-FRZ-000012", "RTS-FRZ-000013", "RTS-FRZ-000014", "RTS-FRZ-000015"):
                      self.assertEqual(items[item_id]["status"], "FROZEN")
                      self.assertEqual(items[item_id]["build_authority"], "NOT_APPROVED")
              else:
                  self.assertNotIn("RTS-FRZ-000011", active)
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected one Child A lifecycle test block, got {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/frz-000011-selective-recall-v1.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = '''          active = []
              for p in (root / 'freezer' / 'items').glob('RTS-FRZ-*/current.json'):
                  pointer = json.loads(p.read_text())
                  item = json.loads((root / pointer['path']).read_text())
                  if item['status'] == 'IN_PROGRESS':
                      active.append(item['item_id'])
              assert active == ['RTS-FRZ-000011'], active

              for item_id in ('RTS-FRZ-000012','RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
                  pointer = json.loads((root / 'freezer' / 'items' / item_id / 'current.json').read_text())
                  item = json.loads((root / pointer['path']).read_text())
                  assert item['status'] == 'FROZEN', item
                  assert item['build_authority'] == 'NOT_APPROVED', item
              print('WIP=1 and sibling freeze boundary OK')
          '''.replace('          ', '')
          new = '''          items = {}
              active = []
              for p in (root / 'freezer' / 'items').glob('RTS-FRZ-*/current.json'):
                  pointer = json.loads(p.read_text())
                  item = json.loads((root / pointer['path']).read_text())
                  items[item['item_id']] = item
                  if item['status'] == 'IN_PROGRESS':
                      active.append(item['item_id'])

              child = items['RTS-FRZ-000011']
              assert child['status'] in {'IN_PROGRESS', 'VERIFIED', 'COMPLETED'}, child
              if child['status'] == 'IN_PROGRESS':
                  assert active == ['RTS-FRZ-000011'], active
                  for item_id in ('RTS-FRZ-000012','RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
                      sibling = items[item_id]
                      assert sibling['status'] == 'FROZEN', sibling
                      assert sibling['build_authority'] == 'NOT_APPROVED', sibling
              else:
                  assert 'RTS-FRZ-000011' not in active, active
              print('Child A lifecycle governance boundary OK')
          '''.replace('          ', '')
          if workflow.count(old) != 1:
              raise SystemExit(f'expected one validation WIP block, got {workflow.count(old)}')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Write METEOR survivor evidence
        run: |
          cat > thin-rts/ultimate-loop/METEOR_RESULT_FRZ_000011_2026-08-27.md <<'EOF'
          # FRZ-000011 — Selective Recall + Memory Lifecycle v1 — METEOR Result

          Date: **2026-08-27**

          Status: `REPOSITORY_METEOR_SURVIVOR / LOCAL_VERIFICATION_BOUNDARY`

          ## Frozen responsibility

          Reuse RTS historical memory without rereading the whole corpus, while keeping stale, superseded, quarantined, raw, or irrelevant memory from silently becoming current execution authority.

          This child owns only a deterministic, repository-local, non-authorizing selective-recall/lifecycle layer over the existing RTS memory/index assets. It does not own a new database, provider runtime, crawler, deployment engine, autonomous promotion engine, or external action surface.

          ## Baseline candidate and retained death

          Initial candidate / destructive run:

          - commit: `e632e4e20d27e6bf12fb3177494f084a1a4c2c33`
          - GitHub Actions run: `33047223630`
          - result: **FAILED** on the frozen DA workload.

          The retained death classes were:

          1. irrelevant event/scope records could still incur source-body freshness hashing before cheap metadata rejection;
          2. excluded memory identities were emitted as an unbounded list, allowing recall diagnostics themselves to grow with corpus size;
          3. stale irrelevant memory had to remain metadata-ineligible without paying freshness I/O.

          `SELECTIVE RECALL != HASH EVERYTHING THEN FILTER`

          `BOUNDED RETRIEVAL != UNBOUNDED EXCLUSION DUMP`

          ## Minimal repair

          Repair commit:

          - `dfd463cc7a39d069816512d7d45c795d52d18b85`

          The repair only:

          - moves lifecycle/supersession/event/scope metadata rejection ahead of source freshness hashing;
          - hashes only metadata-eligible candidates;
          - replaces per-memory exclusion identity output with `excluded_count` plus bounded `exclusion_counts` aggregates.

          It does not add authority, external I/O, autonomous lifecycle mutation, or a second memory store.

          ## Counter-DA survivor

          Independently re-run repaired head:

          - head: `8071b31e6d00480383230e57f52061c503216ddc`
          - GitHub Actions run: `33047645367`
          - Selective Recall baseline: **19/19 PASS**
          - DA + Counter-DA: **5/5 PASS**
          - existing FREEZER regression: **41/41 PASS**
          - FREEZER verification: **PASS**
          - Build Assessment verification: **PASS**
          - registry freshness: **2/2 CURRENT**
          - recall execution authority: `NONE`
          - recall promotion authority: `NONE`
          - smallest-anchor CLI probe: **PASS**
          - direct `RAW -> CANONICAL`: **REJECTED** as required.

          Counter-DA specifically proves both sides of the optimization boundary:

          - an irrelevant/scope-mismatched stratum remains cold and does not pay source hashing;
          - a relevant stale candidate still pays the freshness check and is rejected as `STALE`.

          ## METEOR verdict

          `INITIAL CANDIDATE = DIES`

          `MINIMAL REPAIR = SURVIVES SAME DEATH WORKLOAD`

          `REPAIRED SELECTIVE-RECALL LAYER = PROMOTED SURVIVOR UNDER CURRENT REPOSITORY EVIDENCE`

          The result is a **composition**, not replacement of the existing RTS memory index. Existing raw memory/index responsibilities stay in place; the survivor adds the missing selection, freshness, lifecycle, and non-authority boundary.

          ## Deployment / Reality applicability

          This occupant is repository-local and read-only. It has no live service, publish target, payment surface, provider execution, or production runtime route.

          Therefore a fabricated Deployment Identity would be invalid. The equivalent verification boundary is:

          `COMMITTED SOURCE + DETERMINISTIC CLI + FROZEN DESTRUCTIVE TESTS + CURRENT SOURCE HASHES + FREEZER GOVERNANCE VERIFICATION`

          No claim of external-user success, population-scale performance, universal semantic retrieval quality, or autonomous safe promotion is made.

          ## Permanent regression memory

          The DA death tests remain committed in `tests/test_selective_recall_da.py`. Future changes must continue to preserve the cold-irrelevant-strata boundary, relevant-stale rejection, bounded diagnostics, and non-authorizing output.
          EOF

      - name: Re-run frozen METEOR workload before lifecycle transition
        run: |
          set -euxo pipefail
          python -m selective_recall verify
          python -m unittest tests.test_selective_recall -v
          python -m unittest tests.test_selective_recall_da -v
          python -m unittest discover -s tests -p 'test_freezer*.py' -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify

      - name: Transition Child A to VERIFIED through FREEZER CLI
        run: |
          set -euxo pipefail
          printf '%s\n' '{"status":"VERIFIED"}' > /tmp/frz-000011-verified.json
          python -m freezer.cli revise RTS-FRZ-000011 --input /tmp/frz-000011-verified.json
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          p=json.loads((root/'freezer/items/RTS-FRZ-000011/current.json').read_text())
          item=json.loads((root/p['path']).read_text())
          assert item['status']=='VERIFIED', item
          print('Child A VERIFIED')
          PY

      - name: Transition Child A to COMPLETED through FREEZER CLI
        run: |
          set -euxo pipefail
          printf '%s\n' '{"status":"COMPLETED"}' > /tmp/frz-000011-completed.json
          python -m freezer.cli revise RTS-FRZ-000011 --input /tmp/frz-000011-completed.json
          python -m freezer.cli verify
          python -m freezer.build_assessment verify

      - name: Final post-completion regression and sibling boundary
        run: |
          set -euxo pipefail
          python -m selective_recall verify
          python -m unittest tests.test_selective_recall -v
          python -m unittest tests.test_selective_recall_da -v
          python -m unittest discover -s tests -p 'test_freezer*.py' -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          p=json.loads((root/'freezer/items/RTS-FRZ-000011/current.json').read_text())
          child=json.loads((root/p['path']).read_text())
          assert child['status']=='COMPLETED', child
          active=[]
          for q in (root/'freezer/items').glob('RTS-FRZ-*/current.json'):
              ptr=json.loads(q.read_text())
              item=json.loads((root/ptr['path']).read_text())
              if item['status']=='IN_PROGRESS': active.append(item['item_id'])
          assert 'RTS-FRZ-000011' not in active, active
          for item_id in ('RTS-FRZ-000012','RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              ptr=json.loads((root/'freezer/items'/item_id/'current.json').read_text())
              sibling=json.loads((root/ptr['path']).read_text())
              assert sibling['status']=='FROZEN', sibling
              assert sibling['build_authority']=='NOT_APPROVED', sibling
          print('Child A COMPLETED; siblings remain untouched')
          PY

      - name: Assert bounded close diff and self-delete
        run: |
          set -euxo pipefail
          rm .github/workflows/frz-000011-close-once.yml
          python - <<'PY'
          import subprocess
          allowed_exact = {
              '.github/workflows/frz-000011-close-once.yml',
              '.github/workflows/frz-000011-selective-recall-v1.yml',
              'tests/test_selective_recall.py',
              'thin-rts/ultimate-loop/METEOR_RESULT_FRZ_000011_2026-08-27.md',
          }
          allowed_prefixes = (
              'freezer/items/RTS-FRZ-000011/',
              'freezer/index/',
              'freezer/manifests/',
          )
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          forbidden = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if forbidden:
              raise SystemExit(f'forbidden close diff: {forbidden}')
          for sibling in ('RTS-FRZ-000012','RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              if any(p.startswith(f'freezer/items/{sibling}/') for p in changed):
                  raise SystemExit(f'sibling mutated: {sibling}')
          print('bounded close diff OK')
          print('\n'.join(changed))
          PY
          git add -A

      - name: Commit only completed survivor after all gates pass
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'freezer: complete FRZ-000011 selective recall v1'
          git push origin HEAD:feature/frz-000011-selective-recall-memory-lifecycle-v1
