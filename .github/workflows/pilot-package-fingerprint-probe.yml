name: Pilot Package Fingerprint Probe

on:
  pull_request:
    paths:
      - ".github/workflows/pilot-package-fingerprint-probe.yml"
      - "proof_engine_pilot/report_productization_spec_v2.py"
      - "proof_engine_pilot/report_productization_spec_cli.py"
      - "proof_engine_pilot/report_pilot_package.py"
      - "proof_engine_pilot/report_pilot_package_cli.py"
      - "proof_engine_pilot/productization_specs/round_0001/**"
      - "proof_engine_pilot/pilot_packages/round_0001/**"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_internal_product_spec_checkpoint_0016_r1.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate deterministic package fingerprints
        id: generate
        continue-on-error: true
        run: |
          set +e
          python -B -m proof_engine_pilot.report_productization_spec_cli verify > /tmp/spec-verify.log 2>&1
          SPEC_STATUS=$?
          python -B -m proof_engine_pilot.report_pilot_package_cli build-summary > /tmp/pilot-package-fingerprints.json 2> /tmp/package-build-error.log
          PACKAGE_STATUS=$?
          printf '{"spec_status":%s,"package_status":%s}\n' "$SPEC_STATUS" "$PACKAGE_STATUS" > /tmp/probe-status.json
          cat /tmp/spec-verify.log
          cat /tmp/package-build-error.log
          test "$SPEC_STATUS" -eq 0 -a "$PACKAGE_STATUS" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-package-probe
          path: |
            /tmp/spec-verify.log
            /tmp/package-build-error.log
            /tmp/pilot-package-fingerprints.json
            /tmp/probe-status.json
          if-no-files-found: warn
      - name: Fail if generation failed
        if: steps.generate.outcome == 'failure'
        run: exit 1
