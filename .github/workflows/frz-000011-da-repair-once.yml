name: Repair FRZ-000011 DA Once

on:
  push:
    branches:
      - feature/frz-000011-selective-recall-memory-lifecycle-v1
    paths:
      - .github/workflows/frz-000011-da-repair-once.yml

permissions:
  contents: write

concurrency:
  group: frz-000011-da-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000011-selective-recall-memory-lifecycle-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact bounded DA repair
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path('selective_recall/core.py')
          core = core_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        "selected_anchors": [],\n        "excluded": [],\n        "execution_authority": NO_AUTHORITY,\n',
                  '        "selected_anchors": [],\n        "excluded_count": 0,\n        "exclusion_counts": {},\n        "execution_authority": NO_AUTHORITY,\n',
                  'bounded aggregate output',
              ),
              (
                  '    excluded: list[ExcludedRecord] = []\n    candidates: list[tuple[int, MemoryRecord]] = []\n    requested_scopes = set(req.scope_tags)\n\n    for record in records:\n',
                  '    exclusion_counts: dict[str, int] = {}\n    candidates: list[tuple[int, MemoryRecord]] = []\n    requested_scopes = set(req.scope_tags)\n\n    def exclude(reason: str) -> None:\n        exclusion_counts[reason] = exclusion_counts.get(reason, 0) + 1\n\n    for record in records:\n',
                  'aggregate exclusion accumulator',
              ),
              (
                  '        if record.lifecycle_state not in DEFAULT_RECALL_ELIGIBLE_STATES:\n            excluded.append(ExcludedRecord(record.memory_id, "LIFECYCLE_INELIGIBLE"))\n            continue\n        if record.superseded_by is not None:\n            excluded.append(ExcludedRecord(record.memory_id, "SUPERSEDED"))\n            continue\n        freshness = record_freshness(root, record)\n        if freshness != "CURRENT":\n            excluded.append(ExcludedRecord(record.memory_id, freshness))\n            continue\n        if req.event not in record.event_triggers:\n            excluded.append(ExcludedRecord(record.memory_id, "EVENT_MISMATCH"))\n            continue\n        record_scopes = set(record.scope_tags)\n        overlap = requested_scopes & record_scopes\n        if requested_scopes and not overlap:\n            excluded.append(ExcludedRecord(record.memory_id, "SCOPE_MISMATCH"))\n            continue\n\n',
                  '        # Cheap registry metadata gates run before source-body freshness I/O.\n        # This keeps unrelated strata cold as the memory corpus grows.\n        if record.lifecycle_state not in DEFAULT_RECALL_ELIGIBLE_STATES:\n            exclude("LIFECYCLE_INELIGIBLE")\n            continue\n        if record.superseded_by is not None:\n            exclude("SUPERSEDED")\n            continue\n        if req.event not in record.event_triggers:\n            exclude("EVENT_MISMATCH")\n            continue\n        record_scopes = set(record.scope_tags)\n        overlap = requested_scopes & record_scopes\n        if requested_scopes and not overlap:\n            exclude("SCOPE_MISMATCH")\n            continue\n\n        freshness = record_freshness(root, record)\n        if freshness != "CURRENT":\n            exclude(freshness)\n            continue\n\n',
                  'metadata-before-freshness routing',
              ),
              (
                  '    output["excluded"] = [asdict(entry) for entry in sorted(excluded, key=lambda x: x.memory_id)]\n    return output\n',
                  '    output["excluded_count"] = sum(exclusion_counts.values())\n    output["exclusion_counts"] = dict(sorted(exclusion_counts.items()))\n    return output\n',
                  'bounded diagnostic tail',
              ),
          ]

          for old, new, label in replacements:
              count = core.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              core = core.replace(old, new, 1)
          core_path.write_text(core, encoding='utf-8')

          test_path = Path('tests/test_selective_recall.py')
          test = test_path.read_text(encoding='utf-8')
          old = '            self.assertIn("STALE", {entry["reason"] for entry in result["excluded"]})\n'
          new = '            self.assertEqual(result["excluded_count"], 1)\n            self.assertEqual(result["exclusion_counts"], {"STALE": 1})\n'
          if test.count(old) != 1:
              raise SystemExit('stale diagnostic assertion did not match exactly once')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run DA and full bounded regressions before commit
        run: |
          set -euxo pipefail
          python -m unittest tests.test_selective_recall_da -v
          python -m unittest tests.test_selective_recall -v
          python -m unittest discover -s tests -p 'test_freezer*.py' -v
          python -m selective_recall verify
          python -m freezer.cli verify
          python -m freezer.build_assessment verify

      - name: Stage and assert exact bounded commit
        run: |
          set -euxo pipefail
          git diff -- selective_recall/core.py tests/test_selective_recall.py
          git add selective_recall/core.py tests/test_selective_recall.py
          rm .github/workflows/frz-000011-da-repair-once.yml
          git add -u .github/workflows/frz-000011-da-repair-once.yml
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/frz-000011-da-repair-once.yml\nselective_recall/core.py\ntests/test_selective_recall.py'
          test "$staged" = "$expected"

      - name: Commit repaired implementation only after green
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden FRZ-000011 recall against load bloat'
          git push origin HEAD:feature/frz-000011-selective-recall-memory-lifecycle-v1
