name: Promotion Application Preview Implementation Candidate

on:
  pull_request:
    paths:
      - "promotion_application_preview/**"
      - "governed_loop/**"
      - "tests/test_promotion_application_preview.py"
      - "tests/test_governed_loop.py"
      - "scripts/tmp_integrate_promotion_preview.py"
      - ".github/workflows/promotion-application-preview-implementation-candidate.yml"

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate governed-loop integration candidate
        run: PYTHONPATH=. python -B scripts/tmp_integrate_promotion_preview.py
      - name: Verify integrated candidate
        run: |
          python -B -m promotion_application_preview.cli verify
          python -B -m governed_loop.cli verify
          python -B -m unittest discover -s tests -p 'test_promotion_application_preview.py' -v
          python -B -m unittest discover -s tests -p 'test_governed_loop.py' -v
          python -B -m unittest discover -s tests -v
      - name: Commit verified integration and remove candidate machinery
        run: |
          rm -f scripts/tmp_integrate_promotion_preview.py
          rm -f .github/workflows/promotion-application-preview-implementation-candidate.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Promotion Application Preview into governed loop"
          git push
