name: Human Review Ledger Completion Candidate

on:
  pull_request:

permissions:
  contents: write

jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate completion lifecycle
        run: python .github/scripts/complete_human_review_ledger_v1.py
      - name: Verify governed records
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
      - name: Run full tests
        run: python -B -m unittest discover -s tests -v
      - name: Finalize exact completion lifecycle
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm .github/scripts/complete_human_review_ledger_v1.py
          git rm .github/workflows/human-review-ledger-completion-candidate.yml
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m asset_manifest.cli verify
          python -m loop_core.cli verify
          python -m execution_controller.cli verify
          python -m outcome_evidence.cli verify
          python -m skill_regression.cli verify
          python -m learning_proposals.cli verify
          python -m human_review_ledger.cli verify
          python -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation/HUMAN_REVIEW_LEDGER_V1_COMPLETION_TASK.md \
            freezer/items/RTS-FRZ-000009/v004.json \
            freezer/items/RTS-FRZ-000009/v005.json \
            freezer/items/RTS-FRZ-000009/current.json \
            freezer/index/items.json \
            freezer/index/priority.json \
            freezer/index/build_priority.json \
            freezer/manifests/manifest.sha256 \
            governed_loop/runs/current.json \
            tests/test_governed_loop.py
          git commit -m "Complete Human Review Ledger v1"
          git push origin "HEAD:${HEAD_BRANCH}"
