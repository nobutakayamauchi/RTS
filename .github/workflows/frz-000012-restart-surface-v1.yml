name: Validate FRZ-000012 Restart Surface v1

on:
  push:
    branches:
      - feature/frz-000012-compact-active-restart-surface-v1
    paths:
      - restart_surface/**
      - restart/**
      - tests/test_restart_surface.py
      - tests/test_restart_surface_da.py
      - freezer/items/RTS-FRZ-000012/**
      - .github/workflows/frz-000012-restart-surface-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000012-compact-active-restart-surface-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify restart surface
        run: python -m restart_surface verify
      - name: Run B baseline and DA
        run: python -m unittest tests.test_restart_surface tests.test_restart_surface_da -v
      - name: Regress completed Child A
        run: python -m unittest tests.test_selective_recall tests.test_selective_recall_da -v
      - name: Regress FREEZER
        run: |
          python -m unittest discover -s tests -p 'test_freezer*.py' -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Assert completed stack boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          def cur(i):
              p=json.loads((root/'freezer/items'/i/'current.json').read_text())
              return json.loads((root/p['path']).read_text())
          assert cur('RTS-FRZ-000011')['status']=='COMPLETED'
          assert cur('RTS-FRZ-000012')['status']=='COMPLETED'
          for i in ('RTS-FRZ-000013','RTS-FRZ-000014','RTS-FRZ-000015'):
              x=cur(i)
              assert x['status']=='FROZEN' and x['build_authority']=='NOT_APPROVED', x
          active=[]
          for p in (root/'freezer/items').glob('RTS-FRZ-*/current.json'):
              q=json.loads(p.read_text())
              x=json.loads((root/q['path']).read_text())
              if x['status']=='IN_PROGRESS': active.append(x['item_id'])
          assert active==[], active
          print('A+B completed; C-E frozen; WIP clear')
          PY
