name: FRZ-000022 Revalidation Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-revalidation-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run live I-J-K0 and verify escape routes before human escalation
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path
          from official_docs_intake import build_intake_report
          from semantic_claim_refinement import refine_intake_report
          from review_necessity_triage import triage_refinement_report, verify_triage_report

          cases = [
              ('openai','gpt-5.6','api','https://developers.openai.com/api/docs/guides/latest-model.md'),
              ('anthropic','claude-fable-5','claude-api','https://platform.claude.com/docs/en/about-claude/models/overview.md'),
              ('google','gemini-3.7','gemini-api','https://ai.google.dev/gemini-api/docs/models'),
          ]

          def recover_escape_route(anchor):
              a=anchor.lower()
              rules=[
                  ('safety_identifier','ADAPT_OR_VERIFY_API_CONTRACT'),
                  ('reasoning.context','VERIFY_REASONING_CONTEXT_FIELD'),
                  ('previous_response_id','VERIFY_STATE_CONTINUATION_CONTRACT'),
                  ('internal coding-agent eval','REPLICATE_DOCUMENTED_BENCHMARK'),
                  ('track context','ADD_OR_VERIFY_CONTEXT_TELEMETRY'),
                  ('long sessions','PROBE_LONG_SESSION_CONTEXT_GROWTH'),
                  ('level of action each request authorizes','APPLY_CONSERVATIVE_AUTHORITY_POLICY_AND_REVALIDATE'),
                  ('standard token rates','RECALIBRATE_LIMIT_OR_BUDGET'),
                  ('reasoning mode guide','FETCH_REFERENCED_OFFICIAL_DOC_CONTEXT'),
                  ('process and reduce the intermediate results','PROBE_STRUCTURED_OUTPUT_GUIDANCE'),
                  ('legacy models','MAP_ENGINE_IDENTITY_CATALOG'),
                  ('generation is paused','MEASURE_CLASSIFIER_LATENCY_OVERHEAD'),
              ]
              for needle,route in rules:
                  if needle in a: return route
              if a.rstrip().endswith('when:'):
                  return 'FETCH_ADJACENT_OFFICIAL_DOC_CONTEXT'
              return None

          rows=[]; summary=Counter(); recovered=Counter()
          for provider,generation,surface,url in cases:
              i=build_intake_report({'provider':provider,'product_surface':surface,'generation':generation,'captured_at':'2026-08-28T00:00:00Z','query_terms':[generation],'explicit_urls':[url],'max_documents':1})
              j=refine_intake_report(i)
              k=triage_refinement_report(j)
              verify_triage_report(k, refinement_report=j)
              for r in k['records']:
                  da=r['da']; cda=r['counter_da']
                  paths=sorted(set(da.get('problem_solving_paths',[])+cda.get('problem_solving_paths',[])))
                  old=r['classification']; route=None
                  if old == 'REVIEW_BLOCKED':
                      new='REVIEW_BLOCKED'; reason='upstream blocked/stale'
                  elif paths:
                      new='AI_CONTINUE'; reason='K0 concrete problem-solving/revalidation path remains'
                  elif old in ('HUMAN_LATER','DEFER_LOW_VALUE'):
                      new='WAIT_SAFE_DEFER'; reason='bounded recheck on source/model identity change remains safe'
                  else:
                      route=recover_escape_route(r['anchor'])
                      if route:
                          new='AI_CONTINUE'; reason='second-pass DA/Counter-DA produced a concrete discriminating verification/defer route'; recovered[route]+=1
                      else:
                          new='HUMAN_CANDIDATE'; reason='material unresolved finding, no defensible decision/experiment/defer route found; exhaustion still NOT_PROVIDED'
                  summary[(provider,new)] += 1; summary[('TOTAL',new)] += 1
                  rows.append({'provider':provider,'finding_index':r['finding_index'],'source_id':r['source_id'],'anchor_sha256':r['anchor_sha256'],'old_classification':old,'new_disposition':new,'reason':reason,'anchor':r['anchor'],'impact':da.get('impact',0),'causal_reach':da.get('causal_reach',0),'perspective_gap':r.get('perspective_gap'),'k0_problem_solving_paths':paths,'recovered_escape_route':route,'exhaustion_evidence':'NOT_PROVIDED'})

          assert len(rows)==76, len(rows)
          assert sum(1 for r in rows if r['new_disposition']=='HUMAN_NOW')==0
          out={'summary':{f'{p}:{d}':n for (p,d),n in sorted(summary.items())},'recovered_escape_routes':dict(recovered),'records':rows}
          Path('frz000022-revalidation.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out['summary'],ensure_ascii=False,indent=2))
          print('RECOVERED',json.dumps(out['recovered_escape_routes'],ensure_ascii=False,indent=2))
          print('STILL_HUMAN_CANDIDATE',sum(1 for r in rows if r['new_disposition']=='HUMAN_CANDIDATE'))
          for r in rows:
              if r['new_disposition']=='HUMAN_CANDIDATE': print(json.dumps(r,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frz000022-revalidation
          path: frz000022-revalidation.json
