name: External Challenger Abolition Gate

on:
  pull_request:
    paths:
      - "external_challenger/**"
      - "docs/audit/RTS_EXTERNAL_REPLACEMENT_CHALLENGER_2026-08.md"
      - "docs/audit/RTS_FINAL_ABOLITION_GATE_2026-08.md"
      - ".github/workflows/external-challenger-abolition-gate.yml"
  push:
    branches:
      - main
    paths:
      - "external_challenger/**"
      - "docs/audit/RTS_EXTERNAL_REPLACEMENT_CHALLENGER_2026-08.md"
      - "docs/audit/RTS_FINAL_ABOLITION_GATE_2026-08.md"
      - ".github/workflows/external-challenger-abolition-gate.yml"

permissions:
  contents: read

jobs:
  thin-policy-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0
      - name: Check challenger policy formatting
        run: opa fmt --fail external_challenger/policy/closure.rego external_challenger/policy/closure_test.rego
      - name: Run abolition adversary tests
        run: opa test external_challenger/policy -v
