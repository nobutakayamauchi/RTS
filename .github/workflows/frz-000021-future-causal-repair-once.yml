name: FRZ-000021 Future Causal Repair Once

on:
  push:
    branches:
      - feature/frz-000021-human-review-necessity-da-v1
    paths:
      - .github/workflows/frz-000021-future-causal-repair-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000021-human-review-necessity-da-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm future-causal DA death
        run: |
          python -m unittest tests.test_review_necessity_triage_da.ReviewNecessityTriageDATests.test_future_breaking_change_notice_is_high_causal_even_before_change -v && exit 1 || true
      - name: Add explicit future breaking-change transition signal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('review_necessity_triage/core.py')
          s=p.read_text()
          marker='''    AttentionSignal(\n        "request_response_schema",\n'''
          insertion='''    AttentionSignal(\n        "future_breaking_version_transition",\n        (\n            r"\\bbreaking changes?\\b",\n            r"\\bversion\\b.{0,120}\\b(?:change|changed|changes|update|updated|updates|replace|replaced|replaces)\\b",\n            r"\\bnotice\\b.{0,120}\\b(?:version|latest|breaking change)\\b",\n        ),\n        3,\n        5,\n        3,\n        ("ENGINE_IDENTITY_ROUTING", "API_CONTRACT", "H_TRANSITION_CLASSIFICATION", "F_ENGINE_PROFILE"),\n    ),\n    AttentionSignal(\n        "request_response_schema",\n'''
          if s.count(marker)!=1:
              raise SystemExit(f'insertion marker mismatch: {s.count(marker)}')
          p.write_text(s.replace(marker,insertion))
          PY
      - name: Counter-DA and regression
        run: |
          python -m unittest tests.test_review_necessity_triage tests.test_review_necessity_triage_da -v
          python -m unittest tests.test_semantic_claim_refinement tests.test_semantic_claim_refinement_da -v
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
      - name: Commit future-causal repair only
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add review_necessity_triage/core.py
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: preserve future breaking-change causal reach'
          git push origin HEAD:feature/frz-000021-human-review-necessity-da-v1
