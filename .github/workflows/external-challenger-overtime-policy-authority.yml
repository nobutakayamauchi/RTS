name: External Challenger Overtime Policy Authority

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  authorize-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POLICY_ACTIVATION_PREDICATE: https://example.org/external-challenger/policy-activation/v1
      POLICY_ROLLBACK_PREDICATE: https://example.org/external-challenger/policy-rollback/v1
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.0

      - name: Validate and package fixed policy v1
        shell: bash
        run: |
          set -euo pipefail
          opa fmt -w external_challenger/overtime/policy.rego
          POLICY_SHA="$(sha256sum external_challenger/overtime/policy.rego | awk '{print $1}')"
          tar -czf overtime-policy.tgz external_challenger/overtime/policy.rego
          BUNDLE_SHA="$(sha256sum overtime-policy.tgz | awk '{print $1}')"
          AUTHORITY="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          jq -n \
            --arg version "OVERTIME-POLICY-V1" \
            --arg policy_sha "$POLICY_SHA" \
            --arg bundle_sha "$BUNDLE_SHA" \
            --arg source "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg authority "$AUTHORITY" \
            '{policy_version:$version,policy_sha256:$policy_sha,bundle_sha256:$bundle_sha,source_revision:$source,run_id:$run,authority_identity:$authority,status:"ACTIVE"}' \
            > policy-activation.json
          echo "POLICY_V1_SHA=$POLICY_SHA" >> "$GITHUB_ENV"
          echo "POLICY_V1_BUNDLE_SHA=$BUNDLE_SHA" >> "$GITHUB_ENV"

      - name: Attest policy v1 bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: overtime-policy.tgz

      - name: Attest policy v1 activation decision
        uses: actions/attest@v4
        with:
          subject-path: policy-activation.json
          predicate-type: https://example.org/external-challenger/policy-activation/v1
          predicate-path: policy-activation.json

      - name: Build independently versioned policy v2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp external_challenger/overtime/policy.rego policy-v2.rego
          printf '\n# OVERTIME-POLICY-V2 governance transition rehearsal\n' >> policy-v2.rego
          POLICY_V2_SHA="$(sha256sum policy-v2.rego | awk '{print $1}')"
          tar -czf overtime-policy-v2.tgz policy-v2.rego
          POLICY_V2_BUNDLE_SHA="$(sha256sum overtime-policy-v2.tgz | awk '{print $1}')"
          AUTHORITY="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          jq -n \
            --arg version "OVERTIME-POLICY-V2" \
            --arg policy_sha "$POLICY_V2_SHA" \
            --arg bundle_sha "$POLICY_V2_BUNDLE_SHA" \
            --arg source "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg authority "$AUTHORITY" \
            '{policy_version:$version,policy_sha256:$policy_sha,bundle_sha256:$bundle_sha,source_revision:$source,run_id:$run,authority_identity:$authority,status:"ACTIVE"}' \
            > policy-v2-activation.json
          echo "POLICY_V2_SHA=$POLICY_V2_SHA" >> "$GITHUB_ENV"

      - name: Attest policy v2 bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: overtime-policy-v2.tgz

      - name: Attest policy v2 activation decision
        uses: actions/attest@v4
        with:
          subject-path: policy-v2-activation.json
          predicate-type: https://example.org/external-challenger/policy-activation/v1
          predicate-path: policy-v2-activation.json

      - name: Create explicit rollback authority decision to v1
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITY="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg run "$GITHUB_RUN_ID" \
            --arg authority "$AUTHORITY" \
            --arg from "$POLICY_V2_SHA" \
            --arg rollback "$POLICY_V1_SHA" \
            --arg source "$GITHUB_SHA" \
            --arg now "$NOW" \
            '{schema:"external-policy-rollback-v1",run_id:$run,authority_identity:$authority,from_policy_digest:$from,rollback_digest:$rollback,source_revision:$source,rollback_authorized:true,decided_at:$now}' \
            > policy-rollback.json

      - name: Attest policy rollback decision
        uses: actions/attest@v4
        with:
          subject-path: policy-rollback.json
          predicate-type: https://example.org/external-challenger/policy-rollback/v1
          predicate-path: policy-rollback.json

      - name: Verify policy authority identities and rollback closure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          gh attestation verify overtime-policy.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null
          gh attestation verify policy-activation.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --predicate-type "$POLICY_ACTIVATION_PREDICATE" >/dev/null
          gh attestation verify overtime-policy-v2.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null
          gh attestation verify policy-v2-activation.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --predicate-type "$POLICY_ACTIVATION_PREDICATE" >/dev/null
          gh attestation verify policy-rollback.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --predicate-type "$POLICY_ROLLBACK_PREDICATE" >/dev/null
          jq -n \
            --arg authority "$SIGNER" \
            --arg rollback "$POLICY_V1_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{kind:"policy_rollback",policy:{activation_attestation_verified:true,authority_identity:$authority,rollback_digest:$rollback,run_id:$run,rollback_authorized:true},expected:{policy_authority_identity:$authority,rollback_digest:$rollback,run_id:$run}}' \
            > policy-rollback-input.json
          test "$(opa eval --format raw --input policy-rollback-input.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_policy_rollback')" = true
          jq '.policy.rollback_digest="unauthorized"' policy-rollback-input.json > /tmp/wrong-policy-rollback.json
          test "$(opa eval --format raw --input /tmp/wrong-policy-rollback.json --data external_challenger/overtime/policy.rego 'data.external_challenger.overtime.allow_policy_rollback')" = false
          # The old proof must remain independently valid after v2 activation and rollback.
          gh attestation verify overtime-policy.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null

      - name: Unauthorized policy replacement must fail verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp overtime-policy.tgz /tmp/tampered-policy.tgz
          printf 'tamper' >> /tmp/tampered-policy.tgz
          SIGNER="$GITHUB_REPOSITORY/.github/workflows/external-challenger-overtime-policy-authority.yml"
          if gh attestation verify /tmp/tampered-policy.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null 2>&1; then
            echo 'tampered policy unexpectedly verified'
            exit 1
          fi

      - name: Preserve policy attestations for offline verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-policy
          (cd offline-policy && gh attestation download ../overtime-policy.tgz -R "$GITHUB_REPOSITORY")
          (cd offline-policy && gh attestation download ../policy-rollback.json -R "$GITHUB_REPOSITORY")
          for bundle in offline-policy/sha256:*.jsonl; do
            [ -e "$bundle" ] || continue
            mv "$bundle" "${bundle/sha256:/sha256-}"
          done
          gh attestation trusted-root > offline-policy/trusted-root.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: overtime-policy-authority
          path: |
            overtime-policy.tgz
            policy-activation.json
            overtime-policy-v2.tgz
            policy-v2-activation.json
            policy-rollback.json
            policy-rollback-input.json
            offline-policy/**
          if-no-files-found: error
          retention-days: 30
