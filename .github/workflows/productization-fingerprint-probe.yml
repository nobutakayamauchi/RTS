name: Productization Fingerprint Probe

on:
  pull_request:
    paths:
      - ".github/workflows/productization-fingerprint-probe.yml"
      - "proof_engine_pilot/report_template_review.py"
      - "proof_engine_pilot/report_template_review_cli.py"
      - "proof_engine_pilot/reporting/**"
      - "proof_engine_pilot/report_reviews/**"
      - "pilot_runs/reconnect_pilot_p3/evidence_report_template_review_checkpoint_0014.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print reviewed report fingerprints
        run: |
          python - <<'PY'
          import json
          from proof_engine_pilot.report_template_review import build_report_template_review
          bundle = build_report_template_review()
          payload = {
              "template_fingerprint": bundle["template"]["template_fingerprint"],
              "pack_fingerprint": bundle["pack"]["pack_fingerprint"],
              "report_fingerprints": {
                  report["report_id"]: report["report_fingerprint"]
                  for report in bundle["pack"]["reports"]
              },
          }
          print("PRODUCTIZATION_FINGERPRINTS=" + json.dumps(payload, sort_keys=True))
          PY
