name: FRZ-000024 Start Once

# retry after build-assessment schema repair
on:
  push:
    branches:
      - feature/frz-000024-catalog-cost-false-green-repair-v1
    paths:
      - .github/workflows/frz-000024-start-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000024-catalog-cost-false-green-repair-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify K2 completed, 000024 absent, WIP clear
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def current(item_id):
              p=json.loads((Path('freezer/items')/item_id/'current.json').read_text())
              return json.loads(Path(p['path']).read_text())
          assert current('RTS-FRZ-000023')['status']=='COMPLETED'
          assert not Path('freezer/items/RTS-FRZ-000024/current.json').exists()
          active=[]
          for p in Path('freezer/items').glob('RTS-FRZ-*/current.json'):
              row=current(p.parent.name)
              if row['status']=='IN_PROGRESS': active.append(row['item_id'])
          assert active==[], active
          print('K2 COMPLETED; 000024 absent; WIP clear')
          PY
      - name: Capture FRZ-000024
        run: python -m freezer.cli add --input docs/implementation/frz000024_inputs/item_input.json
      - name: Build assessment
        run: python -m freezer.build_assessment create RTS-FRZ-000024 --input docs/implementation/frz000024_inputs/build_assessment_input.json
      - name: Preflight
        run: python -m freezer.preflight create RTS-FRZ-000024 --input docs/implementation/frz000024_inputs/preflight_input.json
      - name: Apply explicit user approval
        run: python -m freezer.cli revise RTS-FRZ-000024 --input docs/implementation/frz000024_inputs/approve_selected.json
      - name: Enter governed WIP
        run: python -m freezer.cli revise RTS-FRZ-000024 --input docs/implementation/frz000024_inputs/start_in_progress.json
      - name: Verify governed start
        run: |
          python -m freezer.cli verify
          python -m freezer.build_assessment verify
          python -m freezer.preflight verify
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freezer/items/RTS-FRZ-000024/current.json').read_text())
          row=json.loads(Path(p['path']).read_text())
          assert row['status']=='IN_PROGRESS', row
          assert row['build_authority']=='APPROVED', row
          print('FRZ-000024 IN_PROGRESS')
          PY
      - name: Commit governed FREEZER start
        run: |
          git config user.name rts-bot
          git config user.email rts-bot@users.noreply.github.com
          git add freezer
          git diff --cached --quiet && exit 1 || true
          git commit -m 'freezer: start FRZ-000024 catalog cost false-green repair v1'
          git push origin HEAD:feature/frz-000024-catalog-cost-false-green-repair-v1
