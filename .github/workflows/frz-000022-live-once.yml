name: FRZ-000022 Live Once

on:
  push:
    branches:
      - feature/frz-000022-exhausted-ai-human-escalation-gate-v1
    paths:
      - .github/workflows/frz-000022-live-once.yml
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000022-exhausted-ai-human-escalation-gate-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run live I-J-K0-K1 official-doc surface after monotonicity repair
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from official_docs_intake import build_intake_report
          from semantic_claim_refinement import refine_intake_report
          from review_necessity_triage import triage_refinement_report, verify_triage_report
          from human_escalation_gate import evaluate_escalation_report, verify_escalation_report

          cases = [
              ('openai','gpt-5.6','api','https://developers.openai.com/api/docs/guides/latest-model.md'),
              ('anthropic','claude-fable-5','claude-api','https://platform.claude.com/docs/en/about-claude/models/overview.md'),
              ('google','gemini-3.7','gemini-api','https://ai.google.dev/gemini-api/docs/models'),
          ]
          total=Counter(); output=[]
          for provider,generation,surface,url in cases:
              i=build_intake_report({
                  'provider':provider,'product_surface':surface,'generation':generation,
                  'captured_at':'2026-08-28T00:30:00Z','query_terms':[generation],
                  'explicit_urls':[url],'max_documents':1,
              })
              j=refine_intake_report(i)
              k0=triage_refinement_report(j)
              verify_triage_report(k0, refinement_report=j)
              k1=evaluate_escalation_report(k0)
              verify_escalation_report(k1, triage_report=k0)
              c=Counter(r['disposition'] for r in k1['records'])
              total.update(c); total['UNRESOLVED'] += len(j['audit']['unresolved'])
              print('PROVIDER',provider,'UNRESOLVED',len(j['audit']['unresolved']),dict(c))
              for row in k1['records']:
                  if row['recovered_escape_routes']:
                      print('RECOVERED', json.dumps({
                          'provider':provider,
                          'finding_index':row['finding_index'],
                          'k0_classification':row['k0_classification'],
                          'disposition':row['disposition'],
                          'recovered_escape_routes':row['recovered_escape_routes'],
                          'initial_routes':row['initial_routes'],
                          'anchor':row['anchor'],
                      }, ensure_ascii=False))
              output.append({
                  'provider':provider,
                  'unresolved':len(j['audit']['unresolved']),
                  'counts':dict(c),
                  'records':k1['records'],
              })
          print('TOTAL',dict(total))
          # Counts are evidence, not an optimization target. The safety
          # invariants are cardinality preservation, no blocked input, and no
          # premature human handoff while a valid AI/defer route exists.
          assert total['UNRESOLVED'] == 76, total
          assert total['AI_CONTINUE'] > 0, total
          assert total['WAIT_SAFE_DEFER'] > 0, total
          assert total['AI_RESOLVE'] == 0, total
          assert total['HUMAN_CANDIDATE'] == 0, total
          assert total['HUMAN_NOW'] == 0, total
          assert total['REVIEW_BLOCKED'] == 0, total
          Path('frz000022-live.json').write_text(json.dumps({'total':dict(total),'providers':output},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frz000022-live
          path: frz000022-live.json
