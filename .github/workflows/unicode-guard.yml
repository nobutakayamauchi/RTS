name: Unicode Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/prepare-start-promotion-application-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate governed gate state
        run: |
          rm -f docs/implementation/PROMOTION_PREVIEW_PREPARE_ERROR.txt
          python -B scripts/tmp_prepare_promotion_preview.py > docs/implementation/PROMOTION_PREVIEW_PREPARE_ERROR.txt 2>&1 || true
      - name: Commit generated state or diagnostic
        run: |
          printf 'diagnostic-run\n' > docs/implementation/PROMOTION_PREVIEW_DIAGNOSTIC_RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/implementation/PROMOTION_PREVIEW_PREPARE_ERROR.txt
          git add -f docs/implementation/PROMOTION_PREVIEW_DIAGNOSTIC_RUN.txt
          git add -A
          git commit -m "Persist Promotion Application Preview diagnostic"
          git push
      - name: Verify generated state
        run: |
          test ! -s docs/implementation/PROMOTION_PREVIEW_PREPARE_ERROR.txt
          test ! -f .tmp/promotion_preview_prepare_error.txt
          python -B -m freezer.cli verify
          python -B -m freezer.build_assessment verify
          python -B -m freezer.preflight verify
          python -B -m governed_loop.cli verify
          python -B -m unittest discover -s tests -v

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run invisible unicode guard
        run: python3 scripts/check_invisible_unicode.py
