name: RTS Shape-Up Inventory Probe

on:
  push:
    branches:
      - agent/rts-shapeup-inventory-v1
    paths:
      - scripts/maintenance/measure_repository.py
      - .github/workflows/rts-shapeup-inventory-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile inventory tool
        run: python -m py_compile scripts/maintenance/measure_repository.py

      - name: Measure main-equivalent baseline
        run: |
          mkdir -p /tmp/rts-shapeup
          python scripts/maintenance/measure_repository.py \
            --root . \
            --json /tmp/rts-shapeup/RTS_REPOSITORY_INVENTORY_V1.json \
            --markdown /tmp/rts-shapeup/RTS_REPOSITORY_INVENTORY_V1.md \
            --commit "${GITHUB_SHA}" \
            --exclude scripts/maintenance/measure_repository.py \
            --exclude .github/workflows/rts-shapeup-inventory-probe.yml

      - name: Validate and print measured reports
        run: |
          python -m json.tool /tmp/rts-shapeup/RTS_REPOSITORY_INVENTORY_V1.json >/dev/null
          echo '===RTS_INVENTORY_JSON_BEGIN==='
          cat /tmp/rts-shapeup/RTS_REPOSITORY_INVENTORY_V1.json
          echo '===RTS_INVENTORY_JSON_END==='
          echo '===RTS_INVENTORY_MARKDOWN_BEGIN==='
          cat /tmp/rts-shapeup/RTS_REPOSITORY_INVENTORY_V1.md
          echo '===RTS_INVENTORY_MARKDOWN_END==='

      - name: Upload inventory probe
        uses: actions/upload-artifact@v4
        with:
          name: rts-shapeup-inventory-probe
          path: /tmp/rts-shapeup/
          if-no-files-found: error
