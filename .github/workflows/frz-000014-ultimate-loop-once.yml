name: FRZ-000014 Ultimate Loop Once

on:
  push:
    branches:
      - feature/frz-000014-reuse-efficiency-knowledge-debt-metrics-v1
    paths:
      - .github/workflows/frz-000014-ultimate-loop-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: '.'

jobs:
  ultimate-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frz-000014-reuse-efficiency-knowledge-debt-metrics-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate D runner syntax
        run: python -m py_compile scripts/run_frz000014_ultimate_loop.py
      - name: Repair generated CLI newline escape
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_frz000014_ultimate_loop.py')
          s=p.read_text()
          start=s.index("write('reuse_metrics/cli.py',")
          end=s.index("write('reuse_metrics/__main__.py'", start)
          block=s[start:end]
          old=r"sort_keys=True)+'\n')"
          new=r"sort_keys=True)+'\\n')"
          if block.count(old)!=1:
              raise SystemExit(f'CLI newline marker mismatch: {block.count(old)}')
          block=block.replace(old,new)
          p.write_text(s[:start]+block+s[end:])
          PY
      - name: Run Child D Ultimate Loop
        run: python scripts/run_frz000014_ultimate_loop.py
